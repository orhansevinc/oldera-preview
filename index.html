<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OldERA 1298</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;width:100%;height:100%;border:0;background:#000}</style>
</head>
<body>
<iframe id="client" src="client1298.html?v=6" allow="fullscreen; pointer-lock" title="OldERA 1298"></iframe>
<script>
const frame=document.getElementById('client');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d)return;
    if(!d.getElementById('oldera-uif-patch')){
      const s=d.createElement('script');
      s.id='oldera-uif-patch';
      s.src='ui1298_patch.js?v=6';
      d.head.appendChild(s);
    }
    d.addEventListener('click',e=>{
      if(e.target?.id!=='loginBtn')return;
      const id=d.getElementById('idbox')?.value?.trim();
      const pw=d.getElementById('pwbox')?.value;
      if(id!=='osevinc'||pw!=='osevinc'){
        e.preventDefault();
        e.stopImmediatePropagation();
        frame.contentWindow.alert('Test hesabı: osevinc / osevinc');
      }
    },true);
  }catch(e){console.warn('OldERA boot patch could not be injected',e)}
});
</script>
</body>
</html>
