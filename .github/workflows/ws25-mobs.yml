name: WS25 Mobs

on:
  push:
    branches:
      - ws25-mob-ai
    paths:
      - 'services/ko1298-mobs/**'
      - 'tests/ko1298-mobs/**'
      - 'world-data/mobs/**'
      - 'workstreams/ws25/**'
      - '.github/workflows/ws25-mobs.yml'
  pull_request:
    paths:
      - 'services/ko1298-mobs/**'
      - 'tests/ko1298-mobs/**'
      - 'world-data/mobs/**'
      - 'workstreams/ws25/**'
      - '.github/workflows/ws25-mobs.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run WS25 mob lifecycle tests
        run: node --test tests/ko1298-mobs/*.test.cjs
