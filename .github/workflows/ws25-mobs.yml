name: WS25 Mobs

on:
  push:
    branches:
      - ws25-mob-ai
    paths:
      - 'services/ko1298-mobs/**'
      - 'tests/ko1298-mobs/**'
      - 'world-data/mobs/**'
      - 'workstreams/ws25/**'
      - '.github/workflows/ws25-mobs.yml'
  pull_request:
    paths:
      - 'services/ko1298-mobs/**'
      - 'tests/ko1298-mobs/**'
      - 'world-data/mobs/**'
      - 'workstreams/ws25/**'
      - '.github/workflows/ws25-mobs.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact WS14 terrain/world authority
        uses: actions/checkout@v4
        with:
          repository: orhansevinc/oldera-preview
          ref: ed5f806ce7505f4dfae406e4164735def63b6c86
          path: .authority/ws14
          sparse-checkout: |
            services/ko1298-world
          fetch-depth: 1

      - name: Checkout exact WS19 combat authority
        uses: actions/checkout@v4
        with:
          repository: orhansevinc/oldera-preview
          ref: 28eb4f38753ffbc54c60abbd2a32832301284c06
          path: .authority/ws19
          sparse-checkout: |
            services/ko1298-combat
          fetch-depth: 1

      - name: Checkout exact WS11 visibility authority
        uses: actions/checkout@v4
        with:
          repository: orhansevinc/oldera-preview
          ref: 944b6ff9b6329af29f1048a74aa6e14fca141639
          path: .authority/ws11
          sparse-checkout: |
            protocol-lab/VISIBILITY_PROTOCOL_PROFILE.json
            protocol-lab/visibility-fixtures/monster_in_spawn.bin
            tools/ws11_protocol/visibility.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout pinned 1298 Moradon SMD
        uses: actions/checkout@v4
        with:
          repository: Open-KO/KnightOnline
          ref: 7d6cf81093e142c928c2ac9510512b2b182178b5
          path: .authority/openko
          sparse-checkout: |
            assets/Server/MAP/moradon_0826.smd
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout exact WS31 Moradon catalog summary
        uses: actions/checkout@v4
        with:
          repository: orhansevinc/oldera-preview
          ref: 546d2ab62cd46a97f3385ebcddbe0c775a02c2eb
          path: .authority/ws31
          sparse-checkout: |
            data-catalog/generated/catalog-summary.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run WS25 deterministic unit, visibility and combat lifecycle tests
        env:
          WS25_WS19_COMBAT_MODULE: ${{ github.workspace }}/.authority/ws19/services/ko1298-combat
          WS25_WS19_PROVIDER_SHA: 28eb4f38753ffbc54c60abbd2a32832301284c06
        run: >-
          node --test
          tests/ko1298-mobs/mob-lifecycle.test.cjs
          tests/ko1298-mobs/mob-runtime.test.cjs
          tests/ko1298-mobs/mob-combat-lifecycle-real.test.cjs

      - name: Resolve all verified Moradon slots with real WS14 SMD
        env:
          WS25_WS14_WORLD_MODULE: ${{ github.workspace }}/.authority/ws14/services/ko1298-world
          WS25_MORADON_SMD: ${{ github.workspace }}/.authority/openko/assets/Server/MAP/moradon_0826.smd
          WS25_WS31_SUMMARY: ${{ github.workspace }}/.authority/ws31/data-catalog/generated/catalog-summary.json
          WS25_WS14_PROVIDER_SHA: ed5f806ce7505f4dfae406e4164735def63b6c86
          WS25_WS31_PROVIDER_SHA: 546d2ab62cd46a97f3385ebcddbe0c775a02c2eb
        run: |
          set -o pipefail
          node --test tests/ko1298-mobs/mob-height-authority-real.test.cjs 2>&1 | tee ws25-height-authority.log

      - name: Verify runtime identity and WS11/WS14 visibility compatibility
        env:
          WS25_WS14_WORLD_MODULE: ${{ github.workspace }}/.authority/ws14/services/ko1298-world
          WS25_MORADON_SMD: ${{ github.workspace }}/.authority/openko/assets/Server/MAP/moradon_0826.smd
          WS25_WS11_ROOT: ${{ github.workspace }}/.authority/ws11
          WS25_WS11_PROVIDER_SHA: 944b6ff9b6329af29f1048a74aa6e14fca141639
          WS25_WS14_PROVIDER_SHA: ed5f806ce7505f4dfae406e4164735def63b6c86
        run: |
          set -o pipefail
          node --test tests/ko1298-mobs/mob-visibility-authority-real.test.cjs 2>&1 | tee ws25-visibility-authority.log

      - name: Upload WS25 authority diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws25-moradon-authority
          path: |
            ws25-height-authority.log
            ws25-visibility-authority.log
          if-no-files-found: error
          retention-days: 7
