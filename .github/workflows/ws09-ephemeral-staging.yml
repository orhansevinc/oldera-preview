name: WS09 Ephemeral Test Link

on:
  workflow_dispatch:
    inputs:
      ws10_run_id:
        description: Exact successful WS10 Moradon E2E run ID
        required: true
        type: string
      ws10_head_sha:
        description: Exact 40-char WS10 head SHA for that PASS run
        required: true
        type: string
      ws10_pass_artifact_name:
        description: Exact WS10 artifact containing explicit Moradon PASS metadata/evidence
        required: true
        type: string
      ws10_client_artifact_name:
        description: Exact WS10 artifact containing frozen passing KnightOnLine.js/.wasm/.data (may equal PASS artifact)
        required: true
        type: string
      ws50_handoff_ref:
        description: Exact 40-char WS50 commit containing integration-rehearsal/STAGING_LINK_HANDOFF.md
        required: true
        type: string
      ws01_sha:
        description: Exact WS01 SHA frozen by WS50 handoff
        required: true
        type: string
      ws02_sha:
        description: Exact WS02 SHA frozen by WS50 handoff
        required: true
        type: string
      ws03_sha:
        description: Exact WS03 SHA frozen by WS50 handoff
        required: true
        type: string
      ws12_sha:
        description: Exact WS12 SHA frozen by WS50 handoff
        required: true
        type: string
      ws14_sha:
        description: Exact WS14 SHA frozen by WS50 handoff
        required: true
        type: string
      ws38_sha:
        description: Exact WS38 SHA frozen by WS50 handoff
        required: true
        type: string
      keepalive_minutes:
        description: Minutes to keep temporary HTTPS/WSS URL alive after all public smoke gates pass (5-45)
        required: true
        default: '30'
        type: string
  push:
    branches: [ws09-production-infra]
    paths:
      - 'workstreams/ws09/EPHEMERAL_REQUEST.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: ws09-ephemeral-test-link
  cancel-in-progress: true

jobs:
  publish-ephemeral:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WS10_RUN_ID: ${{ inputs.ws10_run_id }}
      WS10_HEAD_SHA: ${{ inputs.ws10_head_sha }}
      WS10_PASS_ARTIFACT: ${{ inputs.ws10_pass_artifact_name }}
      WS10_CLIENT_ARTIFACT: ${{ inputs.ws10_client_artifact_name }}
      WS50_HANDOFF_REF: ${{ inputs.ws50_handoff_ref }}
      WS01_SHA: ${{ inputs.ws01_sha }}
      WS02_SHA: ${{ inputs.ws02_sha }}
      WS03_SHA: ${{ inputs.ws03_sha }}
      WS12_SHA: ${{ inputs.ws12_sha }}
      WS14_SHA: ${{ inputs.ws14_sha }}
      WS38_SHA: ${{ inputs.ws38_sha }}
      KEEPALIVE_MINUTES: ${{ inputs.keepalive_minutes }}
      CLOUDFLARED_VERSION: '2026.10.0'
      CLOUDFLARED_LINUX_AMD64_SHA256: 'd33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db'
    steps:
      - name: Checkout WS09 publisher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve branch-native request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=workstreams/ws09/EPHEMERAL_REQUEST.json
          test -f "$REQUEST" || { echo 'branch-native trigger requires EPHEMERAL_REQUEST.json' >&2; exit 1; }
          jq -e 'type == "object"' "$REQUEST" >/dev/null
          emit() {
            local env_name=$1 json_name=$2 value
            value=$(jq -er --arg key "$json_name" '.[$key] | select(type == "string" or type == "number") | tostring' "$REQUEST")
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo "invalid newline in $json_name" >&2; exit 1; }
            printf '%s=%s\n' "$env_name" "$value" >> "$GITHUB_ENV"
          }
          emit WS10_RUN_ID ws10_run_id
          emit WS10_HEAD_SHA ws10_head_sha
          emit WS10_PASS_ARTIFACT ws10_pass_artifact_name
          emit WS10_CLIENT_ARTIFACT ws10_client_artifact_name
          emit WS50_HANDOFF_REF ws50_handoff_ref
          emit WS01_SHA ws01_sha
          emit WS02_SHA ws02_sha
          emit WS03_SHA ws03_sha
          emit WS12_SHA ws12_sha
          emit WS14_SHA ws14_sha
          emit WS38_SHA ws38_sha
          emit KEEPALIVE_MINUTES keepalive_minutes

      - name: Fail closed on identities and WS10 run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          full_sha='^[0-9a-f]{40}$'
          for pair in \
            "WS10_HEAD_SHA=$WS10_HEAD_SHA" \
            "WS50_HANDOFF_REF=$WS50_HANDOFF_REF" \
            "WS01_SHA=$WS01_SHA" \
            "WS02_SHA=$WS02_SHA" \
            "WS03_SHA=$WS03_SHA" \
            "WS12_SHA=$WS12_SHA" \
            "WS14_SHA=$WS14_SHA" \
            "WS38_SHA=$WS38_SHA"
          do
            value=${pair#*=}
            [[ "$value" =~ $full_sha ]] || { echo "invalid exact SHA: ${pair%%=*}" >&2; exit 1; }
          done
          [[ "$WS10_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'ws10_run_id must be numeric' >&2; exit 1; }
          [[ "$KEEPALIVE_MINUTES" =~ ^[0-9]+$ ]] || { echo 'keepalive_minutes must be numeric' >&2; exit 1; }
          (( KEEPALIVE_MINUTES >= 5 && KEEPALIVE_MINUTES <= 45 )) || { echo 'keepalive_minutes must be 5..45' >&2; exit 1; }

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WS10_RUN_ID}" > "${RUNNER_TEMP}/ws10-run.json"
          jq -e --arg sha "$WS10_HEAD_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == $sha and
            .head_branch == "ws10-qa-integration" and
            .name == "WS10 Moradon E2E Integration Gate"
          ' "${RUNNER_TEMP}/ws10-run.json" >/dev/null || {
            echo 'WS10 exact run is not a completed successful Moradon E2E run for the supplied SHA' >&2
            jq '{id,status,conclusion,head_branch,head_sha,name}' "${RUNNER_TEMP}/ws10-run.json" >&2
            exit 1
          }

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WS10_RUN_ID}/artifacts" > "${RUNNER_TEMP}/ws10-artifacts.json"
          for artifact in "$WS10_PASS_ARTIFACT" "$WS10_CLIENT_ARTIFACT"; do
            jq -e --arg name "$artifact" '.artifacts[] | select(.name == $name and .expired == false)' "${RUNNER_TEMP}/ws10-artifacts.json" >/dev/null || {
              echo "missing/non-live artifact on exact WS10 run: $artifact" >&2
              exit 1
            }
          done

      - name: Read and validate exact WS50 handoff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${WS50_HANDOFF_REF}^{commit}" 2>/dev/null || git fetch --no-tags origin "$WS50_HANDOFF_REF"
          git show "${WS50_HANDOFF_REF}:integration-rehearsal/STAGING_LINK_HANDOFF.md" > "${RUNNER_TEMP}/STAGING_LINK_HANDOFF.md"
          HANDOFF="${RUNNER_TEMP}/STAGING_LINK_HANDOFF.md"
          ! grep -q 'READY_PENDING_WS10' "$HANDOFF" || { echo 'WS50 handoff is still READY_PENDING_WS10' >&2; exit 1; }
          grep -Eq 'STAGING LINK CANDIDATE: READY(\*\*|[[:space:]]*$)' "$HANDOFF" || {
            echo 'WS50 handoff does not declare STAGING LINK CANDIDATE: READY' >&2
            exit 1
          }
          for exact in \
            "$WS10_RUN_ID" "$WS10_HEAD_SHA" "$WS10_PASS_ARTIFACT" "$WS10_CLIENT_ARTIFACT" \
            "$WS01_SHA" "$WS02_SHA" "$WS03_SHA" "$WS12_SHA" "$WS14_SHA" "$WS38_SHA"
          do
            grep -Fq "$exact" "$HANDOFF" || { echo "WS50 handoff does not freeze expected identity: $exact" >&2; exit 1; }
          done
          grep -Fq '/play-shell/' "$HANDOFF" || { echo 'WS50 handoff missing /play-shell/ entry contract' >&2; exit 1; }
          grep -Fq '/auth' "$HANDOFF" || { echo 'WS50 handoff missing /auth contract' >&2; exit 1; }
          grep -Fq '/game' "$HANDOFF" || { echo 'WS50 handoff missing /game contract' >&2; exit 1; }

      - name: Download exact PASS evidence and frozen client artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PASS_ROOT="${RUNNER_TEMP}/ws10-pass"
          CLIENT_ROOT="${RUNNER_TEMP}/ws10-client"
          mkdir -p "$PASS_ROOT" "$CLIENT_ROOT"
          gh run download "$WS10_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$WS10_PASS_ARTIFACT" --dir "$PASS_ROOT"
          if [[ "$WS10_CLIENT_ARTIFACT" == "$WS10_PASS_ARTIFACT" ]]; then
            cp -a "$PASS_ROOT/." "$CLIENT_ROOT/"
          else
            gh run download "$WS10_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$WS10_CLIENT_ARTIFACT" --dir "$CLIENT_ROOT"
          fi

          mapfile -d '' pass_texts < <(find "$PASS_ROOT" -type f -size -4M -print0)
          ((${#pass_texts[@]} > 0)) || { echo 'PASS artifact has no readable metadata/evidence files' >&2; exit 1; }
          if ! grep -I -E -i -q \
            'MORADON[ _-]*E2E[[:space:]_:=*-]+PASS|MORADON_E2E[[:space:]]*=[[:space:]]*PASS|"(status|result|decision)"[[:space:]]*:[[:space:]]*"PASS"' \
            "${pass_texts[@]}"; then
            echo 'explicit Moradon E2E PASS metadata marker not found in supplied PASS artifact' >&2
            exit 1
          fi

          CLIENT_PATHS="${RUNNER_TEMP}/client-paths.env"
          : > "$CLIENT_PATHS"
          for spec in 'CLIENT_JS:KnightOnLine.js' 'CLIENT_WASM:KnightOnLine.wasm' 'CLIENT_DATA:KnightOnLine.data'; do
            variable=${spec%%:*}
            name=${spec#*:}
            mapfile -t hits < <(find "$CLIENT_ROOT" -type f -name "$name" -print)
            ((${#hits[@]} == 1)) || { echo "client artifact must contain exactly one $name; found ${#hits[@]}" >&2; exit 1; }
            test -s "${hits[0]}" || { echo "frozen client file is empty: $name" >&2; exit 1; }
            printf '%s=%q\n' "$variable" "${hits[0]}" >> "$CLIENT_PATHS"
          done

      - name: Materialize exact provider slices from WS50 freeze
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/composition"
          mkdir -p "$ROOT"
          ensure_commit() {
            git cat-file -e "$1^{commit}" 2>/dev/null || git fetch --no-tags origin "$1"
          }
          extract_path() {
            local sha=$1 path=$2
            ensure_commit "$sha"
            git archive --format=tar "$sha" "$path" | tar -xf - -C "$ROOT"
          }
          extract_path "$WS01_SHA" openko-web/index.html
          extract_path "$WS02_SHA" services/ko-gateway
          extract_path "$WS03_SHA" services/ko1298-session
          extract_path "$WS12_SHA" play-shell
          extract_path "$WS12_SHA" tools/ws12_launcher
          extract_path "$WS14_SHA" services/ko1298-world
          extract_path "$WS38_SHA" content-pipeline
          extract_path "$WS38_SHA" tools/ws38_content
          (cd "$ROOT" && node tools/ws12_launcher/check-config.cjs)

      - name: Stage exact client through WS38 immutable publication order
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/client-paths.env"
          ROOT="${RUNNER_TEMP}/composition"
          PACKAGE="${RUNNER_TEMP}/passing-client-package"
          META="${RUNNER_TEMP}/ws38-meta"
          STATIC="${GITHUB_WORKSPACE}/deploy/artifacts/staging-play"
          CONTENT_VERSION="1298-ws10-${WS10_RUN_ID}"
          BUILD_ID="ws10-${WS10_RUN_ID}-${WS10_HEAD_SHA:0:12}"
          RELEASE="$STATIC/client-content/v1/$CONTENT_VERSION"

          rm -rf "$PACKAGE" "$META" "$STATIC"
          mkdir -p "$PACKAGE" "$META" "$RELEASE"
          cp -a "$ROOT/play-shell" "$STATIC/play-shell"
          cp "$STATIC/play-shell/config.staging.example.json" "$STATIC/play-shell/config.json"
          cp "$CLIENT_JS" "$PACKAGE/KnightOnLine.js"
          cp "$CLIENT_WASM" "$PACKAGE/KnightOnLine.wasm"
          cp "$CLIENT_DATA" "$PACKAGE/KnightOnLine.data"

          mapfile -t index_hits < <(find "${RUNNER_TEMP}/ws10-client" -type f -name index.html -print)
          if ((${#index_hits[@]} == 1)); then
            cp "${index_hits[0]}" "$PACKAGE/index.html"
          else
            cp "$ROOT/openko-web/index.html" "$PACKAGE/index.html"
          fi
          cat > "$PACKAGE/BUILD.txt" <<EOF
          OldKO 1298 WS10 PASS artifact
          Source branch: ws10-qa-integration
          Source commit: ${WS10_HEAD_SHA}
          WS10 run: ${WS10_RUN_ID}
          Client artifact: ${WS10_CLIENT_ARTIFACT}
          EOF

          (cd "$ROOT" && python3 -m tools.ws38_content.generate_manifest \
            --root "$PACKAGE" \
            --profile content-pipeline/oldko1298.profile.json \
            --content-version "$CONTENT_VERSION" \
            --build-id "$BUILD_ID" \
            --source-commit "$WS10_HEAD_SHA" \
            --source-ref ws10-qa-integration \
            --output "$META/manifest.json" \
            --publication-marker-output "$META/_complete.json" \
            --cdn-publication-marker-path "client-content/v1/${CONTENT_VERSION}/_complete.json" \
            --latest-output "$META/latest.json" \
            --cdn-manifest-path "client-content/v1/${CONTENT_VERSION}/manifest.json")

          # Fail-closed order: immutable files -> manifest -> verify -> _complete -> verify -> latest last.
          cp "$PACKAGE/index.html" "$PACKAGE/KnightOnLine.js" "$PACKAGE/KnightOnLine.wasm" "$PACKAGE/KnightOnLine.data" "$PACKAGE/BUILD.txt" "$RELEASE/"
          cp "$META/manifest.json" "$RELEASE/manifest.json"
          (cd "$ROOT" && python3 -m tools.ws38_content.verify_manifest \
            --root "$RELEASE" --manifest "$RELEASE/manifest.json" --expected-content-version "$CONTENT_VERSION")
          cp "$META/_complete.json" "$RELEASE/_complete.json"
          (cd "$ROOT" && python3 -m tools.ws38_content.verify_manifest \
            --root "$RELEASE" --manifest "$RELEASE/manifest.json" --expected-content-version "$CONTENT_VERSION" \
            --publication-marker "$RELEASE/_complete.json" --require-publication-marker)
          cp "$META/latest.json" "$STATIC/latest.json"
          (cd "$ROOT" && python3 -m tools.ws38_content.verify_manifest \
            --root "$RELEASE" --manifest "$RELEASE/manifest.json" --expected-content-version "$CONTENT_VERSION" \
            --publication-marker "$RELEASE/_complete.json" --require-publication-marker \
            --latest-pointer "$STATIC/latest.json")
          echo "CONTENT_VERSION=$CONTENT_VERSION" >> "$GITHUB_ENV"

      - name: Build exact WS02 and integrated WS03+WS14 images
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/composition"
          GATEWAY_IMAGE="oldkoweb-ws09-gateway:${GITHUB_RUN_ID}"
          SESSION_IMAGE="oldkoweb-ws09-session-world:${GITHUB_RUN_ID}"
          docker build -f "$ROOT/services/ko-gateway/Dockerfile" -t "$GATEWAY_IMAGE" "$ROOT"
          docker build -f deploy/ephemeral-session-world.Dockerfile -t "$SESSION_IMAGE" "$ROOT"
          echo "GATEWAY_IMAGE=$GATEWAY_IMAGE" >> "$GITHUB_ENV"
          echo "SESSION_IMAGE=$SESSION_IMAGE" >> "$GITHUB_ENV"

      - name: Install pinned Cloudflare Quick Tunnel client
        shell: bash
        run: |
          set -euo pipefail
          BIN="${RUNNER_TEMP}/cloudflared"
          curl -fsSL --retry 4 -o "$BIN" "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_LINUX_AMD64_SHA256}  ${BIN}" | sha256sum -c -
          chmod +x "$BIN"
          "$BIN" --version

      - name: Allocate temporary HTTPS/WSS hostname before backend boot
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/cloudflared.log"
          "${RUNNER_TEMP}/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:8080 >"$LOG" 2>&1 &
          echo $! > "${RUNNER_TEMP}/cloudflared.pid"
          URL=''
          for _ in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$LOG" | head -n1 || true)
            [[ -n "$URL" ]] && break
            sleep 1
          done
          [[ -n "$URL" ]] || { cat "$LOG" >&2; echo 'quick tunnel URL was not allocated' >&2; exit 1; }
          HOST=${URL#https://}
          echo "PUBLIC_ORIGIN=$URL" >> "$GITHUB_ENV"
          echo "PUBLIC_HOST=$HOST" >> "$GITHUB_ENV"

      - name: Boot same-origin staging composition
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="${RUNNER_TEMP}/ws09-ephemeral.env"
          cat > "$ENV_FILE" <<EOF
          NGINX_IMAGE=nginx:stable-alpine
          GATEWAY_IMAGE=${GATEWAY_IMAGE}
          KO_SESSION_WORLD_IMAGE=${SESSION_IMAGE}
          STAGING_HOST=${PUBLIC_HOST}
          STAGING_PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
          STAGING_ALLOWED_HOST=${PUBLIC_HOST}
          STAGING_HTTP_BIND=8080
          GATEWAY_INTERNAL_PORT=8080
          GATEWAY_LOG_LEVEL=info
          AUTH_TCP_PORT=15100
          GAME_TCP_PORT=15001
          KO_GAME_ADVERTISE_HOST=${PUBLIC_HOST}
          EOF
          echo "EPHEMERAL_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          docker compose --env-file "$ENV_FILE" -f docker-compose.ws09-staging.yml config --quiet
          docker compose --env-file "$ENV_FILE" -f docker-compose.ws09-staging.yml up -d
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          curl -fsS http://127.0.0.1:8080/gateway-auth-healthz >/dev/null
          curl -fsS http://127.0.0.1:8080/gateway-game-healthz >/dev/null

      - name: Public HTTPS WS38 + MIME + WSS smoke
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            curl -fsS --retry 2 "${PUBLIC_ORIGIN}/healthz" >/dev/null 2>&1 && break
            sleep 2
          done
          node deploy/ephemeral-public-smoke.mjs "$PUBLIC_ORIGIN" "$CONTENT_VERSION"

      - name: Exact WS12 launcher publication preflight
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/composition"
          PUBLIC_ORIGIN="$PUBLIC_ORIGIN" ROOT="$ROOT" node <<'NODE'
          const path = require('node:path');
          const { webcrypto } = require('node:crypto');
          const core = require(path.join(process.env.ROOT, 'play-shell/launcher-core.js'));
          (async () => {
            const raw = await fetch(`${process.env.PUBLIC_ORIGIN}/play-shell/config.json`, { cache: 'no-store' });
            if (!raw.ok) throw new Error(`config HTTP ${raw.status}`);
            const config = core.normalizeConfig(await raw.json());
            const publication = await core.preflightPublication(config, fetch, webcrypto, `${process.env.PUBLIC_ORIGIN}/play-shell/`);
            if (!publication || !publication.entryUrl || publication.requiredFileCount < 4) throw new Error('WS12 publication preflight did not reach launcher-ready state');
            console.log(`WS12 OYNA preflight: PASS contentVersion=${publication.contentVersion} requiredFiles=${publication.requiredFileCount}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Emit TEST_LINK only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          TEST_LINK="${PUBLIC_ORIGIN}/play-shell/"
          echo "TEST_LINK=$TEST_LINK"
          {
            echo '## WS09 ephemeral test link'
            echo
            echo "TEST_LINK=$TEST_LINK"
            echo
            echo "- WS10 run: ${WS10_RUN_ID}"
            echo "- WS10 head: ${WS10_HEAD_SHA}"
            echo "- PASS artifact: ${WS10_PASS_ARTIFACT}"
            echo "- frozen client artifact: ${WS10_CLIENT_ARTIFACT}"
            echo "- WS50 handoff ref: ${WS50_HANDOFF_REF}"
            echo "- contentVersion: ${CONTENT_VERSION}"
            echo "- HTTPS/WS38/MIME/WSS/WS12 preflight: PASS"
            echo "- lifetime: this workflow process only (${KEEPALIVE_MINUTES} minutes requested)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep ephemeral link alive
        shell: bash
        run: |
          set -euo pipefail
          echo "temporary link remains live while this step is running (${KEEPALIVE_MINUTES} minutes)"
          sleep "$((KEEPALIVE_MINUTES * 60))"

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '--- docker compose ps ---'
          if [[ -n "${EPHEMERAL_ENV_FILE:-}" && -f "${EPHEMERAL_ENV_FILE}" ]]; then
            docker compose --env-file "$EPHEMERAL_ENV_FILE" -f docker-compose.ws09-staging.yml ps || true
            docker compose --env-file "$EPHEMERAL_ENV_FILE" -f docker-compose.ws09-staging.yml logs --no-color --tail=200 || true
          fi
          echo '--- cloudflared ---'
          test -f "${RUNNER_TEMP}/cloudflared.log" && tail -200 "${RUNNER_TEMP}/cloudflared.log" || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [[ -n "${EPHEMERAL_ENV_FILE:-}" && -f "${EPHEMERAL_ENV_FILE}" ]]; then
            docker compose --env-file "$EPHEMERAL_ENV_FILE" -f docker-compose.ws09-staging.yml down --remove-orphans || true
          fi
          if test -f "${RUNNER_TEMP}/cloudflared.pid"; then
            kill "$(cat "${RUNNER_TEMP}/cloudflared.pid")" 2>/dev/null || true
          fi
