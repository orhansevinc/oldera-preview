name: WS17 Item Inventory Domain

on:
  push:
    branches: [ws17-item-inventory]
    paths:
      - 'services/ko1298-items/**'
      - 'tests/ko1298-items/**'
      - 'workstreams/ws17/**'
      - '.github/workflows/ws17-items.yml'
  pull_request:
    paths:
      - 'services/ko1298-items/**'
      - 'tests/ko1298-items/**'
      - 'workstreams/ws17/**'
      - '.github/workflows/ws17-items.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run WS17 domain tests
        run: node --test tests/ko1298-items/*.test.js
