name: WS09 Permanent Release Bundle

on:
  workflow_dispatch:
  push:
    branches: [ws09-production-infra]
    paths:
      - 'deploy/RELEASE.ws50-c5-ws10-38604174659.env'
      - 'deploy/production-account-api.Dockerfile'
      - 'deploy/migrate-production-db.sh'
      - 'docker-compose.ws09.yml'
      - 'infra/nginx/**'
      - 'workstreams/ws09/DOMAIN_DEPLOYMENT.json'
      - 'workstreams/ws09/DOMAIN_RELEASE_REQUESTS.json'
      - '.github/workflows/ws09-permanent-release-bundle.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: ws09-permanent-release-bundle
  cancel-in-progress: true

jobs:
  build-host-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout WS09
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load frozen permanent release identity
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=deploy/RELEASE.ws50-c5-ws10-38604174659.env
          test -f "$RELEASE"
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            [[ "$line" != *$'\n'* && "$line" != *$'\r'* ]]
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done < "$RELEASE"

      - name: Verify immutable C5, WS49, WS10 and client artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_ID" = 'oldkoweb-domain-live-20261015'
          test "$FINAL_PROVIDER_SET" = 'WS50-C5@sha256:7ac3b8a4c06b67e52b8d18518ef8c82209a60c6101c33609a4c16e64d84f119e'
          test "$WS50_MANIFEST_COMMIT" = '0d5001095fa3b43693b4fa0cda615f84e2cb7df5'
          test "$WS50_HANDOFF_REF" = '7497087d4cf67e4e05a3a090f6edad3d206078cb'

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WS49_RUN_ID}" > "$RUNNER_TEMP/ws49.json"
          jq -e '.status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/ws49.json" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WS10_RUN_ID}" > "$RUNNER_TEMP/ws10.json"
          jq -e --arg sha "$WS10_HEAD_SHA" '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_branch == "ws10-qa-integration"' "$RUNNER_TEMP/ws10.json" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WS10_RUN_ID}/artifacts" > "$RUNNER_TEMP/ws10-artifacts.json"
          jq -e --arg name "$WS10_PASS_ARTIFACT" '.artifacts[] | select(.name == $name and .expired == false)' "$RUNNER_TEMP/ws10-artifacts.json" >/dev/null
          jq -e --arg name "$WS10_CLIENT_ARTIFACT" --arg digest "$WS10_CLIENT_ARTIFACT_DIGEST" --argjson id "$WS10_CLIENT_ARTIFACT_ID" \
            '.artifacts[] | select(.name == $name and .id == $id and .expired == false and .digest == $digest)' \
            "$RUNNER_TEMP/ws10-artifacts.json" >/dev/null

          git cat-file -e "${WS50_MANIFEST_COMMIT}^{commit}" 2>/dev/null || git fetch --no-tags origin "$WS50_MANIFEST_COMMIT"
          MANIFEST=$(git show "${WS50_MANIFEST_COMMIT}:release/sets/ws50/C5.json")
          test "$(jq -r .immutable_key <<<"$MANIFEST")" = "$FINAL_PROVIDER_SET"

          git cat-file -e "${WS50_HANDOFF_REF}^{commit}" 2>/dev/null || git fetch --no-tags origin "$WS50_HANDOFF_REF"
          git show "${WS50_HANDOFF_REF}:integration-rehearsal/STAGING_LINK_HANDOFF.md" > "$RUNNER_TEMP/handoff.md"
          for exact in "$FINAL_PROVIDER_SET" "$WS10_RUN_ID" "$WS10_HEAD_SHA" "$WS10_PASS_ARTIFACT" "$WS10_CLIENT_ARTIFACT" "$WS10_CLIENT_ARTIFACT_DIGEST"; do
            grep -Fq "$exact" "$RUNNER_TEMP/handoff.md"
          done

      - name: Verify official site and account owner authorities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_commit() { git cat-file -e "$1^{commit}" 2>/dev/null || git fetch --no-tags origin "$1"; }
          ensure_commit "$OFFICIAL_SITE_HANDOFF_COMMIT"
          ensure_commit "$OFFICIAL_SITE_SOURCE_COMMIT"
          ensure_commit "$WS13_ACCOUNT_HEAD"
          ensure_commit "$WS07_ACCOUNT_COMMIT"
          test "$(git show -s --format=%T "$OFFICIAL_SITE_SOURCE_COMMIT")" = "$OFFICIAL_SITE_SOURCE_TREE"
          handoff=$(git show "$OFFICIAL_SITE_HANDOFF_COMMIT:coordination/handoffs/official-site-release.json")
          test "$(jq -r .website_source_commit <<<"$handoff")" = "$OFFICIAL_SITE_SOURCE_COMMIT"
          test "$(jq -r .artifact.id <<<"$handoff")" = "$OFFICIAL_SITE_ARTIFACT_ID"
          test "$(jq -r .artifact.digest <<<"$handoff")" = "$OFFICIAL_SITE_ARTIFACT_DIGEST"
          test "$(git rev-parse "$WS07_ACCOUNT_COMMIT:services/oldko-data/src/adapters/ws13-account-api.js")" = "$WS07_ACCOUNT_ADAPTER_BLOB_SHA1"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WS13_ACCOUNT_RUN_ID}" > "$RUNNER_TEMP/ws13.json"
          jq -e --arg sha "$WS13_ACCOUNT_HEAD" '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_branch == "ws13-account-api"' "$RUNNER_TEMP/ws13.json" >/dev/null

          # Record the newer WS03 evidence, but never silently replace the C5 WS03 pin.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSERVED_WS03_PERSISTENCE_RUN_ID}" > "$RUNNER_TEMP/ws03-new.json"
          jq -e --arg sha "$OBSERVED_WS03_PERSISTENCE_HEAD" '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .head_branch == "ws03-ko1298-session"' "$RUNNER_TEMP/ws03-new.json" >/dev/null
          test "$WS03_SHA" != "$OBSERVED_WS03_PERSISTENCE_HEAD"

      - name: Download exact real-browser PASS and client
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ws10-pass" "$RUNNER_TEMP/ws10-client"
          gh run download "$WS10_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$WS10_PASS_ARTIFACT" --dir "$RUNNER_TEMP/ws10-pass"
          gh run download "$WS10_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$WS10_CLIENT_ARTIFACT" --dir "$RUNNER_TEMP/ws10-client"
          mapfile -d '' texts < <(find "$RUNNER_TEMP/ws10-pass" -type f -size -4M -print0)
          ((${#texts[@]} > 0))
          grep -I -E -i -q 'MORADON[ _-]*E2E[[:space:]_:=*-]+PASS|MORADON_E2E[[:space:]]*=[[:space:]]*PASS|"(status|result|decision)"[[:space:]]*:[[:space:]]*"PASS"' "${texts[@]}"
          : > "$RUNNER_TEMP/client-paths.env"
          for name in KnightOnLine.js KnightOnLine.wasm KnightOnLine.data; do
            mapfile -t hits < <(find "$RUNNER_TEMP/ws10-client" -type f -name "$name" -print)
            ((${#hits[@]} == 1))
            test -s "${hits[0]}"
            printf '%s=%q\n' "CLIENT_${name#KnightOnLine.}" "${hits[0]}" >> "$RUNNER_TEMP/client-paths.env"
          done

      - name: Materialize exact frozen provider slices
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/composition"
          mkdir -p "$ROOT"
          ensure_commit() { git cat-file -e "$1^{commit}" 2>/dev/null || git fetch --no-tags origin "$1"; }
          extract_path() {
            local sha=$1 path=$2
            ensure_commit "$sha"
            git archive --format=tar "$sha" "$path" | tar -xf - -C "$ROOT"
          }
          extract_path "$WS01_SHA" openko-web/index.html
          extract_path "$WS02_SHA" services/ko-gateway
          extract_path "$WS03_SHA" services/ko1298-session
          extract_path "$WS12_SHA" play-shell
          extract_path "$WS12_SHA" tools/ws12_launcher
          extract_path "$WS14_SHA" services/ko1298-world
          extract_path "$WS38_SHA" content-pipeline
          extract_path "$WS38_SHA" tools/ws38_content
          (cd "$ROOT" && node tools/ws12_launcher/check-config.cjs)

      - name: Stage exact client through WS38
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/client-paths.env"
          ROOT="$RUNNER_TEMP/composition"
          PACKAGE="$RUNNER_TEMP/passing-client-package"
          META="$RUNNER_TEMP/ws38-meta"
          BUNDLE="$RUNNER_TEMP/oldkoweb-host-bundle"
          STATIC="$BUNDLE/artifacts/play"
          RELEASE="$STATIC/client-content/v1/$CONTENT_VERSION"
          mkdir -p "$PACKAGE" "$META" "$RELEASE" "$BUNDLE/artifacts/site" "$BUNDLE/artifacts/admin"
          cp -a "$ROOT/play-shell" "$STATIC/play-shell"
          cp "$STATIC/play-shell/config.staging.example.json" "$STATIC/play-shell/config.json"
          cp "$CLIENT_js" "$PACKAGE/KnightOnLine.js"
          cp "$CLIENT_wasm" "$PACKAGE/KnightOnLine.wasm"
          cp "$CLIENT_data" "$PACKAGE/KnightOnLine.data"
          mapfile -t index_hits < <(find "$RUNNER_TEMP/ws10-client" -type f -name index.html -print)
          if ((${#index_hits[@]} == 1)); then cp "${index_hits[0]}" "$PACKAGE/index.html"; else cp "$ROOT/openko-web/index.html" "$PACKAGE/index.html"; fi
          cat > "$PACKAGE/BUILD.txt" <<EOF
          OldKOWeb exact C5 real-browser client
          Provider set: ${FINAL_PROVIDER_SET}
          Source commit: ${WS10_HEAD_SHA}
          WS10 run: ${WS10_RUN_ID}
          Client artifact: ${WS10_CLIENT_ARTIFACT}
          Client artifact digest: ${WS10_CLIENT_ARTIFACT_DIGEST}
          EOF
          (cd "$ROOT" && python3 -m tools.ws38_content.generate_manifest \
            --root "$PACKAGE" \
            --profile content-pipeline/oldko1298.profile.json \
            --content-version "$CONTENT_VERSION" \
            --build-id "$BUILD_ID" \
            --source-commit "$WS10_HEAD_SHA" \
            --source-ref ws10-qa-integration \
            --output "$META/manifest.json" \
            --publication-marker-output "$META/_complete.json" \
            --cdn-publication-marker-path "client-content/v1/${CONTENT_VERSION}/_complete.json" \
            --latest-output "$META/latest.json" \
            --cdn-manifest-path "client-content/v1/${CONTENT_VERSION}/manifest.json")
          cp "$PACKAGE/index.html" "$PACKAGE/KnightOnLine.js" "$PACKAGE/KnightOnLine.wasm" "$PACKAGE/KnightOnLine.data" "$PACKAGE/BUILD.txt" "$RELEASE/"
          cp "$META/manifest.json" "$RELEASE/manifest.json"
          cp "$META/_complete.json" "$RELEASE/_complete.json"
          cp "$META/latest.json" "$STATIC/latest.json"
          (cd "$ROOT" && python3 -m tools.ws38_content.verify_manifest \
            --root "$RELEASE" --manifest "$RELEASE/manifest.json" --expected-content-version "$CONTENT_VERSION" \
            --publication-marker "$RELEASE/_complete.json" --require-publication-marker \
            --latest-pointer "$STATIC/latest.json")

      - name: Stage exact approved website and admin v10
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/oldkoweb-host-bundle"
          SITE="$BUNDLE/artifacts/site"
          ADMIN="$BUNDLE/artifacts/admin"
          mkdir -p "$SITE/assets" "$ADMIN"
          for file in index.html account.html oldkoweb-live.html site-config.js oldkoweb-v14-a.css oldkoweb-v14-b.css oldkoweb-v14.js account-v15.css account-v15.js; do
            git show "$OFFICIAL_SITE_SOURCE_COMMIT:$file" > "$SITE/$file"
          done
          git show "$OFFICIAL_SITE_SOURCE_COMMIT:assets/hero-1299-hd.jpg" > "$SITE/assets/hero-1299-hd.jpg"
          git archive --format=tar "$OFFICIAL_SITE_SOURCE_COMMIT" admin | tar -xf - -C "$BUNDLE/artifacts"
          grep -Fq 'admin.css?v=10' "$ADMIN/index.html"
          grep -Fq '/api/account' "$SITE/site-config.js"
          printf '%s\n' "$OFFICIAL_SITE_ARTIFACT_DIGEST" > "$SITE/OFFICIAL_SITE_ARTIFACT_DIGEST.txt"

      - name: Build exact WS13 plus WS07 account image and frozen C5 gameplay images
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/composition"
          BUNDLE="$RUNNER_TEMP/oldkoweb-host-bundle"
          ACCOUNT_CTX="$RUNNER_TEMP/account-image-context"
          mkdir -p "$BUNDLE/images" "$ACCOUNT_CTX/ws13" "$ACCOUNT_CTX/ws07"
          git archive --format=tar "$WS13_ACCOUNT_HEAD" services/account-api | tar -xf - -C "$ACCOUNT_CTX/ws13"
          git archive --format=tar "$WS07_ACCOUNT_COMMIT" services/oldko-data database/migrations | tar -xf - -C "$ACCOUNT_CTX/ws07"

          GATEWAY_TAG="oldkoweb/ws02-gateway:${BUILD_ID}"
          SESSION_TAG="oldkoweb/session-world:${BUILD_ID}"
          ACCOUNT_TAG="oldkoweb/account-api:${WS13_ACCOUNT_HEAD:0:12}-${WS07_ACCOUNT_COMMIT:0:12}"
          docker build -f "$ROOT/services/ko-gateway/Dockerfile" -t "$GATEWAY_TAG" "$ROOT"
          docker build -f deploy/ephemeral-session-world.Dockerfile -t "$SESSION_TAG" "$ROOT"
          docker build -f deploy/production-account-api.Dockerfile -t "$ACCOUNT_TAG" "$ACCOUNT_CTX"

          for pair in "ws02-gateway:$GATEWAY_TAG" "session-world:$SESSION_TAG" "account-api:$ACCOUNT_TAG"; do
            name=${pair%%:*}; tag=${pair#*:}
            docker save "$tag" | gzip -1 > "$BUNDLE/images/$name.tar.gz"
            docker image inspect "$tag" --format '{{.Id}}' > "$BUNDLE/images/$name.image-id"
            printf '%s\n' "$tag" > "$BUNDLE/images/$name.tag"
          done

      - name: Snapshot official runtime base image digests
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/oldkoweb-host-bundle"
          : > "$BUNDLE/images/base-images.env"
          for image in nginx:stable-alpine postgres:16-alpine; do
            docker pull "$image" >/dev/null
            digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
            test -n "$digest"
            case "$image" in
              nginx:*) printf 'NGINX_IMAGE=%s\n' "$digest" >> "$BUNDLE/images/base-images.env" ;;
              postgres:*) printf 'POSTGRES_IMAGE=%s\n' "$digest" >> "$BUNDLE/images/base-images.env" ;;
            esac
          done

      - name: Assemble host deployment bundle and checksums
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/oldkoweb-host-bundle"
          mkdir -p "$BUNDLE/deploy" "$BUNDLE/infra" "$BUNDLE/workstreams/ws09" "$BUNDLE/coordination/handoffs/domain-live"
          cp docker-compose.ws09.yml "$BUNDLE/"
          cp deploy/RELEASE.ws50-c5-ws10-38604174659.env "$BUNDLE/deploy/"
          cp deploy/.env.production.example "$BUNDLE/deploy/"
          cp deploy/production-account-api.Dockerfile deploy/migrate-production-db.sh "$BUNDLE/deploy/"
          cp deploy/backup-db.sh deploy/restore-db.sh deploy/production-smoke.sh deploy/release-switch.sh deploy/rollback-static.sh deploy/validate-production-env.sh "$BUNDLE/deploy/"
          cp -a infra/nginx "$BUNDLE/infra/"
          cp workstreams/ws09/DOMAIN_DEPLOYMENT.json workstreams/ws09/DOMAIN_RELEASE_REQUESTS.json "$BUNDLE/workstreams/ws09/"
          if test -f coordination/handoffs/domain-live/WS09.json; then cp coordination/handoffs/domain-live/WS09.json "$BUNDLE/coordination/handoffs/domain-live/"; fi
          cat > "$BUNDLE/BUNDLE_STATUS.json" <<EOF
          {
            "release_id": "${RELEASE_ID}",
            "provider_set": "${FINAL_PROVIDER_SET}",
            "client_artifact_digest": "${WS10_CLIENT_ARTIFACT_DIGEST}",
            "official_site_artifact_digest": "${OFFICIAL_SITE_ARTIFACT_DIGEST}",
            "account_api_source": "${WS13_ACCOUNT_HEAD}+${WS07_ACCOUNT_COMMIT}",
            "gameplay_host_bundle": "EXACT_C5_ONLY",
            "final_domain_cutover": "BLOCKED_NOT_LIVE",
            "deployment_allowed": false,
            "blocking_inputs": [
              "authorized_persistent_host_target",
              "authorized_dns_zone_access_and_snapshot",
              "production_account_delivery_webhook_secret_configuration",
              "WS08_persistent_repository_and_real_command_bridge",
              "WS50_selected_and_WS10_accepted_persistence_child_for_game_runtime"
            ]
          }
          EOF
          (cd "$BUNDLE" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$BUNDLE" && sha256sum -c SHA256SUMS)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/oldkoweb-domain-live-20261015-candidate.tar.gz" oldkoweb-host-bundle
          sha256sum "$RUNNER_TEMP/oldkoweb-domain-live-20261015-candidate.tar.gz" > "$RUNNER_TEMP/oldkoweb-domain-live-20261015-candidate.tar.gz.sha256"

      - name: Publish durable blocked candidate to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='oldkoweb-domain-live-20261015-candidate'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'OldKOWeb domain-live 2026-10-15 candidate (BLOCKED, NOT LIVE)' \
              --notes 'Durable WS09 deployment candidate. This is explicitly NOT a live-domain acceptance. DNS/host/admin persistence and a WS50+WS10 accepted persistent gameplay child remain required.'
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/oldkoweb-domain-live-20261015-candidate.tar.gz" \
            "$RUNNER_TEMP/oldkoweb-domain-live-20261015-candidate.tar.gz.sha256"

      - name: Upload Actions convenience copy
        uses: actions/upload-artifact@v4
        with:
          name: ws09-domain-live-candidate-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/oldkoweb-domain-live-20261015-candidate.tar.gz
            ${{ runner.temp }}/oldkoweb-domain-live-20261015-candidate.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
