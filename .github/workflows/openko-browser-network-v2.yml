name: OpenKO Browser Network Proof V2

on:
  workflow_dispatch:
  push:
    branches: [openko-browser-port]
    paths:
      - 'gateway/**'
      - 'tools/patch_openko_browser_gateway.py'
      - 'tools/fix_browser_server_ini_case.py'
      - 'tools/ko_tcp_probe.mjs'
      - '.github/workflows/openko-browser-network-v2.yml'

permissions:
  contents: read

jobs:
  prove-ko-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openko-browser-port

      - uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: feature/port-posix
          path: openko
          submodules: false
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: ko4life-net/ko-assets
          ref: 1298
          path: ko-assets
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Data
            UI_US
            Snd/Intro_Sound.mp3
            Server.ini

      - name: Patch browser, gateway transport, and Server.Ini case
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_openko_browser.py
          python3 tools/patch_openko_browser_gateway.py
          python3 tools/fix_browser_server_ini_case.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openko/src/Client/WarFare/RHIDeviceGL.cpp')
          s = p.read_text()
          bad = r'#version 300 es\nprecision highp float;'
          good = '#version 300 es\nprecision highp float;'
          count = s.count(bad)
          if count != 2:
              raise SystemExit(f'expected 2 escaped GLSL headers, found {count}')
          p.write_text(s.replace(bad, good))
          PY
          grep -q 'Server.ini@/data/Server.Ini' openko/src/Client/WarFare/CMakeLists.txt
          grep -q 'browser Server.Ini:' openko/src/Client/WarFare/GameProcLogIn_1298.cpp

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git
          npm install --no-save --no-audit --no-fund ws@8.18.3 playwright-core@1.55.0

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure WASM
        shell: bash
        run: |
          set -euo pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' \
            -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee configure-v2.log

      - name: Build real WarFare WASM
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-web --target WarFare -j2 2>&1 | tee build-v2.log
          test -s build-web/bin/Release/KnightOnLine.js
          test -s build-web/bin/Release/KnightOnLine.wasm
          test -s build-web/bin/Release/KnightOnLine.data

      - name: Prove LS_SERVERLIST crosses browser WebSocket to KO TCP
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-web/bin/Release
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"

          rm -f gateway-probe-result.txt gateway-probe-v2.log gateway-v2.log browser-v2.log browser-v2-status.txt
          KO_PROBE_PORT=16100 KO_PROBE_RESULT=gateway-probe-result.txt \
            node tools/ko_tcp_probe.mjs >gateway-probe-v2.log 2>&1 &
          PROBE_PID=$!
          KO_TARGET_HOST=127.0.0.1 KO_TARGET_PORT=16100 OLDERA_GATEWAY_PORT=15100 \
            node gateway/oldera-gateway.mjs >gateway-v2.log 2>&1 &
          GATEWAY_PID=$!
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" >http-v2.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID $GATEWAY_PID $PROBE_PID 2>/dev/null || true' EXIT
          sleep 2

          cat > "$OUT/network-v2.html" <<'EOF'
          <!doctype html><html><body style="margin:0;background:#000">
          <canvas id="canvas" width="1024" height="768"></canvas><pre id="status"></pre>
          <script>
          (() => {
            const status = document.getElementById('status');
            const write = (kind,args) => {
              const line='['+kind+'] '+args.join(' ');
              status.textContent += line+'\n'; console.log(line);
            };
            window.Module={canvas:document.getElementById('canvas'),arguments:['--renderer','gl','--data','/data'],
              print:(...a)=>write('OUT',a),printErr:(...a)=>write('ERR',a),
              onRuntimeInitialized:()=>write('SMOKE',['WASM_RUNTIME_READY'])};
          })();
          </script><script src="KnightOnLine.js"></script></body></html>
          EOF

          cat > browser-v2.cjs <<'EOF'
          const fs=require('fs'); const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,
              args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1024,height:768}});
            page.on('console',m=>console.log('[console:'+m.type()+'] '+m.text()));
            page.on('pageerror',e=>console.log('[pageerror] '+e.stack));
            await page.goto('http://127.0.0.1:8000/network-v2.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>{
              const t=document.getElementById('status')?.textContent||'';
              return t.includes("browser Server.Ini: path='/data/Server.Ini' count=1")
                && t.includes('browser login transport active: direct Emscripten WebSocket gateway');
            },null,{timeout:90000});
            // WebSocket callback logs are written by CLogWriter rather than Module.print,
            // so gateway/TCP evidence below is the authoritative transport proof.
            await page.waitForTimeout(2500);
            const t=await page.locator('#status').textContent().catch(()=> '');
            fs.writeFileSync('browser-v2-status.txt',t||'');
            await page.locator('#canvas').screenshot({path:'browser-v2-canvas.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF

          set +e
          CHROME="$CHROME" timeout 120s node browser-v2.cjs 2>&1 | tee browser-v2.log
          BROWSER_RC=${PIPESTATUS[0]}
          set -e

          for i in $(seq 1 40); do
            if [ -f gateway-probe-result.txt ] && grep -q 'KO_FRAME_OK opcode=0xf5' gateway-probe-result.txt; then break; fi
            sleep 0.25
          done

          echo '=== BROWSER TAIL ==='; tail -n 80 browser-v2.log || true
          echo '=== GATEWAY ==='; cat gateway-v2.log || true
          echo '=== TCP PROBE ==='; cat gateway-probe-v2.log || true
          echo '=== RESULT ==='; cat gateway-probe-result.txt || true

          test "$BROWSER_RC" -eq 0
          grep -q "browser Server.Ini: path='/data/Server.Ini' count=1" browser-v2-status.txt
          grep -q 'browser login transport active: direct Emscripten WebSocket gateway' browser-v2-status.txt
          grep -q 'browser connected' gateway-v2.log
          grep -q 'tcp connected 127.0.0.1:16100' gateway-v2.log
          grep -q 'c2s bytes=7 hex=aa550100f555aa' gateway-v2.log
          grep -q 'KO_FRAME_OK opcode=0xf5' gateway-probe-result.txt
          if grep -Eq '\[pageerror\]|GL_INVALID_(ENUM|VALUE|OPERATION)|WebGL: INVALID_|WebGL: too many errors' browser-v2.log; then
            echo 'Browser/WebGL error detected' >&2; exit 1
          fi
          echo 'NETWORK_CHAIN_OK browser -> WebSocket -> gateway -> KO TCP; exact LS_SERVERLIST frame verified'

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openko-browser-network-proof-v2
          path: |
            configure-v2.log
            build-v2.log
            browser-v2.log
            browser-v2-status.txt
            browser-v2-canvas.png
            gateway-v2.log
            gateway-probe-v2.log
            gateway-probe-result.txt
            http-v2.log
          if-no-files-found: warn
