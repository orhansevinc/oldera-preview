name: WS10 Visibility V2 and Playable Combat Harness

on:
  push:
    branches: [ws10-qa-integration]
    paths:
      - '.github/workflows/ws10-visibility-v2.yml'
      - 'qa/moradon/v2/**'
      - 'workstreams/ws10/VISIBILITY_V2_AND_COMBAT_GATE.md'
  workflow_dispatch:
    inputs:
      provider_set_commit:
        description: 'Commit containing the exact immutable WS50 provider-set manifest'
        required: true
        type: string
      provider_set_path:
        description: 'Manifest path at provider_set_commit'
        required: true
        default: 'release/sets/ws50/C5.json'
        type: string
      immutable_key:
        description: 'Exact WS50-...@sha256:... immutable key'
        required: true
        type: string
      emscripten_version:
        description: 'Must match manifest runtime_build_identity.emscripten_version'
        required: true
        default: '6.0.12'
        type: string
      run_native_visibility:
        description: 'Build and run the real browser Visibility V2 gate'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  harness-selftests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and fail-closed harness tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qa/moradon/v2/patch_visibility_observability_v2.py
          node --check qa/moradon/v2/browser-e2e-v2.cjs
          node --check qa/moradon/v2/playable-combat-browser.cjs
          node qa/moradon/v2/visibility-v2-selftest.cjs
          node qa/moradon/v2/combat-selftest.cjs
      - name: Enforce real-browser gameplay input boundary
        shell: bash
        run: |
          set -euo pipefail
          for f in qa/moradon/v2/real-browser-input.cjs qa/moradon/v2/playable-combat-browser.cjs; do
            if grep -En 'page\.evaluate\(|ccall\(|cwrap\(|Module\._|applyDamage\(|injectDamage|memory.*hp|hp.*memory' "$f"; then
              echo "forbidden direct gameplay mutation/call in $f" >&2
              exit 1
            fi
          done
          grep -q 'playwright.mouse' qa/moradon/v2/real-browser-input.cjs
          grep -q 'playwright.keyboard' qa/moradon/v2/real-browser-input.cjs
          echo 'WS10_REAL_BROWSER_INPUT_POLICY PASS'

  provider-readiness:
    if: github.event_name == 'workflow_dispatch'
    needs: harness-selftests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and lock exact immutable provider set
        shell: bash
        env:
          PROVIDER_SET_COMMIT: ${{ inputs.provider_set_commit }}
          PROVIDER_SET_PATH: ${{ inputs.provider_set_path }}
          PROVIDER_SET_KEY: ${{ inputs.immutable_key }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/provider-set
          git fetch --no-tags origin "$PROVIDER_SET_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$PROVIDER_SET_COMMIT"
          git show "$PROVIDER_SET_COMMIT:$PROVIDER_SET_PATH" > artifacts/provider-set/manifest.json
          node qa/moradon/v2/lock-provider-set.cjs artifacts/provider-set/manifest.json "$PROVIDER_SET_KEY" artifacts/provider-set/lock.json
      - name: Assess playable combat readiness without manufacturing PASS
        shell: bash
        env:
          PROVIDER_SET_KEY: ${{ inputs.immutable_key }}
        run: |
          set +e
          node qa/moradon/v2/combat-readiness.cjs artifacts/provider-set/manifest.json "$PROVIDER_SET_KEY" artifacts/provider-set/combat-readiness.json
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo 'WS10_PLAYABLE_COMBAT_PREPARED_OR_BLOCKED BLOCKED'
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          else
            echo 'WS10_PLAYABLE_COMBAT_PREPARED_OR_BLOCKED PREPARED'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ws10-provider-readiness-${{ github.run_number }}
          retention-days: 14
          path: artifacts/provider-set/**

  native-visibility-v2:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_visibility
    needs: [harness-selftests, provider-readiness]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROVIDER_SET_COMMIT: ${{ inputs.provider_set_commit }}
      PROVIDER_SET_PATH: ${{ inputs.provider_set_path }}
      PROVIDER_SET_KEY: ${{ inputs.immutable_key }}
      WS10_TEST_ID: ws10e2e
      WS10_TEST_PW: ws10pass
      WS10_CHAR_NAME: Ws10Hero
      QA_ARTIFACT_DIR: artifacts/moradon-v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock manifest and extract exact identities
        shell: bash
        env:
          EMSCRIPTEN_INPUT: ${{ inputs.emscripten_version }}
        run: |
          set -euo pipefail
          mkdir -p "$QA_ARTIFACT_DIR" .qa-providers
          git fetch --no-tags origin "$PROVIDER_SET_COMMIT"
          git show "$PROVIDER_SET_COMMIT:$PROVIDER_SET_PATH" > "$QA_ARTIFACT_DIR/provider-set.json"
          node qa/moradon/v2/lock-provider-set.cjs "$QA_ARTIFACT_DIR/provider-set.json" "$PROVIDER_SET_KEY" "$QA_ARTIFACT_DIR/provider-lock.json"
          node - "$QA_ARTIFACT_DIR/provider-set.json" "$QA_ARTIFACT_DIR/provider-lock.json" "$EMSCRIPTEN_INPUT" >> "$GITHUB_ENV" <<'NODE'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[2]));const l=JSON.parse(fs.readFileSync(process.argv[3]));const em=process.argv[4];
          const required=['WS02','WS03','WS05','WS11','WS14','WS16','WS25','WS31'];for(const ws of required){if(!l.providers[ws])throw new Error(`missing ${ws}`);console.log(`${ws}_SHA=${l.providers[ws]}`);}
          const runtime=m.runtime_build_identity||{};if(runtime.emscripten_version&&runtime.emscripten_version!==em)throw new Error(`emscripten mismatch manifest=${runtime.emscripten_version} input=${em}`);
          if(!/^[0-9a-f]{40}$/.test(runtime.openko_sha||''))throw new Error('manifest openko_sha missing');if(!/^[0-9a-f]{40}$/.test(runtime.ko_assets_sha||''))throw new Error('manifest ko_assets_sha missing');
          console.log(`OPENKO_SHA=${runtime.openko_sha}`);console.log(`KO_ASSETS_SHA=${runtime.ko_assets_sha}`);
          NODE
      - name: Stage exact providers without resolving branch tips
        shell: bash
        run: |
          set -euo pipefail
          : > "$QA_ARTIFACT_DIR/provider-refs.txt"
          stage(){ key="$1"; sha="$2"; git fetch --no-tags origin "$sha"; test "$(git rev-parse FETCH_HEAD)" = "$sha"; git worktree add --detach ".qa-providers/$key" "$sha"; printf '%s %s\n' "$key" "$sha" >> "$QA_ARTIFACT_DIR/provider-refs.txt"; }
          stage ws02 "$WS02_SHA"; stage ws03 "$WS03_SHA"; stage ws05 "$WS05_SHA"; stage ws11 "$WS11_SHA"; stage ws14 "$WS14_SHA"; stage ws16 "$WS16_SHA"; stage ws25 "$WS25_SHA"; stage ws31 "$WS31_SHA"
      - name: Fetch exact Moradon terrain authority
        shell: bash
        run: |
          set -euo pipefail
          SMD="$RUNNER_TEMP/moradon_0826.smd"
          curl --fail --location --silent --show-error 'https://raw.githubusercontent.com/Open-KO/KnightOnline/7d6cf81093e142c928c2ac9510512b2b182178b5/assets/Server/MAP/moradon_0826.smd' --output "$SMD"
          python3 - "$SMD" <<'PY'
          import hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1]);d=p.read_bytes();assert len(d)==786000
          assert hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()=='cf47772b8e42a8bad71032419f47978c8bbd6142'
          PY
          echo "WS14_MORADON_SMD=$SMD" >> "$GITHUB_ENV"
      - name: Checkout exact OpenKO source and genuine KO assets
        shell: bash
        run: |
          set -euo pipefail
          git init openko; git -C openko remote add origin https://github.com/luisfelipe18/old-school-openko.git; git -C openko fetch --depth=1 origin "$OPENKO_SHA"; git -C openko checkout --detach FETCH_HEAD; test "$(git -C openko rev-parse HEAD)" = "$OPENKO_SHA"
          git init ko-assets; git -C ko-assets remote add origin https://github.com/ko4life-net/ko-assets.git; git -C ko-assets sparse-checkout init --no-cone
          printf 'Data\nUI_US\nSnd/Intro_Sound.mp3\nServer.ini\n' | git -C ko-assets sparse-checkout set --stdin
          git -C ko-assets fetch --depth=1 origin "$KO_ASSETS_SHA"; git -C ko-assets checkout --detach FETCH_HEAD; test "$(git -C ko-assets rev-parse HEAD)" = "$KO_ASSETS_SHA"
      - name: Apply canonical browser patches plus V1 and V2 observation-only probes
        shell: bash
        run: |
          set -euo pipefail
          python3 .qa-providers/ws05/tools/patch_openko_browser.py
          python3 .qa-providers/ws05/tools/patch_openko_browser_gateway.py
          python3 .qa-providers/ws05/tools/fix_browser_server_ini_case.py
          python3 .qa-providers/ws05/tools/patch_openko_browser_serverlist_probe.py
          python3 .qa-providers/ws05/tools/patch_openko_browser_auth_probe.py
          python3 .qa-providers/ws05/tools/ws04_character/patch_character_client.py
          python3 .qa-providers/ws05/tools/ws04_character/patch_frame_capture.py
          python3 .qa-providers/ws05/tools/ws05_moradon/patch_moradon_client.py
          python3 qa/moradon/patch_visibility_observability.py
          python3 qa/moradon/v2/patch_visibility_observability_v2.py
          grep -q 'WS10_VISIBILITY_V2 HUMAN_VISIBLE' openko/src/Client/WarFare/PlayerBase.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('openko/src/Client/WarFare/RHIDeviceGL.cpp');s=p.read_text();bad=r'#version 300 es\nprecision highp float;';good='#version 300 es\nprecision highp float;'
          if s.count(bad)!=2: raise SystemExit('escaped GLSL anchors changed')
          p.write_text(s.replace(bad,good))
          PY
      - name: Install tools and exact Emscripten
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git
          npm install --prefix qa --no-audit --no-fund
          npx --prefix qa playwright install --with-deps chromium
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ inputs.emscripten_version }}
          actions-cache-folder: emsdk-cache-v2
      - name: Build genuine KO1298 WebGL2 client
        shell: bash
        run: |
          set -o pipefail
          emcmake cmake -S openko -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' -DOPENKO_BUILD_CLIENT=ON -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON -DOPENKO_BUILD_CLIENT_TOOLS=OFF -DOPENKO_BUILD_TOOLS=OFF -DOPENKO_BUILD_SERVERS=OFF -DOPENKO_BUILD_TESTS=OFF -DOPENKO_FETCH_CLIENT_ASSETS=OFF -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF 2>&1 | tee "$QA_ARTIFACT_DIR/configure.log"
          cmake --build build-web --target WarFare -j2 2>&1 | tee "$QA_ARTIFACT_DIR/build.log"
          OUT=build-web/bin/Release; test -s "$OUT/KnightOnLine.js"; test -s "$OUT/KnightOnLine.wasm"; test -s "$OUT/KnightOnLine.data"
      - name: Run provider-parametric real-browser Visibility V2
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build-web/bin/Release"
          cat > "$OUT/ws10-moradon.html" <<'HTML'
          <!doctype html><html><body style="margin:0;background:#000;overflow:hidden"><canvas id="canvas" width="1024" height="768" tabindex="0"></canvas><pre id="status" style="display:none"></pre><script>(()=>{const s=document.getElementById('status');const w=(k,a)=>{const l='['+k+'] '+a.join(' ');s.textContent+=l+'\n';console.log(l)};window.Module={canvas:document.getElementById('canvas'),arguments:['--renderer','gl','--data','/data'],print:(...a)=>w('OUT',a),printErr:(...a)=>w('ERR',a),onRuntimeInitialized:()=>w('SMOKE',['WASM_RUNTIME_READY'])};})();</script><script src="KnightOnLine.js"></script></body></html>
          HTML
          WS50_PROVIDER_SET="$PROVIDER_SET_KEY" WS03_ROOT="$GITHUB_WORKSPACE/.qa-providers/ws03" WS14_ROOT="$GITHUB_WORKSPACE/.qa-providers/ws14" WS16_ROOT="$GITHUB_WORKSPACE/.qa-providers/ws16" WS25_ROOT="$GITHUB_WORKSPACE/.qa-providers/ws25" WS14_MORADON_SMD="$WS14_MORADON_SMD" WS16_NPC_DATA="$GITHUB_WORKSPACE/.qa-providers/ws16/world-data/npc/moradon.json" WS25_MOB_DATA="$GITHUB_WORKSPACE/.qa-providers/ws25/world-data/mobs/verified/moradon-zone21.verified.json" WS10_TEST_ID="$WS10_TEST_ID" WS10_TEST_PW="$WS10_TEST_PW" AUTH_TCP_PORT=16100 GAME_TCP_PORT=16101 node qa/moradon/integration-server.cjs > "$QA_ARTIFACT_DIR/composition-server.log" 2>&1 & COMPOSE=$!
          GATEWAY_MODE=auth AUTH_TCP_HOST=127.0.0.1 AUTH_TCP_PORT=16100 LISTEN_HOST=127.0.0.1 PORT=15100 WS_PATH=/ REQUIRE_ORIGIN=false node .qa-providers/ws02/services/ko-gateway/src/server.js > "$QA_ARTIFACT_DIR/gateway-auth.log" 2>&1 & AUTHGW=$!
          GATEWAY_MODE=game GAME_TCP_HOST=127.0.0.1 GAME_TCP_PORT=16101 LISTEN_HOST=127.0.0.1 PORT=15001 WS_PATH=/ REQUIRE_ORIGIN=false node .qa-providers/ws02/services/ko-gateway/src/server.js > "$QA_ARTIFACT_DIR/gateway-game.log" 2>&1 & GAMEGW=$!
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" > "$QA_ARTIFACT_DIR/http.log" 2>&1 & HTTP=$!; trap 'kill $HTTP $AUTHGW $GAMEGW $COMPOSE 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do grep -q 'WS10_AUTH type=mob id=' "$QA_ARTIFACT_DIR/composition-server.log" && break; sleep .2; done
          NPC_IDS=$(sed -n 's/.*WS10_AUTH type=npc id=\([-0-9]*\).*/\1/p' "$QA_ARTIFACT_DIR/composition-server.log" | paste -sd, -)
          MOB_IDS=$(sed -n 's/.*WS10_AUTH type=mob id=\([-0-9]*\).*/\1/p' "$QA_ARTIFACT_DIR/composition-server.log" | paste -sd, -)
          test -n "$NPC_IDS"; test -n "$MOB_IDS"
          WS10_PROVIDER_SET="$PROVIDER_SET_KEY" WS10_V2_REQUIRED_NPC_IDS="$NPC_IDS" WS10_V2_REQUIRED_MOB_IDS="$MOB_IDS" node qa/moradon/v2/browser-e2e-v2.cjs 2>&1 | tee "$QA_ARTIFACT_DIR/driver-v2.log"
          node qa/moradon/v2/verify-visibility-v2.cjs "$QA_ARTIFACT_DIR/composition-server.log" "$QA_ARTIFACT_DIR/driver-v2.log" "$PROVIDER_SET_KEY" "$QA_ARTIFACT_DIR/visibility-v2-proof.json" | tee "$QA_ARTIFACT_DIR/visibility-v2-gate.log"
      - name: Upload separate V2 evidence (never replaces historical C5 artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws10-visibility-v2-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/moradon-v2/**
