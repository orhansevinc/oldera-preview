name: OpenKO Browser Port

on:
  push:
    branches: [openko-browser-port]
  workflow_dispatch:

jobs:
  emscripten-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout OldERA control repo
        uses: actions/checkout@v4

      - name: Checkout OpenKO POSIX client
        uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: feature/port-posix
          path: openko
          submodules: false
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Record toolchain versions
        run: |
          emcc --version
          em++ --version
          cmake --version
          ninja --version

      - name: Configure OpenKO for WebAssembly
        id: configure
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee configure-web.log

      - name: Build real WarFare client
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-web --target WarFare -j2 2>&1 | tee build-web.log

      - name: Inspect generated web outputs
        if: always()
        shell: bash
        run: |
          echo "=== configure outcome: ${{ steps.configure.outcome }} ==="
          echo "=== build outcome: ${{ steps.build.outcome }} ==="
          find build-web -maxdepth 8 -type f \( -name '*.html' -o -name '*.js' -o -name '*.wasm' -o -name 'KnightOnLine*' \) -print 2>/dev/null | sort || true
          mkdir -p browser-probe-artifact
          cp configure-web.log browser-probe-artifact/ 2>/dev/null || true
          cp build-web.log browser-probe-artifact/ 2>/dev/null || true
          find build-web -type f \( -name '*.html' -o -name '*.js' -o -name '*.wasm' -o -name 'KnightOnLine*' \) -exec cp -f {} browser-probe-artifact/ \; 2>/dev/null || true

      - name: Upload browser-port probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openko-browser-probe
          path: browser-probe-artifact
          if-no-files-found: warn

      - name: Fail if browser build did not complete
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.configure.outcome }}" != "success" ]; then
            echo "OpenKO Emscripten configure failed; inspect configure-web.log."
            exit 1
          fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "OpenKO WarFare Emscripten build failed; inspect build-web.log."
            exit 1
          fi
