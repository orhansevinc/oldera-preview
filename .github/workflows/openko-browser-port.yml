name: OpenKO Browser Port

on:
  push:
    branches: [openko-browser-port]
    paths-ignore:
      - 'openko-web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emscripten-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout OldERA control repo
        uses: actions/checkout@v4
        with:
          ref: openko-browser-port
          fetch-depth: 0

      - name: Checkout OpenKO POSIX client
        uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: feature/port-posix
          path: openko
          submodules: false
          fetch-depth: 1

      - name: Patch OpenKO browser platform adapters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('openko/cmake/FindOpenALSoft.cmake')
          s = p.read_text()
          browser = '''if(EMSCRIPTEN)\n  add_library(OpenAL INTERFACE)\n  target_link_libraries(OpenAL INTERFACE "-lopenal")\n  set(openalsoft_FOUND TRUE)\n  return()\nendif()\n\n'''
          if not s.startswith('if(EMSCRIPTEN)'):
              p.write_text(browser + s)

          p = Path('openko/src/N3Base/N3SndMgr.h')
          s = p.read_text(encoding='utf-8-sig')
          old = 'struct ALCcontext;\nstruct ALCdevice;'
          new = '#ifdef __EMSCRIPTEN__\n#include <AL/alc.h>\n#else\nstruct ALCcontext;\nstruct ALCdevice;\n#endif'
          if old not in s:
              raise SystemExit('N3SndMgr.h OpenAL declarations changed upstream')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('openko/cmake/FindJpeg.cmake')
          s = p.read_text()
          s = s.replace('if(WIN32)\n  set(LIBJPEG_BUILD_SHARED_LIBS OFF',
                        'if(WIN32 OR EMSCRIPTEN)\n  set(LIBJPEG_BUILD_SHARED_LIBS OFF')
          s = s.replace('if(WIN32)\n  target_link_libraries(libjpeg INTERFACE jpeg_static)',
                        'if(WIN32 OR EMSCRIPTEN)\n  target_link_libraries(libjpeg INTERFACE jpeg_static)')
          p.write_text(s)

          p = Path('openko/src/Client/WarFare/CMakeLists.txt')
          s = p.read_text()
          s = s.replace('if(UNIX AND NOT APPLE)\n    # Linux: a freedesktop menu entry',
                        'if(UNIX AND NOT APPLE AND NOT EMSCRIPTEN)\n    # Linux: a freedesktop menu entry')
          web = '\nif(EMSCRIPTEN)\n  set_target_properties(WarFare PROPERTIES SUFFIX ".html")\n  target_link_options(WarFare PRIVATE "-sMIN_WEBGL_VERSION=2" "-sMAX_WEBGL_VERSION=2" "-sALLOW_MEMORY_GROWTH=1" "-sFORCE_FILESYSTEM=1" "-sASYNCIFY" "-sEXIT_RUNTIME=1" "-sASSERTIONS=1")\nendif()\n'
          s += web
          p.write_text(s)
          PY

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure OpenKO for WebAssembly
        id: configure
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee configure-web.log

      - name: Build real WarFare browser client
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-web --target WarFare -j2 2>&1 | tee build-web.log

      - name: Verify browser build
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.configure.outcome }}" != "success" ]; then exit 1; fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi
          test -s build-web/bin/Release/KnightOnLine.html
          test -s build-web/bin/Release/KnightOnLine.js
          test -s build-web/bin/Release/KnightOnLine.wasm

      - name: Publish browser executable into branch
        shell: bash
        run: |
          rm -rf openko-web
          mkdir -p openko-web
          cp -f build-web/bin/Release/KnightOnLine.html openko-web/index.html
          cp -f build-web/bin/Release/KnightOnLine.js openko-web/KnightOnLine.js
          cp -f build-web/bin/Release/KnightOnLine.wasm openko-web/KnightOnLine.wasm
          find build-web/bin/Release -maxdepth 1 -type f -name '*.cur' -exec cp -f {} openko-web/ \;
          cat > openko-web/README.txt <<'EOF'
          OldERA OpenKO browser-port milestone.
          This is the real OpenKO 1.298 WarFare C++ client compiled by Emscripten.
          Assets/network transport are the next browser-adaptation milestones.
          EOF
          git config user.name "OldERA Build Bot"
          git config user.email "actions@github.com"
          git add -f openko-web
          if git diff --cached --quiet; then
            echo 'Published files unchanged.'
          else
            git commit -m 'Publish real OpenKO Emscripten browser executable [skip ci]'
            git push origin HEAD:openko-browser-port
          fi

      - name: Upload browser-port artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openko-browser-probe
          path: |
            configure-web.log
            build-web.log
            build-web/bin/Release/KnightOnLine.html
            build-web/bin/Release/KnightOnLine.js
            build-web/bin/Release/KnightOnLine.wasm
            build-web/bin/Release/*.cur
          if-no-files-found: warn
