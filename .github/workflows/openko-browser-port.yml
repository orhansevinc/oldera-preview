name: OpenKO Browser Port

on:
  push:
    branches: [openko-browser-port]
    paths-ignore:
      - 'openko-web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emscripten-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout OldERA control repo
        uses: actions/checkout@v4
        with:
          ref: openko-browser-port
          fetch-depth: 0

      - name: Checkout OpenKO POSIX client
        uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: feature/port-posix
          path: openko
          submodules: false
          fetch-depth: 1

      - name: Checkout genuine KO 1298 login assets
        uses: actions/checkout@v4
        with:
          repository: ko4life-net/ko-assets
          ref: 1298
          path: ko-assets
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Data
            UI_US
            Snd/Intro_Sound.mp3
            Server.ini

      - name: Verify 1298 asset slice
        shell: bash
        run: |
          test -s ko-assets/Data/Texts_us.tbl
          test -s ko-assets/Data/UIs_us.tbl
          test -s ko-assets/UI_US/el_login_intro_us.uif
          test -s ko-assets/Snd/Intro_Sound.mp3
          test -s ko-assets/Server.ini
          echo "Data files: $(find ko-assets/Data -type f | wc -l)"
          echo "UI_US files: $(find ko-assets/UI_US -type f | wc -l)"
          du -sh ko-assets/Data ko-assets/UI_US ko-assets/Snd/Intro_Sound.mp3

      - name: Patch OpenKO for WebGL2 browser runtime
        shell: bash
        run: |
          python3 tools/patch_openko_browser.py
          # The patcher intentionally stores C++ replacement text as Python
          # strings. Correct the one GLSL escape that must become an actual
          # source newline before compiling the browser target.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openko/src/Client/WarFare/RHIDeviceGL.cpp')
          s = p.read_text()
          bad = r'#version 300 es\nprecision highp float;'
          good = '#version 300 es\nprecision highp float;'
          count = s.count(bad)
          if count != 2:
              raise SystemExit(f'expected 2 escaped GLSL headers, found {count}')
          p.write_text(s.replace(bad, good))
          print('Corrected both GLSL ES 300 shader headers to real newlines')
          PY

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure OpenKO for WebAssembly
        id: configure
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' \
            -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee configure-web.log

      - name: Build real WarFare WebGL2 client with 1298 login data
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-web --target WarFare -j2 2>&1 | tee build-web.log

      - name: Verify browser login build
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.configure.outcome }}" != "success" ]; then exit 1; fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi
          test -s build-web/bin/Release/KnightOnLine.html
          test -s build-web/bin/Release/KnightOnLine.js
          test -s build-web/bin/Release/KnightOnLine.wasm
          test -s build-web/bin/Release/KnightOnLine.data
          echo "Browser package sizes:"
          du -h build-web/bin/Release/KnightOnLine.{js,wasm,data}

      - name: Runtime smoke test in real headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-web/bin/Release
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium found on GitHub runner" >&2
            exit 1
          fi
          echo "Runtime browser: $($CHROME --version)"

          cat > "$OUT/smoke.html" <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>OldERA runtime smoke</title></head>
          <body style="margin:0;background:#000">
          <canvas id="canvas" width="1024" height="768"></canvas>
          <pre id="status" style="color:#fff"></pre>
          <script>
          (() => {
            const status = document.getElementById('status');
            const canvas = document.getElementById('canvas');
            const write = (kind, args) => {
              const line = '[' + kind + '] ' + args.join(' ');
              status.textContent += line + '\n';
              console.log(line);
            };
            window.Module = {
              canvas,
              arguments: ['--renderer','gl','--data','/data'],
              print: (...a) => write('OUT', a),
              printErr: (...a) => write('ERR', a),
              onRuntimeInitialized: () => write('SMOKE', ['WASM_RUNTIME_READY'])
            };
          })();
          </script>
          <script src="KnightOnLine.js"></script>
          </body></html>
          EOF

          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" >browser-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          mkdir -p /tmp/oldera-playwright
          npm --prefix /tmp/oldera-playwright init -y >/dev/null 2>&1
          npm --prefix /tmp/oldera-playwright install --no-audit --no-fund playwright-core@1.55.0 >/dev/null

          cat > browser-smoke.cjs <<'EOF'
          const fs = require('fs');
          const { chromium } = require('/tmp/oldera-playwright/node_modules/playwright-core');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME,
              args: [
                '--no-sandbox',
                '--disable-dev-shm-usage',
                '--use-angle=swiftshader',
                '--enable-unsafe-swiftshader',
                '--enable-webgl',
                '--ignore-gpu-blocklist',
                '--autoplay-policy=no-user-gesture-required'
              ]
            });
            const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
            const push = (line) => console.log(line);
            page.on('console', msg => push('[console:' + msg.type() + '] ' + msg.text()));
            page.on('pageerror', err => push('[pageerror] ' + err.stack));
            page.on('requestfailed', req => push('[requestfailed] ' + req.url() + ' ' + (req.failure()?.errorText || '')));

            let ok = false;
            try {
              await page.goto('http://127.0.0.1:8000/smoke.html', {
                waitUntil: 'domcontentloaded', timeout: 30000
              });
              await page.waitForFunction(() => {
                const text = document.getElementById('status')?.textContent || '';
                return text.includes('browser login scene ready; network deferred to WebSocket gateway')
                  && text.includes('login scene: CGameProcedure brought up');
              }, null, { timeout: 90000 });
              ok = true;
            } catch (err) {
              push('[runner-error] ' + err.stack);
            } finally {
              const status = await page.locator('#status').textContent().catch(() => '');
              push('--- DOM STATUS ---\n' + status + '\n--- END DOM STATUS ---');
              await page.screenshot({ path: 'browser-runtime.png', fullPage: false }).catch(err => push('[screenshot-error] ' + err));
              fs.writeFileSync('browser-status.txt', status || '');
              await browser.close();
            }
            process.exit(ok ? 0 : 1);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

          set +e
          CHROME="$CHROME" timeout 120s node browser-smoke.cjs 2>&1 | tee browser-runtime.log
          NODE_RC=${PIPESTATUS[0]}
          set -e

          echo "--- browser runtime tail ---"
          tail -n 120 browser-runtime.log || true
          echo "--- http server tail ---"
          tail -n 30 browser-http.log || true

          test "$NODE_RC" -eq 0
          grep -q "WASM_RUNTIME_READY" browser-status.txt
          grep -q "render backend: OpenGL" browser-status.txt
          grep -q "login scene: CGameProcedure brought up" browser-status.txt
          grep -q "browser login scene ready; network deferred to WebSocket gateway" browser-status.txt
          if grep -q "render backend: Null" browser-status.txt; then
            echo "Browser fell back to Null renderer" >&2
            exit 1
          fi
          if grep -q "game data not found" browser-status.txt; then
            echo "Browser could not see preloaded 1298 data" >&2
            exit 1
          fi
          echo "Headless Chrome proved genuine 1298 login scene + WebGL2 runtime."

      - name: Publish browser login build into branch
        shell: bash
        run: |
          rm -rf openko-web
          mkdir -p openko-web
          cp -f build-web/bin/Release/KnightOnLine.js openko-web/KnightOnLine.js
          cp -f build-web/bin/Release/KnightOnLine.wasm openko-web/KnightOnLine.wasm
          cp -f build-web/bin/Release/KnightOnLine.data openko-web/KnightOnLine.data

          cat > openko-web/index.html <<'EOF'
          <!doctype html>
          <html lang="tr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
            <title>OldERA — Knight Online 1298</title>
            <style>
              * { box-sizing: border-box; }
              html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
              body { display:grid; place-items:center; font-family:Consolas,monospace; }
              #stage { position:relative; width:1024px; height:768px; transform-origin:center center; }
              #canvas { display:block; width:1024px; height:768px; background:#000; outline:none; }
              #status { position:fixed; left:10px; top:8px; z-index:10; margin:0; color:#b8ffb8;
                        font-size:12px; line-height:1.35; white-space:pre-wrap; pointer-events:none;
                        text-shadow:0 1px 2px #000; max-width:min(900px,95vw); }
            </style>
          </head>
          <body>
            <div id="stage"><canvas id="canvas" width="1024" height="768" tabindex="0"></canvas></div>
            <pre id="status">OldERA / gerçek KO 1298 client yükleniyor…</pre>
            <script>
              (() => {
                const W=1024, H=768;
                const stage=document.getElementById('stage');
                const canvas=document.getElementById('canvas');
                const status=document.getElementById('status');
                const lines=[];
                const log=(kind,text)=>{
                  const line=(kind?'['+kind+'] ':'')+text;
                  console[kind==='ERR'?'error':'log'](line);
                  lines.push(line); while(lines.length>20) lines.shift();
                  status.textContent=lines.join('\n');
                };
                const fit=()=>{
                  const scale=Math.min(innerWidth/W,innerHeight/H);
                  stage.style.transform=`scale(${scale})`;
                };
                addEventListener('resize',fit); fit(); canvas.focus();
                window.Module={
                  canvas,
                  arguments:['--renderer','gl','--data','/data'],
                  print:(...a)=>log('OUT',a.join(' ')),
                  printErr:(...a)=>log('ERR',a.join(' ')),
                  onRuntimeInitialized:()=>log('OUT','WASM hazır; 1298 Data/UI filesystem bağlandı.')
                };
              })();
            </script>
            <script async src="KnightOnLine.js"></script>
          </body>
          </html>
          EOF

          cat > openko-web/README.txt <<'EOF'
          OldERA OpenKO browser-port — genuine 1298 login milestone.
          Real OpenKO WarFare C++ client compiled to WASM, RHIDeviceGL adapted to WebGL2.
          Logical framebuffer: fixed 1024x768. Presentation scaling: CSS only.
          Preloaded from ko4life-net/ko-assets branch 1298: Data, UI_US, Intro_Sound.mp3 and Server.ini.
          Browser boots the real GameProc login path with --data /data; no Three.js/DOM game UI recreation.
          EOF

          git config user.name "OldERA Build Bot"
          git config user.email "actions@github.com"
          git add -f openko-web
          if git diff --cached --quiet; then
            echo 'Published files unchanged.'
          else
            git commit -m 'Publish genuine 1298 OpenKO browser login [skip ci]'
            git push origin HEAD:openko-browser-port
          fi

      - name: Upload browser-port artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openko-browser-login
          path: |
            configure-web.log
            build-web.log
            browser-runtime.log
            browser-status.txt
            browser-runtime.png
            browser-http.log
            build-web/bin/Release/KnightOnLine.html
            build-web/bin/Release/KnightOnLine.js
            build-web/bin/Release/KnightOnLine.wasm
            build-web/bin/Release/KnightOnLine.data
          if-no-files-found: warn
