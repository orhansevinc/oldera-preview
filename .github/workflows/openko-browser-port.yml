name: OpenKO Browser Port

on:
  push:
    branches: [openko-browser-port]
    paths-ignore:
      - 'openko-web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emscripten-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout OldERA control repo
        uses: actions/checkout@v4
        with:
          ref: openko-browser-port
          fetch-depth: 0

      - name: Checkout OpenKO POSIX client
        uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: feature/port-posix
          path: openko
          submodules: false
          fetch-depth: 1

      - name: Checkout genuine KO 1298 login assets
        uses: actions/checkout@v4
        with:
          repository: ko4life-net/ko-assets
          ref: 1298
          path: ko-assets
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Data
            UI_US
            Snd/Intro_Sound.mp3
            Server.ini

      - name: Verify genuine 1298 asset slice
        shell: bash
        run: |
          set -euo pipefail
          test -s ko-assets/Data/Texts_us.tbl
          test -s ko-assets/Data/UIs_us.tbl
          test -s ko-assets/UI_US/el_login_intro_us.uif
          test -s ko-assets/Snd/Intro_Sound.mp3
          test -s ko-assets/Server.ini
          echo "Data files: $(find ko-assets/Data -type f | wc -l)"
          echo "UI_US files: $(find ko-assets/UI_US -type f | wc -l)"

      - name: Patch real 1298 WebGL2 client and browser CAPISocket transport
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_openko_browser.py
          python3 tools/patch_openko_browser_gateway.py
          python3 tools/fix_browser_server_ini_case.py
          python3 tools/patch_openko_browser_serverlist_probe.py
          python3 tools/patch_openko_browser_auth_probe.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openko/src/Client/WarFare/RHIDeviceGL.cpp')
          s = p.read_text()
          bad = r'#version 300 es\nprecision highp float;'
          good = '#version 300 es\nprecision highp float;'
          count = s.count(bad)
          if count != 2:
              raise SystemExit(f'escaped GLSL browser shader anchors changed: {count}')
          p.write_text(s.replace(bad, good))
          print('Corrected both GLSL ES 300 shader headers')
          PY

      - name: Install build and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git
          npm install --no-save --no-audit --no-fund ws@8.18.3 playwright-core@1.55.0

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure real WarFare browser client
        id: configure
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' \
            -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee configure-web.log

      - name: Build real WarFare WASM client
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-web --target WarFare -j2 2>&1 | tee build-web.log

      - name: Verify browser package
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.configure.outcome }}" != "success" ]; then exit 1; fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then exit 1; fi
          test -s build-web/bin/Release/KnightOnLine.html
          test -s build-web/bin/Release/KnightOnLine.js
          test -s build-web/bin/Release/KnightOnLine.wasm
          test -s build-web/bin/Release/KnightOnLine.data
          du -h build-web/bin/Release/KnightOnLine.{js,wasm,data}

      - name: Canonical real UI auth roundtrip gate
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-web/bin/Release
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "Runtime browser: $($CHROME --version)"

          TEST_ID="probe${GITHUB_RUN_NUMBER}"
          TEST_PW="p${GITHUB_RUN_NUMBER}x7"
          export TEST_ID TEST_PW

          rm -f ko-auth-result.txt ko-auth-stub.log gateway-auth.log browser-auth.log browser-auth-status.txt browser-auth-canvas.png http-auth.log
          KO_STUB_PORT=16100 KO_AUTH_RESULT=ko-auth-result.txt KO_TEST_ID="$TEST_ID" KO_TEST_PW="$TEST_PW" \
            node tools/ko_auth_stub.mjs >ko-auth-stub.log 2>&1 &
          STUB_PID=$!
          KO_TARGET_HOST=127.0.0.1 KO_TARGET_PORT=16100 OLDERA_GATEWAY_PORT=15100 \
            node gateway/oldera-gateway.mjs >gateway-auth.log 2>&1 &
          GATEWAY_PID=$!
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" >http-auth.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID $GATEWAY_PID $STUB_PID 2>/dev/null || true' EXIT
          sleep 2

          cat > "$OUT/auth.html" <<'EOF'
          <!doctype html><html><body style="margin:0;background:#000;overflow:hidden">
          <canvas id="canvas" width="1024" height="768" tabindex="0"></canvas>
          <pre id="status" style="display:none"></pre>
          <script>
          (()=>{
            const status=document.getElementById('status');
            const write=(kind,args)=>{const line='['+kind+'] '+args.join(' ');status.textContent+=line+'\n';console.log(line);};
            window.Module={canvas:document.getElementById('canvas'),arguments:['--renderer','gl','--data','/data'],
              print:(...a)=>write('OUT',a),printErr:(...a)=>write('ERR',a),onRuntimeInitialized:()=>write('SMOKE',['WASM_RUNTIME_READY'])};
          })();
          </script><script src="KnightOnLine.js"></script></body></html>
          EOF

          CHROME="$CHROME" TEST_ID="$TEST_ID" TEST_PW="$TEST_PW" timeout 150s \
            node tools/browser_auth_driver.cjs 2>&1 | tee browser-auth.log

          echo '=== CLIENT ==='; tail -n 140 browser-auth.log || true
          echo '=== GATEWAY ==='; cat gateway-auth.log || true
          echo '=== AUTH STUB ==='; cat ko-auth-stub.log || true
          echo '=== AUTH RESULT ==='; cat ko-auth-result.txt || true

          grep -q "AUTH_CHAIN request=1 matched=1 response=1 id=$TEST_ID news=1" ko-auth-result.txt
          grep -q "login id='$TEST_ID'" ko-auth-stub.log
          grep -q 'WASM_RUNTIME_READY' browser-auth-status.txt
          grep -q 'render backend: OpenGL' browser-auth-status.txt
          grep -q 'login scene: CGameProcedure brought up' browser-auth-status.txt
          grep -q 'browser login response: cmd=0xf3 result=1' browser-auth-status.txt
          grep -q 'server list opened (1 server(s) available)' browser-auth-status.txt
          grep -q 'AUTH_UI_OK' browser-auth.log
          if grep -Eq '\[pageerror\]|GL_INVALID_(ENUM|VALUE|OPERATION)|WebGL: INVALID_|WebGL: too many errors' browser-auth.log; then
            echo 'Browser/WebGL error detected; publication blocked' >&2
            exit 1
          fi
          if grep -q 'render backend: Null' browser-auth-status.txt; then
            echo 'Browser fell back to Null renderer; publication blocked' >&2
            exit 1
          fi
          echo 'AUTH_CANONICAL_OK real 1298 Edit_ID/Edit_PW -> F3 -> WebSocket gateway -> TCP -> AUTH_OK -> F6 -> real server list UI'

      - name: Publish proven browser client into branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf openko-web
          mkdir -p openko-web
          cp -f build-web/bin/Release/KnightOnLine.js openko-web/KnightOnLine.js
          cp -f build-web/bin/Release/KnightOnLine.wasm openko-web/KnightOnLine.wasm
          cp -f build-web/bin/Release/KnightOnLine.data openko-web/KnightOnLine.data

          cat > openko-web/index.html <<'EOF'
          <!doctype html>
          <html lang="tr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
            <title>OldERA — Knight Online 1298</title>
            <style>
              *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
              body{display:grid;place-items:center}#stage{position:relative;width:1024px;height:768px;transform-origin:center center}
              #canvas{display:block;width:1024px;height:768px;background:#000;outline:none}
              #status{position:fixed;left:10px;top:8px;z-index:10;margin:0;color:#b8ffb8;font:12px/1.35 Consolas,monospace;white-space:pre-wrap;pointer-events:none;text-shadow:0 1px 2px #000;max-width:min(900px,95vw)}
            </style>
          </head>
          <body>
            <div id="stage"><canvas id="canvas" width="1024" height="768" tabindex="0"></canvas></div>
            <pre id="status">OldERA / gerçek KO 1298 client yükleniyor…</pre>
            <script>
            (()=>{
              const W=1024,H=768,stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),status=document.getElementById('status'),lines=[];
              const log=(kind,text)=>{const line=(kind?'['+kind+'] ':'')+text;console[kind==='ERR'?'error':'log'](line);lines.push(line);while(lines.length>20)lines.shift();status.textContent=lines.join('\n')};
              const fit=()=>{stage.style.transform=`scale(${Math.min(innerWidth/W,innerHeight/H)})`};addEventListener('resize',fit);fit();canvas.focus();
              window.Module={canvas,arguments:['--renderer','gl','--data','/data'],print:(...a)=>log('OUT',a.join(' ')),printErr:(...a)=>log('ERR',a.join(' ')),onRuntimeInitialized:()=>log('OUT','WASM hazır; 1298 Data/UI filesystem bağlandı.')};
            })();
            </script>
            <script async src="KnightOnLine.js"></script>
          </body></html>
          EOF

          cat > openko-web/README.txt <<'EOF'
          OldERA OpenKO browser-port — genuine 1298 real UI auth milestone.
          Real OpenKO WarFare C++ client compiled to WASM/WebGL2 with genuine 1298 Data/UI assets.
          Browser CAPISocket uses Emscripten WebSocket transport while preserving original KO packet framing/parsing.
          Canonical CI proves real Edit_ID/Edit_PW input -> F3 login -> WebSocket gateway -> TCP -> auth response -> F6 notice -> real server-list UI.
          No Three.js/DOM game UI recreation.
          EOF

          git config user.name "OldERA Build Bot"
          git config user.email "actions@github.com"
          git add -f openko-web
          if git diff --cached --quiet; then
            echo 'Published files unchanged.'
          else
            git commit -m 'Publish proven 1298 browser auth client [skip ci]'
            git push origin HEAD:openko-browser-port
          fi

      - name: Upload canonical browser-port proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openko-browser-auth-canonical
          path: |
            configure-web.log
            build-web.log
            browser-auth.log
            browser-auth-status.txt
            browser-auth-canvas.png
            gateway-auth.log
            ko-auth-stub.log
            ko-auth-result.txt
            http-auth.log
            build-web/bin/Release/KnightOnLine.html
            build-web/bin/Release/KnightOnLine.js
            build-web/bin/Release/KnightOnLine.wasm
            build-web/bin/Release/KnightOnLine.data
          if-no-files-found: warn
