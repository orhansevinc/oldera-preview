name: WS05 Moradon World

on:
  push:
    branches: [ws05-moradon-world]
    paths:
      - 'tools/ws05_moradon/**'
      - 'workstreams/ws05/**'
      - '.github/workflows/ws05-moradon-world.yml'
  workflow_dispatch:
    inputs:
      run_native_gate:
        description: 'Run the real selected-character -> Moradon browser gate'
        type: boolean
        required: true
        default: false
      auth_host:
        description: 'Reachable KO login/auth TCP host for the integrated test environment'
        type: string
        required: false
        default: ''
      auth_port:
        description: 'KO login/auth TCP port'
        type: string
        required: false
        default: '15100'
      game_host:
        description: 'Reachable KO 1298 game/session TCP host implementing WS03+WS14 handoff'
        type: string
        required: false
        default: ''
      game_port:
        description: 'KO 1298 game/session TCP port'
        type: string
        required: false
        default: '15001'

permissions:
  contents: read

jobs:
  ws05-contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws05-moradon-world
      - name: Validate WS05 gate logic
        run: |
          python3 -m py_compile tools/ws05_moradon/patch_moradon_client.py tools/ws05_moradon/moradon_gate.py
          python3 tools/ws05_moradon/test_moradon_gate.py

  native-moradon-render:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_gate }}
    needs: ws05-contract-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout WS05
        uses: actions/checkout@v4
        with:
          ref: ws05-moradon-world
          fetch-depth: 1

      - name: Require integration credentials
        shell: bash
        env:
          TEST_ID: ${{ secrets.WS05_TEST_ID }}
          TEST_PW: ${{ secrets.WS05_TEST_PW }}
          AUTH_HOST: ${{ inputs.auth_host }}
          AUTH_PORT: ${{ inputs.auth_port }}
          GAME_HOST: ${{ inputs.game_host }}
          GAME_PORT: ${{ inputs.game_port }}
        run: |
          set -euo pipefail
          test -n "$TEST_ID" || { echo 'missing WS05_TEST_ID secret' >&2; exit 2; }
          test -n "$TEST_PW" || { echo 'missing WS05_TEST_PW secret' >&2; exit 2; }
          test -n "$AUTH_HOST" || { echo 'missing reachable auth_host workflow input' >&2; exit 2; }
          test -n "$AUTH_PORT" || { echo 'missing auth_port workflow input' >&2; exit 2; }
          test -n "$GAME_HOST" || { echo 'missing reachable game_host workflow input' >&2; exit 2; }
          test -n "$GAME_PORT" || { echo 'missing game_port workflow input' >&2; exit 2; }

      - name: Checkout OpenKO POSIX client
        uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: 97eb0ea20207afc0c360bfed6915113572711be3
          path: openko
          submodules: false
          fetch-depth: 1

      - name: Checkout genuine KO 1298 assets
        uses: actions/checkout@v4
        with:
          repository: ko4life-net/ko-assets
          ref: 705874881c8308e0a45a0c849e4b3881088d8138
          path: ko-assets
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Data
            UI_US
            Snd/Intro_Sound.mp3
            Server.ini

      - name: Patch real browser client and WS04/WS05 evidence hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_openko_browser.py
          python3 tools/patch_openko_browser_gateway.py
          python3 tools/fix_browser_server_ini_case.py
          python3 tools/patch_openko_browser_serverlist_probe.py
          python3 tools/patch_openko_browser_auth_probe.py
          python3 tools/ws04_character/patch_character_client.py
          python3 tools/ws04_character/patch_frame_capture.py
          python3 tools/ws05_moradon/patch_moradon_client.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openko/src/Client/WarFare/RHIDeviceGL.cpp')
          s = p.read_text()
          bad = r'#version 300 es\nprecision highp float;'
          good = '#version 300 es\nprecision highp float;'
          count = s.count(bad)
          if count != 2:
              raise SystemExit(f'escaped GLSL browser shader anchors changed: {count}')
          p.write_text(s.replace(bad, good))
          PY
          for d in Chr DTex Item Misc Object Zones fx; do
            test -n "$(find "ko-assets/$d" -type f -print -quit)" || { echo "empty genuine asset dir: $d" >&2; exit 1; }
          done
          for f in moradon.gtd moradon.opd moradon.tct; do
            test -s "ko-assets/Zones/$f" || { echo "missing genuine Moradon asset: Zones/$f" >&2; exit 1; }
          done
          grep -q 'ko-assets/Zones@/data/Zones' openko/src/Client/WarFare/CMakeLists.txt
          grep -q 'WS05_GATE event=moradon-zone-begin' openko/src/Client/WarFare/N3TerrainManager.cpp
          grep -q 'WS05_GATE event=moradon-local-player-rendered' openko/src/Client/WarFare/GameProcMain.cpp

      - name: Install build/browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git
          npm install --no-save --no-audit --no-fund ws@8.18.3 playwright-core@1.55.0 pngjs@7.0.0

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure real WarFare browser client
        shell: bash
        run: |
          set -o pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' \
            -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee ws05-configure.log

      - name: Build real WarFare WASM client
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-web --target WarFare -j2 2>&1 | tee ws05-build.log
          test -s build-web/bin/Release/KnightOnLine.js
          test -s build-web/bin/Release/KnightOnLine.wasm
          test -s build-web/bin/Release/KnightOnLine.data

      - name: Run authentic selected-character to Moradon gate
        shell: bash
        env:
          TEST_ID: ${{ secrets.WS05_TEST_ID }}
          TEST_PW: ${{ secrets.WS05_TEST_PW }}
          AUTH_HOST: ${{ inputs.auth_host }}
          AUTH_PORT: ${{ inputs.auth_port }}
          GAME_HOST: ${{ inputs.game_host }}
          GAME_PORT: ${{ inputs.game_port }}
        run: |
          set -euo pipefail
          OUT=build-web/bin/Release
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          export CHROME TEST_ID TEST_PW

          KO_TARGET_HOST="$AUTH_HOST" KO_TARGET_PORT="$AUTH_PORT" OLDERA_GATEWAY_PORT=15100 \
            node gateway/oldera-gateway.mjs >ws05-gateway-auth.log 2>&1 &
          AUTH_GATEWAY_PID=$!
          KO_TARGET_HOST="$GAME_HOST" KO_TARGET_PORT="$GAME_PORT" OLDERA_GATEWAY_PORT=15001 \
            node gateway/oldera-gateway.mjs >ws05-gateway-game.log 2>&1 &
          GAME_GATEWAY_PID=$!
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" >ws05-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID $AUTH_GATEWAY_PID $GAME_GATEWAY_PID 2>/dev/null || true' EXIT

          cat > "$OUT/ws05.html" <<'EOF'
          <!doctype html><html><body style="margin:0;background:#000;overflow:hidden">
          <canvas id="canvas" width="1024" height="768" tabindex="0"></canvas>
          <pre id="status" style="display:none"></pre>
          <script>
          (() => {
            const status = document.getElementById('status');
            const write = (kind,args) => { const line='['+kind+'] '+args.join(' '); status.textContent+=line+'\n'; console.log(line); };
            window.Module = {canvas:document.getElementById('canvas'), arguments:['--renderer','gl','--data','/data'],
              print:(...a)=>write('OUT',a), printErr:(...a)=>write('ERR',a),
              onRuntimeInitialized:()=>write('SMOKE',['WASM_RUNTIME_READY'])};
          })();
          </script><script src="KnightOnLine.js"></script></body></html>
          EOF
          sleep 2

          set +e
          timeout 300s node tools/ws05_moradon/browser_moradon_driver.cjs 2>&1 | tee ws05-browser.log
          DRIVER_RC=${PIPESTATUS[0]}
          set -e
          cat ws05-browser-status.txt >> ws05-browser.log 2>/dev/null || true
          if [ "$DRIVER_RC" -ne 0 ]; then exit "$DRIVER_RC"; fi
          python3 tools/ws05_moradon/moradon_gate.py ws05-browser.log | tee ws05-gate.txt

      - name: Upload WS05 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws05-moradon-world-proof
          path: |
            ws05-gate.txt
            ws05-browser.log
            ws05-browser-status.txt
            ws05-moradon.png
            ws05-gateway-auth.log
            ws05-gateway-game.log
            ws05-http.log
            ws05-configure.log
            ws05-build.log
          if-no-files-found: warn
