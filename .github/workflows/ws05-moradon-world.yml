name: WS05 Human Visible Moradon Entities

on:
  push:
    branches: [ws05-moradon-world]
    paths:
      - 'tools/ws05_moradon/**'
      - 'workstreams/ws05/**'
      - '.github/workflows/ws05-moradon-world.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  WS38_PIN: 683f6d55471d1b101371e5766ecf0ef21c8bf1e9
  WS10_PIN: 33bfef078f20bf4e97611f906fcc6ec7fd7fc277
  WS02_PIN: 1738f60945b24e00bdd2266e6600b5c0cf3c64cf
  WS03_PIN: f127bb85453c13e89ea1093dd2873888b892dd12
  WS14_PIN: ed5f806ce7505f4dfae406e4164735def63b6c86
  WS15_PIN: ce9bed13b8d45c32ff0592595aa3a0d1e7b3964d
  WS16_PIN: 5ed48ff32187000312652838674388df52fc3fb7
  WS25_PIN: 18c9e9b8439fef88fc93d74bfec7981b0cb41958
  WS31_PIN: 56ada741532c8f6cabfc83b129a8e87e645db055
  OPENKO_PIN: 97eb0ea20207afc0c360bfed6915113572711be3
  KO_ASSETS_PIN: 2055ee6ed77f1b5cfef23832dd5bc31909e14a66
  QA_ARTIFACT_DIR: artifacts/ws05-human-visible
  WS05_TEST_ID: ws05e2e
  WS05_TEST_PW: ws05pass
  WS05_CHAR_NAME: Ws05Hero

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws05-moradon-world
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fail-closed WS05 harness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/ws05_moradon/patch_moradon_client.py \
            tools/ws05_moradon/prepare_bandicoot_assets.py \
            tools/ws05_moradon/patch_bandicoot_asset_probe.py \
            tools/ws05_moradon/tighten_visibility_v2.py \
            tools/ws05_moradon/build_human_visible_evidence.py
          node --check tools/ws05_moradon/verify_ws25_record_contract.cjs
          node --check tools/ws05_moradon/integration_server_human_visible.cjs
          node --check tools/ws05_moradon/browser_human_visible_driver.cjs
          if grep -En 'ccall\(|cwrap\(|Module\._|applyDamage\(|injectDamage|memory.*position|position.*memory' tools/ws05_moradon/browser_human_visible_driver.cjs; then
            echo 'forbidden gameplay state mutation in browser driver' >&2
            exit 1
          fi
          grep -q 'RealBrowserInput' tools/ws05_moradon/browser_human_visible_driver.cjs
          grep -q 'fake_teleport=0' tools/ws05_moradon/integration_server_human_visible.cjs
          grep -q "detail?.template_id==='ko1298:monster:850'" tools/ws05_moradon/integration_server_human_visible.cjs
          grep -q "record?.detail?.pid===800" tools/ws05_moradon/integration_server_human_visible.cjs

  native-human-visible:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout WS05 without branch upgrades
        uses: actions/checkout@v4
        with:
          ref: ws05-moradon-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin manifest and exact provider worktrees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_ARTIFACT_DIR" .providers
          git fetch --no-tags origin "$WS38_PIN" "$WS10_PIN" "$WS02_PIN" "$WS03_PIN" "$WS14_PIN" "$WS15_PIN" "$WS16_PIN" "$WS25_PIN" "$WS31_PIN"
          git show "$WS38_PIN:workstreams/ws38/MORADON_PLAYABLE_COMBAT_ASSET_MANIFEST.json" > "$QA_ARTIFACT_DIR/ws38-manifest.json"
          printf 'ws38 %s\n' "$WS38_PIN" > "$QA_ARTIFACT_DIR/provider-refs.txt"
          stage(){ key="$1"; sha="$2"; git worktree add --detach ".providers/$key" "$sha"; printf '%s %s\n' "$key" "$sha" >> "$QA_ARTIFACT_DIR/provider-refs.txt"; }
          stage ws10 "$WS10_PIN"
          stage ws02 "$WS02_PIN"
          stage ws03 "$WS03_PIN"
          stage ws14 "$WS14_PIN"
          stage ws15 "$WS15_PIN"
          stage ws16 "$WS16_PIN"
          stage ws25 "$WS25_PIN"
          stage ws31 "$WS31_PIN"
          python3 - "$QA_ARTIFACT_DIR/ws38-manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          c=m['authority']['canonical_slice']
          assert c['monster_sid']==850 and c['monster_pid']==800
          assert m['authority']['genuine_asset_source']['commit']=='2055ee6ed77f1b5cfef23832dd5bc31909e14a66'
          PY

      - name: Fetch exact Moradon SMD terrain authority
        shell: bash
        run: |
          set -euo pipefail
          SMD="$RUNNER_TEMP/moradon_0826.smd"
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/Open-KO/KnightOnline/7d6cf81093e142c928c2ac9510512b2b182178b5/assets/Server/MAP/moradon_0826.smd' \
            --output "$SMD"
          python3 - "$SMD" <<'PY'
          import hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1]);d=p.read_bytes()
          assert len(d)==786000
          assert hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()=='cf47772b8e42a8bad71032419f47978c8bbd6142'
          PY
          echo "WS14_MORADON_SMD=$SMD" >> "$GITHUB_ENV"

      - name: Verify exact WS25 record contract before native build
        shell: bash
        run: |
          set -euo pipefail
          WS14_ROOT="$GITHUB_WORKSPACE/.providers/ws14" \
          WS16_ROOT="$GITHUB_WORKSPACE/.providers/ws16" \
          WS25_ROOT="$GITHUB_WORKSPACE/.providers/ws25" \
          WS14_MORADON_SMD="$WS14_MORADON_SMD" \
          WS16_NPC_DATA="$GITHUB_WORKSPACE/.providers/ws16/world-data/npc/moradon.json" \
          WS25_MOB_DATA="$GITHUB_WORKSPACE/.providers/ws25/world-data/mobs/verified/moradon-zone21.verified.json" \
          WS05_RECORD_CONTRACT_OUT="$QA_ARTIFACT_DIR/ws25-record-contract.json" \
          node tools/ws05_moradon/verify_ws25_record_contract.cjs | tee "$QA_ARTIFACT_DIR/ws25-record-contract.log"
          python3 - "$QA_ARTIFACT_DIR/ws25-record-contract.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['result']=='PASS'
          assert d['provider_pins']=={
            'ws14':'ed5f806ce7505f4dfae406e4164735def63b6c86',
            'ws16':'5ed48ff32187000312652838674388df52fc3fb7',
            'ws25':'18c9e9b8439fef88fc93d74bfec7981b0cb41958',
            'ws31':'56ada741532c8f6cabfc83b129a8e87e645db055'}
          assert d['counts']['mob']==135 and d['counts']['bandicoot']>0
          assert d['selector']['semantic_contract']=='visibilitySnapshot.detail'
          assert d['selector']['template_id']=='ko1298:monster:850' and d['selector']['pid']==800
          assert d['selector']['pid_exposed_by_ws25'] is True
          assert d['selector']['ws31_pid_mapping_required'] is False
          assert d['selected_bandicoot']['sid']==850 and d['selected_bandicoot']['pid']==800
          assert isinstance(d['selected_bandicoot']['runtimeId'],int)
          for k in ('x','y','z'): assert isinstance(d['selected_bandicoot'][k],(int,float))
          print('WS05_WS25_SCHEMA_GATE PASS')
          PY

      - name: Checkout exact OpenKO and genuine assets
        uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: 97eb0ea20207afc0c360bfed6915113572711be3
          path: openko
          submodules: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: ko4life-net/ko-assets
          ref: 2055ee6ed77f1b5cfef23832dd5bc31909e14a66
          path: ko-assets
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Data
            UI_US
            Snd/Intro_Sound.mp3
            Server.ini
            Chr
            Item
            DTex
            Misc
            Object
            Zones
            fx

      - name: Stage exact Bandicoot files and patch native proof probes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_openko_browser.py
          python3 tools/patch_openko_browser_gateway.py
          python3 tools/fix_browser_server_ini_case.py
          python3 tools/patch_openko_browser_serverlist_probe.py
          python3 tools/patch_openko_browser_auth_probe.py
          python3 tools/ws04_character/patch_character_client.py
          python3 tools/ws04_character/patch_frame_capture.py
          python3 tools/ws05_moradon/patch_moradon_client.py
          python3 .providers/ws10/qa/moradon/patch_visibility_observability.py
          python3 .providers/ws10/qa/moradon/v2/patch_visibility_observability_v2.py
          python3 tools/ws05_moradon/tighten_visibility_v2.py
          python3 tools/ws05_moradon/patch_bandicoot_asset_probe.py
          python3 tools/ws05_moradon/prepare_bandicoot_assets.py \
            --manifest "$QA_ARTIFACT_DIR/ws38-manifest.json" \
            --asset-root ko-assets \
            --stage-root ws05-bandicoot \
            --proof "$QA_ARTIFACT_DIR/bandicoot-asset-stage.json"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('openko/src/Client/WarFare/RHIDeviceGL.cpp');s=p.read_text()
          bad='#version 300 es'+chr(92)+'nprecision highp float;'
          good='#version 300 es'+chr(10)+'precision highp float;'
          if s.count(bad)!=2: raise SystemExit(f'escaped GLSL anchors changed: {s.count(bad)}')
          p.write_text(s.replace(bad,good))
          PY
          grep -q 'WS10_VISIBILITY_V2 HUMAN_VISIBLE' openko/src/Client/WarFare/PlayerBase.cpp
          grep -q 'probe.width >= 24' openko/src/Client/WarFare/PlayerBase.cpp
          grep -q 'WS05_BANDICOOT_ASSET_LOAD pid=800' openko/src/Client/WarFare/PlayerBase.cpp
          grep -q 'ws05-bandicoot/chr@/data/chr' openko/src/Client/WarFare/CMakeLists.txt
          grep -q 'ws05-bandicoot/item@/data/item' openko/src/Client/WarFare/CMakeLists.txt

      - name: Install browser/build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git
          npm install --no-save --no-audit --no-fund playwright@1.55.0 pngjs@7.0.0 ws@8.18.3
          npx playwright install --with-deps chromium

      - name: Setup exact Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache-ws05-visible

      - name: Build real KO1298 browser client with Bandicoot assets
        shell: bash
        run: |
          set -o pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' \
            -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee "$QA_ARTIFACT_DIR/configure.log"
          cmake --build build-web --target WarFare -j2 2>&1 | tee "$QA_ARTIFACT_DIR/build.log"
          OUT=build-web/bin/Release
          test -s "$OUT/KnightOnLine.js"
          test -s "$OUT/KnightOnLine.wasm"
          test -s "$OUT/KnightOnLine.data"
          python3 - "$QA_ARTIFACT_DIR/bandicoot-asset-stage.json" "$OUT/KnightOnLine.js" "$QA_ARTIFACT_DIR/packed-paths.txt" <<'PY'
          import json,pathlib,sys
          proof=json.loads(pathlib.Path(sys.argv[1]).read_text())
          js=pathlib.Path(sys.argv[2]).read_text(errors='replace')
          paths=[e['virtual_path'] for e in proof['entries']]
          missing=[p for p in paths if p not in js]
          if missing: raise SystemExit(f'KnightOnLine.data package metadata missing exact paths: {missing}')
          pathlib.Path(sys.argv[3]).write_text('\n'.join(paths)+'\n')
          print(f'WS05_KNIGHTONLINE_DATA_BANDICOOT PASS paths={len(paths)}')
          PY
          sha256sum "$OUT/KnightOnLine.data" > "$QA_ARTIFACT_DIR/KnightOnLine.data.sha256"

      - name: Run real browser from WS14 spawn to Bandicoot
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build-web/bin/Release"
          cat > "$OUT/ws05-human-visible.html" <<'HTML'
          <!doctype html><html><body style="margin:0;background:#000;overflow:hidden">
          <canvas id="canvas" width="1024" height="768" tabindex="0"></canvas><pre id="status" style="display:none"></pre>
          <script>(()=>{const s=document.getElementById('status');const w=(k,a)=>{const l='['+k+'] '+a.join(' ');s.textContent+=l+'\n';console.log(l)};window.Module={canvas:document.getElementById('canvas'),arguments:['--renderer','gl','--data','/data'],print:(...a)=>w('OUT',a),printErr:(...a)=>w('ERR',a),onRuntimeInitialized:()=>w('SMOKE',['WASM_RUNTIME_READY'])};})();</script>
          <script src="KnightOnLine.js"></script></body></html>
          HTML
          WS03_ROOT="$GITHUB_WORKSPACE/.providers/ws03" \
          WS14_ROOT="$GITHUB_WORKSPACE/.providers/ws14" \
          WS15_ROOT="$GITHUB_WORKSPACE/.providers/ws15" \
          WS16_ROOT="$GITHUB_WORKSPACE/.providers/ws16" \
          WS25_ROOT="$GITHUB_WORKSPACE/.providers/ws25" \
          WS14_MORADON_SMD="$WS14_MORADON_SMD" \
          WS16_NPC_DATA="$GITHUB_WORKSPACE/.providers/ws16/world-data/npc/moradon.json" \
          WS25_MOB_DATA="$GITHUB_WORKSPACE/.providers/ws25/world-data/mobs/verified/moradon-zone21.verified.json" \
          WS05_TEST_ID="$WS05_TEST_ID" WS05_TEST_PW="$WS05_TEST_PW" \
          AUTH_TCP_PORT=16100 GAME_TCP_PORT=16101 \
          node tools/ws05_moradon/integration_server_human_visible.cjs > "$QA_ARTIFACT_DIR/composition-server.log" 2>&1 &
          COMPOSE=$!
          GATEWAY_MODE=auth AUTH_TCP_HOST=127.0.0.1 AUTH_TCP_PORT=16100 LISTEN_HOST=127.0.0.1 PORT=15100 WS_PATH=/ REQUIRE_ORIGIN=false \
            node .providers/ws02/services/ko-gateway/src/server.js > "$QA_ARTIFACT_DIR/gateway-auth.log" 2>&1 & AUTHGW=$!
          GATEWAY_MODE=game GAME_TCP_HOST=127.0.0.1 GAME_TCP_PORT=16101 LISTEN_HOST=127.0.0.1 PORT=15001 WS_PATH=/ REQUIRE_ORIGIN=false \
            node .providers/ws02/services/ko-gateway/src/server.js > "$QA_ARTIFACT_DIR/gateway-game.log" 2>&1 & GAMEGW=$!
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" > "$QA_ARTIFACT_DIR/http.log" 2>&1 & HTTP=$!
          trap 'kill $HTTP $AUTHGW $GAMEGW $COMPOSE 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            grep -q 'WS05_AUTH type=bandicoot id=' "$QA_ARTIFACT_DIR/composition-server.log" && break
            sleep .2
          done
          BANDICOOT_IDS=$(sed -n 's/.*WS05_AUTH type=bandicoot id=\([0-9]*\).*/\1/p' "$QA_ARTIFACT_DIR/composition-server.log" | paste -sd, -)
          NPC_IDS=$(sed -n 's/.*WS05_AUTH type=npc id=\([0-9]*\).*/\1/p' "$QA_ARTIFACT_DIR/composition-server.log" | paste -sd, -)
          test -n "$BANDICOOT_IDS"
          test -n "$NPC_IDS"
          echo "Bandicoot runtime IDs: $BANDICOOT_IDS"
          echo "NPC runtime IDs: $NPC_IDS"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          WS10_REAL_INPUT="$GITHUB_WORKSPACE/.providers/ws10/qa/moradon/v2/real-browser-input.cjs" \
          WS05_BANDICOOT_IDS="$BANDICOOT_IDS" WS05_NPC_IDS="$NPC_IDS" \
          WS05_TEST_ID="$WS05_TEST_ID" WS05_TEST_PW="$WS05_TEST_PW" WS05_CHAR_NAME="$WS05_CHAR_NAME" \
          QA_ARTIFACT_DIR="$QA_ARTIFACT_DIR" CHROME="$CHROME" \
          timeout 600s node tools/ws05_moradon/browser_human_visible_driver.cjs 2>&1 | tee "$QA_ARTIFACT_DIR/driver.log"
          python3 tools/ws05_moradon/build_human_visible_evidence.py \
            --asset-proof "$QA_ARTIFACT_DIR/bandicoot-asset-stage.json" \
            --pack-proof "$QA_ARTIFACT_DIR/packed-paths.txt" \
            --record-contract "$QA_ARTIFACT_DIR/ws25-record-contract.json" \
            --server-log "$QA_ARTIFACT_DIR/composition-server.log" \
            --browser-log "$QA_ARTIFACT_DIR/browser-console.log" \
            --browser-result "$QA_ARTIFACT_DIR/browser-result.json" \
            --screenshot "$QA_ARTIFACT_DIR/ws05-bandicoot-native.png" \
            --output workstreams/ws05/HUMAN_VISIBLE_MORADON_ENTITIES.json \
            --run-id "$GITHUB_RUN_ID"
          cp workstreams/ws05/HUMAN_VISIBLE_MORADON_ENTITIES.json "$QA_ARTIFACT_DIR/HUMAN_VISIBLE_MORADON_ENTITIES.json"
          cat workstreams/ws05/HUMAN_VISIBLE_MORADON_ENTITIES.json

      - name: Persist passing machine-readable evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workstreams/ws05/HUMAN_VISIBLE_MORADON_ENTITIES.json
          if git diff --cached --quiet; then
            echo 'WS05 evidence already matches branch'
          else
            git commit -m 'evidence(ws05): record human-visible Moradon entities [skip ci]'
            git push origin HEAD:ws05-moradon-world
          fi

      - name: Print diagnostic evidence on failure
        if: failure()
        shell: bash
        run: |
          echo '--- WS25 record contract ---'
          cat "$QA_ARTIFACT_DIR/ws25-record-contract.json" 2>/dev/null || true
          echo '--- composition tail ---'
          tail -n 400 "$QA_ARTIFACT_DIR/composition-server.log" 2>/dev/null || true
          echo '--- browser tail ---'
          tail -n 400 "$QA_ARTIFACT_DIR/driver.log" 2>/dev/null || true
          echo '--- build tail ---'
          tail -n 200 "$QA_ARTIFACT_DIR/build.log" 2>/dev/null || true

      - name: Upload exact native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws05-human-visible-moradon-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ws05-human-visible/**
            workstreams/ws05/HUMAN_VISIBLE_MORADON_ENTITIES.json
