name: WS28 GM Command Bus

on:
  push:
    branches: [ws28-gm-command-bus]
    paths:
      - 'services/gm-command-bus/**'
      - 'tests/gm-command-bus/**'
      - 'workstreams/ws28/**'
      - '.github/workflows/ws28-gm-commands.yml'
  pull_request:
    paths:
      - 'services/gm-command-bus/**'
      - 'tests/gm-command-bus/**'
      - 'workstreams/ws28/**'
      - '.github/workflows/ws28-gm-commands.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test command bus
        run: node --test tests/gm-command-bus/*.test.cjs
