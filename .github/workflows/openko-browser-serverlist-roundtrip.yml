name: OpenKO Browser Server List Roundtrip

on:
  workflow_dispatch:
  push:
    branches: [openko-browser-port]
    paths:
      - 'gateway/**'
      - 'tools/patch_openko_browser_gateway.py'
      - 'tools/fix_browser_server_ini_case.py'
      - 'tools/patch_openko_browser_serverlist_probe.py'
      - 'tools/ko_login_stub.mjs'
      - '.github/workflows/openko-browser-serverlist-roundtrip.yml'

permissions:
  contents: read

jobs:
  prove-serverlist-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openko-browser-port

      - uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: feature/port-posix
          path: openko
          submodules: false
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: ko4life-net/ko-assets
          ref: 1298
          path: ko-assets
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Data
            UI_US
            Snd/Intro_Sound.mp3
            Server.ini

      - name: Patch real 1298 browser client and parser probe
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_openko_browser.py
          python3 tools/patch_openko_browser_gateway.py
          python3 tools/fix_browser_server_ini_case.py
          python3 tools/patch_openko_browser_serverlist_probe.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openko/src/Client/WarFare/RHIDeviceGL.cpp')
          s = p.read_text()
          bad = r'#version 300 es\nprecision highp float;'
          good = '#version 300 es\nprecision highp float;'
          count = s.count(bad)
          if count != 2:
              raise SystemExit(f'expected 2 escaped GLSL headers, found {count}')
          p.write_text(s.replace(bad, good))
          PY
          grep -q 'browser server list received:' openko/src/Client/WarFare/GameProcLogIn_1298.cpp
          grep -q 'browser server list entry:' openko/src/Client/WarFare/GameProcLogIn_1298.cpp

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git
          npm install --no-save --no-audit --no-fund ws@8.18.3 playwright-core@1.55.0

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure WASM
        shell: bash
        run: |
          set -euo pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' \
            -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee configure-roundtrip.log

      - name: Build real WarFare WASM
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-web --target WarFare -j2 2>&1 | tee build-roundtrip.log
          test -s build-web/bin/Release/KnightOnLine.js
          test -s build-web/bin/Release/KnightOnLine.wasm
          test -s build-web/bin/Release/KnightOnLine.data

      - name: Prove real client parses OldERA server-list response
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-web/bin/Release
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"

          rm -f ko-stub-result.txt ko-stub.log gateway-roundtrip.log browser-roundtrip.log browser-roundtrip-status.txt
          KO_STUB_PORT=16100 KO_STUB_RESULT=ko-stub-result.txt KO_GAME_SERVER_NAME=OldERA KO_GAME_SERVER_IP=127.0.0.1 KO_GAME_SERVER_USERS=7 \
            node tools/ko_login_stub.mjs >ko-stub.log 2>&1 &
          STUB_PID=$!
          KO_TARGET_HOST=127.0.0.1 KO_TARGET_PORT=16100 OLDERA_GATEWAY_PORT=15100 \
            node gateway/oldera-gateway.mjs >gateway-roundtrip.log 2>&1 &
          GATEWAY_PID=$!
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" >http-roundtrip.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID $GATEWAY_PID $STUB_PID 2>/dev/null || true' EXIT
          sleep 2

          cat > "$OUT/roundtrip.html" <<'EOF'
          <!doctype html><html><body style="margin:0;background:#000">
          <canvas id="canvas" width="1024" height="768"></canvas><pre id="status" style="color:#fff"></pre>
          <script>
          (()=>{
            const status=document.getElementById('status');
            const write=(kind,args)=>{const line='['+kind+'] '+args.join(' ');status.textContent+=line+'\n';console.log(line);};
            window.Module={canvas:document.getElementById('canvas'),arguments:['--renderer','gl','--data','/data'],
              print:(...a)=>write('OUT',a),printErr:(...a)=>write('ERR',a),onRuntimeInitialized:()=>write('SMOKE',['WASM_RUNTIME_READY'])};
          })();
          </script><script src="KnightOnLine.js"></script></body></html>
          EOF

          cat > browser-roundtrip.cjs <<'EOF'
          const fs=require('fs'); const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,
              args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const page=await browser.newPage({viewport:{width:1024,height:768}});
            page.on('console',m=>console.log('[console:'+m.type()+'] '+m.text()));
            page.on('pageerror',e=>console.log('[pageerror] '+e.stack));
            await page.goto('http://127.0.0.1:8000/roundtrip.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>{
              const t=document.getElementById('status')?.textContent||'';
              return t.includes('browser server list received: count=1')
                && t.includes("browser server list entry: name='OldERA' ip='127.0.0.1' users=7");
            },null,{timeout:90000});
            await page.waitForTimeout(1000);
            const t=await page.locator('#status').textContent().catch(()=> '');
            fs.writeFileSync('browser-roundtrip-status.txt',t||'');
            await page.locator('#canvas').screenshot({path:'browser-roundtrip-canvas.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF

          CHROME="$CHROME" timeout 120s node browser-roundtrip.cjs 2>&1 | tee browser-roundtrip.log

          echo '=== CLIENT ==='; tail -n 100 browser-roundtrip.log || true
          echo '=== GATEWAY ==='; cat gateway-roundtrip.log || true
          echo '=== KO LOGIN STUB ==='; cat ko-stub.log || true
          echo '=== STUB RESULT ==='; cat ko-stub-result.txt || true

          grep -q 'SERVERLIST_ROUNDTRIP_READY request=1 response=1 name=OldERA ip=127.0.0.1 users=7' ko-stub-result.txt
          grep -q 'c2s bytes=7 hex=aa550100f555aa' gateway-roundtrip.log
          grep -q 's2c bytes=' gateway-roundtrip.log
          grep -q 'browser server list received: count=1' browser-roundtrip-status.txt
          grep -q "browser server list entry: name='OldERA' ip='127.0.0.1' users=7" browser-roundtrip-status.txt
          if grep -Eq '\[pageerror\]|GL_INVALID_(ENUM|VALUE|OPERATION)|WebGL: INVALID_|WebGL: too many errors' browser-roundtrip.log; then
            echo 'Browser/WebGL error detected' >&2; exit 1
          fi
          echo 'SERVERLIST_ROUNDTRIP_OK real 1298 client parsed OldERA from TCP -> gateway -> WebSocket'

      - name: Upload roundtrip proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openko-browser-serverlist-roundtrip
          path: |
            configure-roundtrip.log
            build-roundtrip.log
            browser-roundtrip.log
            browser-roundtrip-status.txt
            browser-roundtrip-canvas.png
            gateway-roundtrip.log
            ko-stub.log
            ko-stub-result.txt
            http-roundtrip.log
          if-no-files-found: warn
