name: WS22 Economy

on:
  push:
    branches:
      - ws22-merchant-economy
    paths:
      - 'services/ko1298-economy/**'
      - 'tests/ko1298-economy/**'
      - 'workstreams/ws22/**'
      - '.github/workflows/ws22-economy.yml'
  pull_request:
    paths:
      - 'services/ko1298-economy/**'
      - 'tests/ko1298-economy/**'
      - 'workstreams/ws22/**'
      - '.github/workflows/ws22-economy.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: npm --prefix services/ko1298-economy run check
      - name: Economy tests
        run: node --test tests/ko1298-economy/*.test.cjs
