name: WS04 Character Client

on:
  push:
    branches: [ws04-character-client]
    paths:
      - 'tools/ws04_character/**'
      - 'workstreams/ws04/**'
      - '.github/workflows/ws04-character.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-client-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout WS04 control branch
        uses: actions/checkout@v4
        with:
          ref: ws04-character-client
          fetch-depth: 1

      - name: Checkout OpenKO POSIX client
        uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: feature/port-posix
          path: openko
          submodules: false
          fetch-depth: 1

      - name: Checkout genuine KO 1298 assets
        uses: actions/checkout@v4
        with:
          repository: ko4life-net/ko-assets
          ref: 1298
          path: ko-assets
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Data
            UI_US
            Snd/Intro_Sound.mp3
            Server.ini

      - name: Patch real browser client then apply WS04-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_openko_browser.py
          python3 tools/patch_openko_browser_gateway.py
          python3 tools/fix_browser_server_ini_case.py
          python3 tools/patch_openko_browser_serverlist_probe.py
          python3 tools/patch_openko_browser_auth_probe.py
          python3 tools/ws04_character/patch_character_client.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openko/src/Client/WarFare/RHIDeviceGL.cpp')
          s = p.read_text()
          bad = r'#version 300 es\nprecision highp float;'
          good = '#version 300 es\nprecision highp float;'
          count = s.count(bad)
          if count != 2:
              raise SystemExit(f'escaped GLSL browser shader anchors changed: {count}')
          p.write_text(s.replace(bad, good))
          print('Corrected both GLSL ES 300 shader headers')
          PY
          test -n "$(find ko-assets/Chr -type f -print -quit)"
          grep -q 'ko-assets/Chr@/data/Chr' openko/src/Client/WarFare/CMakeLists.txt
          grep -q 'WS04_CHAR_LIST parsed' openko/src/Client/WarFare/GameProcCharacterSelect.cpp
          grep -q 'WS04_CHAR_CREATE_SENT' openko/src/Client/WarFare/GameProcCharacterCreate.cpp

      - name: Install build and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git
          npm install --no-save --no-audit --no-fund ws@8.18.3 playwright-core@1.55.0 pngjs@7.0.0

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure real WarFare browser client
        shell: bash
        run: |
          set -o pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' \
            -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee ws04-configure.log

      - name: Build real WarFare WASM client
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-web --target WarFare -j2 2>&1 | tee ws04-build.log
          test -s build-web/bin/Release/KnightOnLine.js
          test -s build-web/bin/Release/KnightOnLine.wasm
          test -s build-web/bin/Release/KnightOnLine.data

      - name: Run Nation to Character Select/Create real-client gate
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-web/bin/Release
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "Runtime browser: $($CHROME --version)"

          TEST_ID="ws04${GITHUB_RUN_NUMBER}"
          TEST_PW="p${GITHUB_RUN_NUMBER}x7"
          CHAR_NAME="Ws04${GITHUB_RUN_NUMBER}"
          export TEST_ID TEST_PW CHAR_NAME

          rm -f ws04-*.log ws04-*.txt ws04-*.png ko-auth-result.txt ko-game-result.txt

          KO_STUB_PORT=16100 KO_AUTH_RESULT=ko-auth-result.txt KO_TEST_ID="$TEST_ID" KO_TEST_PW="$TEST_PW" \
            node tools/ko_auth_stub.mjs >ws04-auth-stub.log 2>&1 &
          AUTH_STUB_PID=$!

          KO_GAME_STUB_PORT=16101 KO_GAME_RESULT=ko-game-result.txt KO_TEST_ID="$TEST_ID" KO_TEST_PW="$TEST_PW" KO_EXPECTED_VERSION=1298 \
            node tools/ko_game_stub.mjs >ws04-game-stub.log 2>&1 &
          GAME_STUB_PID=$!

          KO_TARGET_HOST=127.0.0.1 KO_TARGET_PORT=16100 OLDERA_GATEWAY_PORT=15100 \
            node gateway/oldera-gateway.mjs >ws04-gateway-auth.log 2>&1 &
          AUTH_GATEWAY_PID=$!

          KO_TARGET_HOST=127.0.0.1 KO_TARGET_PORT=16101 OLDERA_GATEWAY_PORT=15001 \
            node gateway/oldera-gateway.mjs >ws04-gateway-game.log 2>&1 &
          GAME_GATEWAY_PID=$!

          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" >ws04-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID $AUTH_GATEWAY_PID $GAME_GATEWAY_PID $AUTH_STUB_PID $GAME_STUB_PID 2>/dev/null || true' EXIT
          sleep 2

          cat > "$OUT/ws04.html" <<'EOF'
          <!doctype html><html><body style="margin:0;background:#000;overflow:hidden">
          <canvas id="canvas" width="1024" height="768" tabindex="0"></canvas>
          <pre id="status" style="display:none"></pre>
          <script>
          (()=>{
            const status=document.getElementById('status');
            const write=(kind,args)=>{const line='['+kind+'] '+args.join(' ');status.textContent+=line+'\n';console.log(line);};
            window.Module={canvas:document.getElementById('canvas'),arguments:['--renderer','gl','--data','/data'],
              print:(...a)=>write('OUT',a),printErr:(...a)=>write('ERR',a),onRuntimeInitialized:()=>write('SMOKE',['WASM_RUNTIME_READY'])};
          })();
          </script><script src="KnightOnLine.js"></script></body></html>
          EOF

          CHROME="$CHROME" TEST_ID="$TEST_ID" TEST_PW="$TEST_PW" CHAR_NAME="$CHAR_NAME" \
            timeout 170s node tools/ws04_character/browser_character_driver.cjs 2>&1 | tee ws04-browser.log

          echo '=== CLIENT TAIL ==='; tail -n 220 ws04-browser.log || true
          echo '=== GAME STUB ==='; cat ws04-game-stub.log || true
          echo '=== GAME RESULT ==='; cat ko-game-result.txt || true

          # Console gates: prove the real parser/procedure/send path, not merely survival.
          grep -q 'NATION_TO_CHAR_SELECT_OK' ws04-browser.log
          grep -q 'CHAR_LIST_PARSE_OK slots=3 occupied=0' ws04-browser.log
          grep -q 'CHARACTER_SELECT_VISUAL_OK' ws04-browser.log
          grep -q 'EMPTY_SLOT_TO_CREATE_OK' ws04-browser.log
          grep -q 'CHARACTER_CREATE_VISUAL_OK' ws04-browser.log
          grep -q 'CREATE_MODEL_VISUAL_OK' ws04-browser.log
          grep -q "CHAR_CREATE_PACKET_OK name=$CHAR_NAME" ws04-browser.log
          grep -q 'WS04_CHAR_LIST parsed result=1 slots=3 occupied=0' ws04-browser-status.txt
          grep -q 'WS04_CHAR_CREATE_UI' ws04-browser-status.txt
          grep -q 'WS04_CHAR_CREATE_SENT opcode=0x02' ws04-browser-status.txt

          # Transport-side evidence that the actual 1298 client emitted WIZ_NEW_CHAR.
          grep -q 'opcode=0x02' ws04-game-stub.log
          grep -q 'allCharReq=1 allCharResp=1 emptySlots=3' ko-game-result.txt

          if grep -Eq '\[pageerror\]|GL_INVALID_(ENUM|VALUE|OPERATION)|WebGL: INVALID_|WebGL: too many errors' ws04-browser.log; then
            echo 'Browser/WebGL error detected' >&2
            exit 1
          fi
          if grep -q 'render backend: Null' ws04-browser-status.txt; then
            echo 'Browser fell back to Null renderer' >&2
            exit 1
          fi

          {
            echo 'WS04_CLIENT_GATE=PASS'
            echo 'NATION_TO_CHAR_SELECT=PASS'
            echo 'CHAR_LIST_PARSE=PASS'
            echo 'CHAR_CREATE_UI=PASS'
            echo 'CHAR_CREATE_MODEL=PASS'
            echo 'CHAR_CREATE_PACKET=PASS'
            if grep -q 'CHAR_CREATE_RESPONSE_OK' ws04-browser.log; then
              echo 'CHAR_CREATE_RESPONSE=PASS'
              echo 'CHAR_CREATE_SLOT_REFRESH=PASS'
            else
              echo 'CHAR_CREATE_RESPONSE=BLOCKED_SERVER_CONTRACT'
              echo 'CHAR_CREATE_SLOT_REFRESH=BLOCKED_SERVER_CONTRACT'
            fi
            if grep -q 'CHAR_SELECT_PACKET_OK' ws04-browser.log; then
              echo 'CHAR_SELECT_PACKET=PASS'
            else
              echo 'CHAR_SELECT_PACKET=BLOCKED_UNTIL_CREATE_REFRESH'
            fi
            if grep -q 'CHAR_SELECT_RESPONSE_OK' ws04-browser.log; then
              echo 'CHAR_SELECT_RESPONSE=PASS'
              echo 'FAILING_GATE=NONE'
            else
              echo 'CHAR_SELECT_RESPONSE=BLOCKED_SERVER_CONTRACT'
              echo 'FAILING_GATE=runtime WIZ_NEW_CHAR success/list refresh and WIZ_SEL_CHAR response require the 1298 session server; WS04 does not implement server logic'
            fi
          } | tee ws04-gate.txt

      - name: Upload WS04 visual and console proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws04-character-client-proof
          path: |
            ws04-gate.txt
            ws04-browser.log
            ws04-browser-status.txt
            ws04-nation.png
            ws04-character-select.png
            ws04-character-create.png
            ws04-create-ready.png
            ws04-character-slot-refresh.png
            ws04-auth-stub.log
            ws04-game-stub.log
            ws04-gateway-auth.log
            ws04-gateway-game.log
            ko-auth-result.txt
            ko-game-result.txt
            ws04-configure.log
            ws04-build.log
          if-no-files-found: warn
