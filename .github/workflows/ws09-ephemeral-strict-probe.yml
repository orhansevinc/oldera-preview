name: WS09 Ephemeral Strict Probe

on:
  push:
    branches: [ws09-production-infra]
    paths:
      - '.github/workflows/ws09-ephemeral-strict-probe.yml'

permissions:
  contents: read

jobs:
  strict-public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_ORIGIN: https://potential-equally-dame-higher.trycloudflare.com
    steps:
      - name: DATA range and KO credential-free handshakes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PUBLIC_ORIGIN/healthz" >/dev/null
          curl -fsS "$PUBLIC_ORIGIN/play-shell/" >/dev/null
          curl -fsS "$PUBLIC_ORIGIN/latest.json" -o /tmp/latest.json
          MANIFEST_PATH=$(jq -er '.manifestPath' /tmp/latest.json)
          curl -fsS "$PUBLIC_ORIGIN/$MANIFEST_PATH" -o /tmp/manifest.json
          BASE_PATH=$(jq -er '.immutableBasePath' /tmp/manifest.json)
          DATA_PATH=$(jq -er '.files[] | select(.path == "KnightOnLine.data" and .required == true) | .path' /tmp/manifest.json)
          curl -fsS -D /tmp/range.headers -o /tmp/range.body -H 'Range: bytes=0-1023' "$PUBLIC_ORIGIN${BASE_PATH}${DATA_PATH}"
          grep -Eiq '^HTTP/[0-9.]+ 206([[:space:]]|$)' /tmp/range.headers
          grep -Eiq '^content-range:[[:space:]]*bytes[[:space:]]+0-1023/' /tmp/range.headers
          test "$(wc -c < /tmp/range.body)" -eq 1024
          echo 'DATA_RANGE=PASS status=206 bytes=0-1023'

          node <<'NODE'
          const tls = require('node:tls');
          const crypto = require('node:crypto');
          const origin = new URL(process.env.PUBLIC_ORIGIN);

          function wsFrame(payload) {
            if (payload.length >= 126) throw new Error('probe payload unexpectedly large');
            const mask = crypto.randomBytes(4);
            const header = Buffer.from([0x82, 0x80 | payload.length]);
            const body = Buffer.alloc(payload.length);
            for (let i = 0; i < payload.length; i++) body[i] = payload[i] ^ mask[i & 3];
            return Buffer.concat([header, mask, body]);
          }

          function extractFrames(buffer) {
            const frames = [];
            let off = 0;
            while (buffer.length - off >= 2) {
              const b0 = buffer[off], b1 = buffer[off + 1];
              let len = b1 & 0x7f, pos = off + 2;
              if (len === 126) {
                if (buffer.length - pos < 2) break;
                len = buffer.readUInt16BE(pos); pos += 2;
              } else if (len === 127) {
                if (buffer.length - pos < 8) break;
                const big = buffer.readBigUInt64BE(pos); pos += 8;
                if (big > BigInt(Number.MAX_SAFE_INTEGER)) throw new Error('oversized WS frame');
                len = Number(big);
              }
              const masked = !!(b1 & 0x80);
              let mask;
              if (masked) {
                if (buffer.length - pos < 4) break;
                mask = buffer.subarray(pos, pos + 4); pos += 4;
              }
              if (buffer.length - pos < len) break;
              let payload = Buffer.from(buffer.subarray(pos, pos + len));
              if (masked) for (let i = 0; i < payload.length; i++) payload[i] ^= mask[i & 3];
              frames.push({ opcode: b0 & 0x0f, payload });
              off = pos + len;
            }
            return { frames, rest: buffer.subarray(off) };
          }

          function koPayloadFromStream(buf) {
            for (let i = 0; i + 7 <= buf.length; i++) {
              if (buf[i] !== 0xaa || buf[i + 1] !== 0x55) continue;
              const n = buf.readUInt16LE(i + 2);
              const end = i + 4 + n;
              if (end + 2 > buf.length) continue;
              if (buf[end] !== 0x55 || buf[end + 1] !== 0xaa) continue;
              return buf.subarray(i + 4, end);
            }
            return null;
          }

          function probe(path, koRequest, validate, label) {
            return new Promise((resolve, reject) => {
              const key = crypto.randomBytes(16).toString('base64');
              const socket = tls.connect({host: origin.hostname, port: 443, servername: origin.hostname});
              let raw = Buffer.alloc(0), upgraded = false, wsbuf = Buffer.alloc(0), app = Buffer.alloc(0);
              const timer = setTimeout(() => fail(new Error(`${label} timeout`)), 15000);
              function fail(err) { clearTimeout(timer); socket.destroy(); reject(err); }
              socket.once('error', fail);
              socket.once('secureConnect', () => {
                socket.write([
                  `GET ${path} HTTP/1.1`,
                  `Host: ${origin.host}`,
                  'Connection: Upgrade',
                  'Upgrade: websocket',
                  'Sec-WebSocket-Version: 13',
                  `Sec-WebSocket-Key: ${key}`,
                  `Origin: ${origin.origin}`,
                  '', ''
                ].join('\r\n'));
              });
              socket.on('data', chunk => {
                try {
                  if (!upgraded) {
                    raw = Buffer.concat([raw, chunk]);
                    const marker = raw.indexOf('\r\n\r\n');
                    if (marker < 0) return;
                    const head = raw.subarray(0, marker).toString('utf8');
                    if (!/^HTTP\/1\.[01] 101\b/m.test(head)) throw new Error(`${label} upgrade failed: ${head.split('\r\n')[0]}`);
                    upgraded = true;
                    wsbuf = raw.subarray(marker + 4);
                    raw = Buffer.alloc(0);
                    socket.write(wsFrame(koRequest));
                  } else {
                    wsbuf = Buffer.concat([wsbuf, chunk]);
                  }
                  const parsed = extractFrames(wsbuf); wsbuf = parsed.rest;
                  for (const f of parsed.frames) {
                    if (f.opcode === 0x8) throw new Error(`${label} closed before KO response`);
                    if (f.opcode !== 0x2 && f.opcode !== 0x0) continue;
                    app = Buffer.concat([app, f.payload]);
                    const payload = koPayloadFromStream(app);
                    if (!payload) continue;
                    validate(payload);
                    clearTimeout(timer); socket.destroy(); resolve(); return;
                  }
                } catch (e) { fail(e); }
              });
            });
          }

          const authReq = Buffer.from('aa550100f555aa', 'hex');
          const gameReq = Buffer.from('aa5501002b55aa', 'hex');
          Promise.all([
            probe('/auth', authReq, p => {
              if (p[0] !== 0xf5) throw new Error(`SERVER_LIST opcode=${p[0]}`);
              if (p.length < 2 || p[1] < 1) throw new Error('SERVER_LIST returned no server');
            }, 'AUTH_SERVER_LIST'),
            probe('/game', gameReq, p => {
              if (p[0] !== 0x2b) throw new Error(`VERSION_CHECK opcode=${p[0]}`);
              if (p.length < 3 || p.readInt16LE(1) !== 1298) throw new Error(`VERSION_CHECK version=${p.length >= 3 ? p.readInt16LE(1) : 'short'}`);
            }, 'GAME_VERSION_CHECK')
          ]).then(() => {
            console.log('AUTH_SERVER_LIST=PASS');
            console.log('GAME_VERSION_CHECK=PASS version=1298');
          }).catch(err => { console.error(err); process.exit(1); });
          NODE
