name: WS49 Deterministic Gameplay Scenarios

on:
  workflow_dispatch:
  push:
    branches: [ws49-test-scenarios]
    paths:
      - "test-scenarios/**"
      - "packages/oldko-test-fixtures/**"
      - "tests/test-fixtures/**"
      - "workstreams/ws49/**"
      - ".github/workflows/ws49-fixtures.yml"
  pull_request:
    paths:
      - "test-scenarios/**"
      - "packages/oldko-test-fixtures/**"
      - "tests/test-fixtures/**"
      - "workstreams/ws49/**"
      - ".github/workflows/ws49-fixtures.yml"

permissions:
  contents: read

jobs:
  deterministic-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate deterministic fixture standard
        env:
          NODE_ENV: test
        run: node --test tests/test-fixtures/*.test.mjs
      - name: Stage exact provider HEADs
        run: node test-scenarios/gameplay/prepare-current-providers.mjs "$RUNNER_TEMP/ws49-providers"
      - name: Run deterministic gameplay scenarios
        run: |
          node test-scenarios/gameplay/run-gameplay-scenarios.mjs \
            --provider-root "$RUNNER_TEMP/ws49-providers" \
            --output artifacts/ws49
      - name: Reconcile current provider capabilities
        run: |
          node test-scenarios/gameplay/reconcile-current-results.mjs \
            --provider-root "$RUNNER_TEMP/ws49-providers" \
            --output artifacts/ws49
      - name: Publish human-readable summary
        if: always()
        run: |
          if [ -f artifacts/ws49/integration-report.md ]; then
            cat artifacts/ws49/integration-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload WS49 integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws49-integration-report
          path: artifacts/ws49/
          if-no-files-found: error
          retention-days: 14
