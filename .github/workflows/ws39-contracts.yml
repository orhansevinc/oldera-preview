name: WS39 Contract Compatibility

on:
  push:
    paths:
      - 'contracts/**'
      - 'contract-tests/**'
      - 'tools/ws39_contracts/**'
      - 'coordination/handoffs/domain-live/WS39.json'
      - 'release/sets/ws50/**'
      - 'workstreams/ws39/**'
      - '.github/workflows/ws39-contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'contract-tests/**'
      - 'tools/ws39_contracts/**'
      - 'coordination/handoffs/domain-live/WS39.json'
      - 'release/sets/ws50/**'
      - 'workstreams/ws39/**'
      - '.github/workflows/ws39-contracts.yml'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate WS39 C3 pilot and domain-live generic contract gate
        run: node --test contract-tests/*.test.cjs
