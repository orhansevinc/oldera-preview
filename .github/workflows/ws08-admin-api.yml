name: WS08 Admin API

on:
  push:
    branches: [ws08-admin-api]
    paths:
      - 'services/admin-api/**'
      - 'tests/admin-api/**'
      - 'workstreams/ws08/**'
      - '.github/workflows/ws08-admin-api.yml'
  pull_request:
    paths:
      - 'services/admin-api/**'
      - 'tests/admin-api/**'
      - 'workstreams/ws08/**'
      - '.github/workflows/ws08-admin-api.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test admin API
        working-directory: services/admin-api
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../../ws08-test-output.txt
      - name: Retain test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws08-test-output-${{ github.run_id }}
          path: ws08-test-output.txt
          retention-days: 3
