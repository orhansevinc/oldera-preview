name: WS03 KO1298 Session
on:
  push:
    branches: [ws03-ko1298-session]
    paths: ['services/ko1298-session/**','services/oldko-data/**','database/**','protocol-lab/runtime/playable-combat-codec.cjs','tests/ko1298-session/**','workstreams/ws03/**','.github/workflows/ws03-session.yml']
  pull_request:
    paths: ['services/ko1298-session/**','services/oldko-data/**','database/**','protocol-lab/runtime/playable-combat-codec.cjs','tests/ko1298-session/**','workstreams/ws03/**','.github/workflows/ws03-session.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Syntax check
        run: find services/ko1298-session tests/ko1298-session -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: WS03 regression and production-session suite
        run: npm test
        working-directory: services/ko1298-session

  composed-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Load immutable task-pinned provider set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ws03
          node <<'NODE'
          const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('workstreams/ws03/DEPENDENCY_MANIFEST.json','utf8'));
          const expected={WS11:'013559b6e66ef9f6257403c96f3b012884739470',WS14:'ed5f806ce7505f4dfae406e4164735def63b6c86',WS15:'ce9bed13b8d45c32ff0592595aa3a0d1e7b3964d',WS17:'eb3e9fce63b71fa68682d81d9227e6ed7ae905bf',WS19:'cc1490672b676f0bf1675f83c8f4fc146b940df4',WS25:'18c9e9b8439fef88fc93d74bfec7981b0cb41958',WS31:'56ada741532c8f6cabfc83b129a8e87e645db055'};
          if(m.strategy!=='task-pinned-provider-shas-no-silent-upgrade')throw new Error(`unexpected strategy ${m.strategy}`);
          for(const [id,sha] of Object.entries(expected))if(m.providers?.[id]?.pinnedSha!==sha)throw new Error(`${id} pin mismatch`);
          const providers={};for(const [id,row] of Object.entries(m.providers)){if(!/^[0-9a-f]{40}$/.test(row.pinnedSha||''))throw new Error(`${id} missing exact SHA`);providers[id]={branch:row.branch,servicePath:row.servicePath,sha:row.pinnedSha};}
          fs.writeFileSync('artifacts/ws03/resolved-providers.json',JSON.stringify({schemaVersion:3,workstream:'WS03',strategy:m.strategy,run:{repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,runNumber:process.env.GITHUB_RUN_NUMBER,ws03Sha:process.env.GITHUB_SHA},providers},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_ENV,Object.entries(providers).map(([id,r])=>`${id}_SHA=${r.sha}`).join('\n')+'\n');
          NODE
          cat artifacts/ws03/resolved-providers.json
      - name: Fetch provider objects without resolving newer heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1000 origin \
            +refs/heads/ws11-protocol-lab:refs/remotes/origin/ws11-protocol-lab \
            +refs/heads/ws14-world-session:refs/remotes/origin/ws14-world-session \
            +refs/heads/ws15-movement-sync:refs/remotes/origin/ws15-movement-sync \
            +refs/heads/ws16-npc-world:refs/remotes/origin/ws16-npc-world \
            +refs/heads/ws17-item-inventory:refs/remotes/origin/ws17-item-inventory \
            +refs/heads/ws19-combat-core:refs/remotes/origin/ws19-combat-core \
            +refs/heads/ws25-mob-ai:refs/remotes/origin/ws25-mob-ai \
            +refs/heads/ws31-data-catalog:refs/remotes/origin/ws31-data-catalog \
            +refs/heads/ws45-session-ownership:refs/remotes/origin/ws45-session-ownership
          for sha in "$WS11_SHA" "$WS14_SHA" "$WS15_SHA" "$WS16_SHA" "$WS17_SHA" "$WS19_SHA" "$WS25_SHA" "$WS31_SHA" "$WS45_SHA"; do git cat-file -e "$sha^{commit}"; done
      - name: Materialize exact pinned provider services read-only
        shell: bash
        run: |
          set -euo pipefail
          git archive "$WS11_SHA" protocol-lab/PLAYABLE_COMBAT_PROTOCOL_PROFILE.json protocol-lab/runtime/playable-combat-codec.cjs | tar -x
          git archive "$WS14_SHA" services/ko1298-world | tar -x
          git archive "$WS15_SHA" services/ko1298-movement | tar -x
          git archive "$WS16_SHA" services/ko1298-npc | tar -x
          git archive "$WS17_SHA" services/ko1298-items workstreams/ws17/PLAYABLE_COMBAT_EQUIPMENT_CONTRACT.json | tar -x
          git archive "$WS19_SHA" services/ko1298-combat workstreams/ws19/PLAYABLE_PVE_AUTHORITY.json | tar -x
          git archive "$WS25_SHA" services/ko1298-mobs world-data/mobs | tar -x
          git archive "$WS31_SHA" data-catalog/generated/MORADON_PLAYABLE_COMBAT_SLICE.json | tar -x
          git archive "$WS45_SHA" services/session-ownership | tar -x
          chmod -R a-w protocol-lab services/ko1298-world services/ko1298-movement services/ko1298-npc services/ko1298-items services/ko1298-combat services/ko1298-mobs world-data/mobs workstreams/ws17/PLAYABLE_COMBAT_EQUIPMENT_CONTRACT.json workstreams/ws19/PLAYABLE_PVE_AUTHORITY.json data-catalog/generated/MORADON_PLAYABLE_COMBAT_SLICE.json services/session-ownership
      - name: Existing world movement NPC ownership composition
        run: node --test tests/ko1298-session/composed-contracts.contract.js
      - name: Playable combat pinned-provider composition
        run: node --test tests/ko1298-session/combat-composition.contract.js
      - name: Upload immutable dependency report
        if: ${{ always() && hashFiles('artifacts/ws03/resolved-providers.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ws03-resolved-providers-${{ github.run_number }}
          path: artifacts/ws03/resolved-providers.json
          if-no-files-found: error
          retention-days: 14

  postgres-one-db-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oldko
          POSTGRES_PASSWORD: oldko_ci_only
          POSTGRES_DB: oldko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oldko -d oldko"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://oldko:oldko_ci_only@127.0.0.1:5432/oldko
      WS07_SHA: 1ae85c96319cbab11648a91ed28300e17d4c607f
      WS13_SHA: 5777c865274cba26ca35a5e74bd13cb08530c5eb
      WS14_SHA: ed5f806ce7505f4dfae406e4164735def63b6c86
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact persistent/account/world provider pins
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1000 origin \
            +refs/heads/ws07-database:refs/remotes/origin/ws07-database \
            +refs/heads/ws13-account-api:refs/remotes/origin/ws13-account-api \
            +refs/heads/ws14-world-session:refs/remotes/origin/ws14-world-session
          for sha in "$WS07_SHA" "$WS13_SHA" "$WS14_SHA"; do git cat-file -e "$sha^{commit}"; done
          test "$(git rev-parse "$WS07_SHA^{tree}:services/oldko-data")" = "$(git rev-parse HEAD^{tree}:services/oldko-data)"
          test "$(git rev-parse "$WS07_SHA^{tree}:database")" = "$(git rev-parse HEAD^{tree}:database)"
          git archive "$WS13_SHA" services/account-api | tar -x
          git archive "$WS14_SHA" services/ko1298-world | tar -x
      - name: Install WS07 PostgreSQL driver
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: services/oldko-data
      - name: Apply existing migrations in canonical order
        run: npm run migrate
        working-directory: services/oldko-data
      - name: Website account to KO1298 one-database E2E
        run: node --test tests/ko1298-session/postgres-composition.test.mjs
