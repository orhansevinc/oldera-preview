name: WS42 Browser Audio

on:
  push:
    branches:
      - ws42-browser-audio
  pull_request:
    paths:
      - 'tools/ws42_audio/**'
      - 'tests/browser-audio/**'
      - 'workstreams/ws42/**'
      - '.github/workflows/ws42-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run WS42 tests
        run: node --test tests/browser-audio/*.test.mjs

      - name: Scan generated browser bundle
        run: node tools/ws42_audio/scan_browser_bundle.mjs openko-web/KnightOnLine.js openko-web/KnightOnLine.html
