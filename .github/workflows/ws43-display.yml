name: WS43 Display Compatibility

on:
  push:
    branches:
      - ws43-client-display-compat
    paths:
      - 'tools/ws43_display/**'
      - 'tests/display-compat/**'
      - 'workstreams/ws43/**'
      - '.github/workflows/ws43-display.yml'
  pull_request:
    paths:
      - 'tools/ws43_display/**'
      - 'tests/display-compat/**'
      - 'workstreams/ws43/**'
      - '.github/workflows/ws43-display.yml'
  workflow_dispatch:

jobs:
  display-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit geometry checks
        run: node --test tests/display-compat/geometry.test.cjs

      - name: Install Playwright test dependency
        working-directory: tests/display-compat
        run: npm install --no-package-lock

      - name: Install Chromium
        working-directory: tests/display-compat
        run: npx playwright install --with-deps chromium

      - name: Real-client browser display checks
        working-directory: tests/display-compat
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload WS43 screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws43-display-artifacts
          path: tests/display-compat/artifacts
          if-no-files-found: warn
