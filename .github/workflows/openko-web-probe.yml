name: OpenKO Web Port Probe

on:
  push:
    branches: [openko-web-port]
    paths:
      - '.github/workflows/openko-web-probe.yml'
      - 'webport/**'
  workflow_dispatch:

jobs:
  emscripten-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout OldERA orchestration repo
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git python3 pkg-config

      - name: Checkout OpenKO POSIX port
        run: |
          git clone --depth 1 --branch feature/port-posix https://github.com/luisfelipe18/old-school-openko.git openko
          git -C openko rev-parse HEAD | tee openko-source-sha.txt

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest

      - name: Configure OpenKO for WebAssembly
        id: configure
        shell: bash
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version | tee emscripten-version.txt
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee configure-web.log

      - name: Build WarFare browser target
        if: steps.configure.outcome == 'success'
        id: build
        shell: bash
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build build-web --target WarFare -j2 2>&1 | tee build-web.log

      - name: Collect probe report
        if: always()
        shell: bash
        run: |
          mkdir -p probe-report
          cp -f configure-web.log probe-report/ 2>/dev/null || true
          cp -f build-web.log probe-report/ 2>/dev/null || true
          cp -f emscripten-version.txt probe-report/ 2>/dev/null || true
          cp -f openko-source-sha.txt probe-report/ 2>/dev/null || true
          if [ -d build-web ]; then
            find build-web -maxdepth 4 -type f \( -name '*.html' -o -name '*.js' -o -name '*.wasm' \) -print > probe-report/web-outputs.txt || true
          fi

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openko-web-probe-report
          path: probe-report
          if-no-files-found: warn
