name: WS45 Session Ownership

on:
  push:
    branches:
      - ws45-session-ownership
    paths:
      - 'services/session-ownership/**'
      - 'tests/session-ownership/**'
      - 'workstreams/ws45/**'
      - '.github/workflows/ws45-sessions.yml'
  pull_request:
    paths:
      - 'services/session-ownership/**'
      - 'tests/session-ownership/**'
      - 'workstreams/ws45/**'
      - '.github/workflows/ws45-sessions.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run session ownership tests
        run: node --test tests/session-ownership/*.test.js
