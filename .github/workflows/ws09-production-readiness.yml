name: WS09 production readiness

on:
  push:
    branches: [ws09-production-infra]
    paths:
      - 'docker-compose.ws09.yml'
      - 'infra/nginx/**'
      - 'deploy/.env.production.example'
      - 'deploy/RELEASE.ws50-c5-ws10-38604174659.env'
      - 'deploy/production-account-api.Dockerfile'
      - 'deploy/migrate-production-db.sh'
      - 'deploy/ko-auth-roundtrip-smoke.mjs'
      - 'deploy/production-smoke.sh'
      - 'deploy/release-switch.sh'
      - 'deploy/rollback-static.sh'
      - 'deploy/validate-production-env.sh'
      - 'workstreams/ws09/**'
      - '.github/workflows/ws09-production-readiness.yml'
      - '.github/workflows/ws09-permanent-release-bundle.yml'
  pull_request:
    paths:
      - 'docker-compose.ws09.yml'
      - 'infra/nginx/**'
      - 'deploy/.env.production.example'
      - 'deploy/RELEASE.ws50-c5-ws10-38604174659.env'
      - 'deploy/production-account-api.Dockerfile'
      - 'deploy/migrate-production-db.sh'
      - 'deploy/ko-auth-roundtrip-smoke.mjs'
      - 'deploy/production-smoke.sh'
      - 'deploy/release-switch.sh'
      - 'deploy/rollback-static.sh'
      - 'deploy/validate-production-env.sh'
      - 'workstreams/ws09/**'
      - '.github/workflows/ws09-production-readiness.yml'
      - '.github/workflows/ws09-permanent-release-bundle.yml'

permissions:
  contents: read

jobs:
  production-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax, JSON and secret-policy checks
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/ko-auth-roundtrip-smoke.mjs
          sh -n deploy/production-smoke.sh
          sh -n deploy/release-switch.sh
          sh -n deploy/rollback-static.sh
          sh -n deploy/validate-production-env.sh
          if test -f deploy/migrate-production-db.sh; then sh -n deploy/migrate-production-db.sh; fi
          python3 -m json.tool workstreams/ws09/DOMAIN_DEPLOYMENT.json >/dev/null
          python3 -m json.tool workstreams/ws09/DOMAIN_RELEASE_REQUESTS.json >/dev/null
          if test -f coordination/handoffs/domain-live/WS09.json; then python3 -m json.tool coordination/handoffs/domain-live/WS09.json >/dev/null; fi
          ! grep -RIE --exclude='*.md' --exclude='*.example' '(password|token|secret)[=:][^$<{ ]{6,}' deploy workstreams/ws09 coordination/handoffs/domain-live 2>/dev/null || {
            echo 'possible literal secret detected in WS09 production surfaces' >&2
            exit 1
          }

      - name: Exact C5 permanent release identity contract
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=deploy/RELEASE.ws50-c5-ws10-38604174659.env
          grep -Fqx 'FINAL_PROVIDER_SET=WS50-C5@sha256:7ac3b8a4c06b67e52b8d18518ef8c82209a60c6101c33609a4c16e64d84f119e' "$RELEASE"
          grep -Fqx 'WS50_MANIFEST_COMMIT=0d5001095fa3b43693b4fa0cda615f84e2cb7df5' "$RELEASE"
          grep -Fqx 'WS50_HANDOFF_REF=7497087d4cf67e4e05a3a090f6edad3d206078cb' "$RELEASE"
          grep -Fqx 'WS49_RUN_ID=38600254823' "$RELEASE"
          grep -Fqx 'WS10_RUN_ID=38604174659' "$RELEASE"
          grep -Fqx 'WS10_HEAD_SHA=163f2ebf81e750bf746fdaa277695329a0682e22' "$RELEASE"
          grep -Fqx 'WS10_CLIENT_ARTIFACT=ws10-c5-visibility-passing-client-4' "$RELEASE"
          grep -Fqx 'WS10_CLIENT_ARTIFACT_ID=11915666463' "$RELEASE"
          grep -Fqx 'WS10_CLIENT_ARTIFACT_DIGEST=sha256:f749750fc5bb0249a67b712bd4e1a03847773d8845fd209508b8c95f6c447a83' "$RELEASE"
          grep -Fq '"permanent_domain_ready": false' workstreams/ws09/DOMAIN_DEPLOYMENT.json

      - name: Account and website authority contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'OFFICIAL_SITE_HANDOFF_COMMIT=8370de2ebfdfd319cf8a719da79cbdef9853fd2f' deploy/.env.production.example
          grep -Fqx 'OFFICIAL_SITE_SOURCE_COMMIT=5f9a4f0ccd3d7d06e8b407bfca35266f1b2d3516' deploy/.env.production.example
          grep -Fqx 'WS13_ACCOUNT_HEAD=1ef67bd7c0c98a588bce4db6c0f1305b820af008' deploy/.env.production.example
          grep -Fqx 'WS13_ACCOUNT_RUN_ID=38650301600' deploy/.env.production.example
          grep -Fqx 'WS07_ACCOUNT_COMMIT=1ae85c96319cbab11648a91ed28300e17d4c607f' deploy/.env.production.example
          grep -Fq 'OLDKO_ACCOUNT_REPOSITORY_MODULE=/opt/oldkoweb/ws07/services/oldko-data/src/adapters/ws13-account-api.js' deploy/.env.production.example

      - name: Prepare production contract fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/secrets deploy/tls deploy/artifacts/{site,play,admin,acme}
          printf 'ci-only-not-a-secret\n' > deploy/secrets/postgres_password.txt
          chmod 600 deploy/secrets/postgres_password.txt
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=oldkoweb.com' \
            -addext 'subjectAltName=DNS:oldkoweb.com,DNS:play.oldkoweb.com,DNS:admin.oldkoweb.com' \
            -keyout deploy/tls/privkey.pem \
            -out deploy/tls/fullchain.pem >/dev/null 2>&1
          cp deploy/.env.production.example /tmp/ws09-production-ci.env
          fake='example.invalid/oldkoweb@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          sed -i \
            -e "s#^NGINX_IMAGE=.*#NGINX_IMAGE=$fake#" \
            -e "s#^POSTGRES_IMAGE=.*#POSTGRES_IMAGE=$fake#" \
            -e "s#^ACCOUNT_API_IMAGE=.*#ACCOUNT_API_IMAGE=$fake#" \
            -e "s#^ADMIN_API_IMAGE=.*#ADMIN_API_IMAGE=$fake#" \
            -e "s#^GATEWAY_IMAGE=.*#GATEWAY_IMAGE=$fake#" \
            -e "s#^KO_SESSION_WORLD_IMAGE=.*#KO_SESSION_WORLD_IMAGE=$fake#" \
            -e 's#^ACCOUNT_DATABASE_URL=.*#ACCOUNT_DATABASE_URL=postgresql://ci:ci@db:5432/oldkoweb#' \
            -e 's#^OLDKO_ACCOUNT_DELIVERY_WEBHOOK_URL=.*#OLDKO_ACCOUNT_DELIVERY_WEBHOOK_URL=https://delivery.example.invalid/account#' \
            -e 's#^OLDKO_ACCOUNT_DELIVERY_WEBHOOK_SECRET=.*#OLDKO_ACCOUNT_DELIVERY_WEBHOOK_SECRET=ci-placeholder-through-secure-channel#' \
            /tmp/ws09-production-ci.env

      - name: Production compose and env dry-run
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /tmp/ws09-production-ci.env -f docker-compose.ws09.yml config --quiet
          sh deploy/validate-production-env.sh /tmp/ws09-production-ci.env
          if sh deploy/validate-production-env.sh deploy/.env.production.example; then
            echo 'placeholder production env unexpectedly passed immutable image/secure-input validation' >&2
            exit 1
          fi

      - name: Production Nginx syntax and route contract
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --add-host account-api:127.0.0.1 \
            --add-host gateway-auth:127.0.0.1 \
            --add-host gateway-game:127.0.0.1 \
            --add-host admin-api:127.0.0.1 \
            -e OFFICIAL_HOST=oldkoweb.com \
            -e PLAY_HOST=play.oldkoweb.com \
            -e ADMIN_HOST=admin.oldkoweb.com \
            -e ACCOUNT_API_PORT=8081 \
            -e ADMIN_API_PORT=8080 \
            -e GATEWAY_INTERNAL_PORT=8080 \
            -e 'NGINX_ENVSUBST_FILTER=^(OFFICIAL_HOST|PLAY_HOST|ADMIN_HOST|ACCOUNT_API_PORT|ADMIN_API_PORT|GATEWAY_INTERNAL_PORT)$' \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/mime.types:/etc/nginx/oldkoweb-mime.types:ro" \
            -v "$PWD/infra/nginx/templates/production.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/deploy/tls:/etc/nginx/tls:ro" \
            -v "$PWD/deploy/artifacts:/srv/oldkoweb:ro" \
            nginx:stable-alpine nginx -t
          grep -Fq 'location /api/account/' infra/nginx/templates/production.conf.template
          grep -Fq 'proxy_pass http://account-api:${ACCOUNT_API_PORT}/;' infra/nginx/templates/production.conf.template
          grep -Fq 'location = /auth' infra/nginx/templates/production.conf.template
          grep -Fq 'location = /game' infra/nginx/templates/production.conf.template
          grep -Fq 'location /api/admin/' infra/nginx/templates/production.conf.template
          grep -Fq 'application/wasm' infra/nginx/mime.types
          grep -Fq 'application/octet-stream' infra/nginx/mime.types
          ! grep -Fq 'Strict-Transport-Security' infra/nginx/templates/production.conf.template

      - name: Release switch and rollback dry-run
        shell: bash
        run: |
          set -euo pipefail
          release=/tmp/ws09-release-a
          previous=/tmp/ws09-release-b
          mkdir -p "$release"/{site,play,admin} "$previous"/{site,play,admin} deploy/state
          sh deploy/release-switch.sh --dry-run "$release"
          printf '%s\n' "$previous" > deploy/state/previous-release
          sh deploy/rollback-static.sh --dry-run deploy/state/previous-release
