name: WS14 world session

on:
  push:
    branches: [ws14-world-session]
    paths:
      - 'services/ko1298-world/**'
      - 'tests/ko1298-world/**'
      - 'workstreams/ws14/**'
      - '.github/workflows/ws14-world.yml'
  pull_request:
    paths:
      - 'services/ko1298-world/**'
      - 'tests/ko1298-world/**'
      - 'workstreams/ws14/**'
      - '.github/workflows/ws14-world.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned 1298 server map authority
        uses: actions/checkout@v4
        with:
          repository: Open-KO/KnightOnline
          ref: 7d6cf81093e142c928c2ac9510512b2b182178b5
          path: .authority/openko
          sparse-checkout: |
            assets/Server/MAP/moradon_0826.smd
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout task-pinned WS11 visibility authority
        uses: actions/checkout@v4
        with:
          repository: orhansevinc/oldera-preview
          ref: 944b6ff9b6329af29f1048a74aa6e14fca141639
          path: .authority/ws11
          sparse-checkout: |
            protocol-lab/visibility-fixtures
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout task-pinned WS16 Moradon NPC provider
        uses: actions/checkout@v4
        with:
          repository: orhansevinc/oldera-preview
          ref: 5ed48ff32187000312652838674388df52fc3fb7
          path: .authority/ws16
          sparse-checkout: |
            services/ko1298-npc
            world-data/npc/moradon.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout task-pinned WS25 Moradon mob provider
        uses: actions/checkout@v4
        with:
          repository: orhansevinc/oldera-preview
          ref: a334f54f9a6bd3ac416bd099cc48060f88a7e7fd
          path: .authority/ws25
          sparse-checkout: |
            services/ko1298-mobs/mob-model.cjs
            world-data/mobs/verified/moradon-zone21.verified.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run WS14 tests with exact pinned visibility providers
        id: tests
        env:
          WS14_MORADON_SMD: ${{ github.workspace }}/.authority/openko/assets/Server/MAP/moradon_0826.smd
          WS14_WS11_VISIBILITY_FIXTURES: ${{ github.workspace }}/.authority/ws11/protocol-lab/visibility-fixtures
          WS14_WS16_PROVIDER_ROOT: ${{ github.workspace }}/.authority/ws16
          WS14_WS16_NPC_DATA: ${{ github.workspace }}/.authority/ws16/world-data/npc/moradon.json
          WS14_WS25_PROVIDER_ROOT: ${{ github.workspace }}/.authority/ws25
          WS14_WS25_MOB_DATA: ${{ github.workspace }}/.authority/ws25/world-data/mobs/verified/moradon-zone21.verified.json
        run: |
          set +e
          set -o pipefail
          node --test tests/ko1298-world/*.test.js 2>&1 | tee ws14-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            signature=$(grep -E 'not ok|Error:|AssertionError|Expected|actual:|operator:' ws14-test.log | tail -n 12 | base64 -w0 | head -c 180)
            echo "failure_signature=$signature" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload WS14 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws14-diag-${{ steps.tests.outputs.failure_signature || 'pass' }}
          path: ws14-test.log
          if-no-files-found: error
          retention-days: 7
