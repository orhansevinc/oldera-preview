name: WS14 world session

on:
  push:
    branches: [ws14-world-session]
    paths:
      - 'services/ko1298-world/**'
      - 'tests/ko1298-world/**'
      - 'workstreams/ws14/**'
      - '.github/workflows/ws14-world.yml'
  pull_request:
    paths:
      - 'services/ko1298-world/**'
      - 'tests/ko1298-world/**'
      - 'workstreams/ws14/**'
      - '.github/workflows/ws14-world.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run WS14 tests
        run: node --test tests/ko1298-world/*.test.js
