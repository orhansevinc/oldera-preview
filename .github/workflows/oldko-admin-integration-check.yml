name: OldKO Admin Integration Check

on:
  push:
    paths:
      - 'admin/**'
      - 'server/**'
      - 'previewbridge1298.js'
      - 'client1298.html'
      - '.github/workflows/oldko-admin-integration-check.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'server/**'
      - 'previewbridge1298.js'
      - 'client1298.html'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser JavaScript syntax
        run: |
          node --check previewbridge1298.js
          node --check admin/admin.js
          node --check admin/preview-link.js
          node --check admin/character-control.js
          node --check admin/admin-assets.js
          node --check admin/live-api.js
          node --check admin/in-game-owner-bridge.js
          node --check admin/in-game-owner-overlay.js
      - name: Install API dependencies
        working-directory: server
        run: npm install --ignore-scripts
      - name: Check API syntax
        working-directory: server
        run: |
          node --check src/index.js
          node --check src/ko-db.js
      - name: Validate JSON contracts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('admin/command-registry.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('admin/character-service.contract.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('server/package.json','utf8'))"
