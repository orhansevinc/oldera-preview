name: OpenKO Browser Network Proof

on:
  workflow_dispatch:
  push:
    branches: [openko-browser-port]
    paths:
      - 'gateway/**'
      - 'tools/patch_openko_browser_gateway.py'
      - 'tools/ko_tcp_probe.mjs'
      - '.github/workflows/openko-browser-network.yml'

permissions:
  contents: read

jobs:
  login-gateway-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout OldERA control repo
        uses: actions/checkout@v4
        with:
          ref: openko-browser-port

      - name: Checkout OpenKO POSIX client
        uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: feature/port-posix
          path: openko
          submodules: false
          fetch-depth: 1

      - name: Checkout genuine KO 1298 login assets
        uses: actions/checkout@v4
        with:
          repository: ko4life-net/ko-assets
          ref: 1298
          path: ko-assets
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Data
            UI_US
            Snd/Intro_Sound.mp3
            Server.ini

      - name: Patch OpenKO browser runtime and login gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_openko_browser.py
          python3 tools/patch_openko_browser_gateway.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openko/src/Client/WarFare/RHIDeviceGL.cpp')
          s = p.read_text()
          bad = r'#version 300 es\nprecision highp float;'
          good = '#version 300 es\nprecision highp float;'
          count = s.count(bad)
          if count != 2:
              raise SystemExit(f'expected 2 escaped GLSL headers, found {count}')
          p.write_text(s.replace(bad, good))
          print('Corrected both GLSL ES 300 shader headers')
          PY
          grep -q 'browser login transport active: KO socket -> WebSocket gateway' openko/src/Client/WarFare/GameProcLogIn_1298.cpp
          grep -q -- '-lwebsocket.js' openko/src/Client/WarFare/CMakeLists.txt

      - name: Install build and JS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git
          npm install --no-save --no-audit --no-fund ws@8.18.3 playwright-core@1.55.0

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure WebAssembly client
        shell: bash
        run: |
          set -euo pipefail
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' \
            -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee configure-network.log

      - name: Build WarFare WASM with live login transport
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-web --target WarFare -j2 2>&1 | tee build-network.log
          test -s build-web/bin/Release/KnightOnLine.js
          test -s build-web/bin/Release/KnightOnLine.wasm
          test -s build-web/bin/Release/KnightOnLine.data

      - name: Prove browser WebSocket to KO TCP packet chain
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-web/bin/Release
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not available' >&2
            exit 1
          fi

          rm -f gateway-probe-result.txt gateway-probe.log gateway-runtime.log browser-network.log
          KO_PROBE_PORT=16100 KO_PROBE_RESULT=gateway-probe-result.txt \
            node tools/ko_tcp_probe.mjs >gateway-probe.log 2>&1 &
          PROBE_PID=$!
          KO_TARGET_HOST=127.0.0.1 KO_TARGET_PORT=16100 OLDERA_GATEWAY_PORT=15100 \
            node gateway/oldera-gateway.mjs >gateway-runtime.log 2>&1 &
          GATEWAY_PID=$!
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" >browser-http-network.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID $GATEWAY_PID $PROBE_PID 2>/dev/null || true' EXIT
          sleep 2

          cat > "$OUT/network-smoke.html" <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>OldERA network proof</title></head>
          <body style="margin:0;background:#000">
            <canvas id="canvas" width="1024" height="768"></canvas>
            <pre id="status" style="color:#fff"></pre>
            <script>
            (() => {
              const status = document.getElementById('status');
              const canvas = document.getElementById('canvas');
              const write = (kind, args) => {
                const line = '[' + kind + '] ' + args.join(' ');
                status.textContent += line + '\n';
                console.log(line);
              };
              window.Module = {
                canvas,
                arguments: ['--renderer','gl','--data','/data'],
                print: (...a) => write('OUT', a),
                printErr: (...a) => write('ERR', a),
                onRuntimeInitialized: () => write('SMOKE', ['WASM_RUNTIME_READY'])
              };
            })();
            </script>
            <script src="KnightOnLine.js"></script>
          </body></html>
          EOF

          cat > browser-network.cjs <<'EOF'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME,
              args: ['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl','--ignore-gpu-blocklist']
            });
            const page = await browser.newPage({ viewport: { width: 1024, height: 768 } });
            page.on('console', msg => console.log('[console:' + msg.type() + '] ' + msg.text()));
            page.on('pageerror', err => console.log('[pageerror] ' + err.stack));
            await page.goto('http://127.0.0.1:8000/network-smoke.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => {
              const text = document.getElementById('status')?.textContent || '';
              return text.includes('browser login transport active: KO socket -> WebSocket gateway')
                && text.includes('login scene: CGameProcedure brought up');
            }, null, { timeout: 90000 });
            await page.waitForTimeout(5000);
            const status = await page.locator('#status').textContent().catch(() => '');
            fs.writeFileSync('browser-network-status.txt', status || '');
            await page.screenshot({ path: 'browser-network.png', fullPage: false });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          EOF

          CHROME="$CHROME" timeout 120s node browser-network.cjs 2>&1 | tee browser-network.log

          for i in $(seq 1 40); do
            if [ -f gateway-probe-result.txt ] && grep -q 'KO_FRAME_OK opcode=0xf5' gateway-probe-result.txt; then break; fi
            sleep 0.25
          done

          echo '--- gateway ---'
          cat gateway-runtime.log || true
          echo '--- TCP probe ---'
          cat gateway-probe.log || true
          echo '--- browser tail ---'
          tail -n 100 browser-network.log || true

          grep -q 'browser connected' gateway-runtime.log
          grep -q 'tcp connected 127.0.0.1:16100' gateway-runtime.log
          grep -q 'KO_FRAME_OK opcode=0xf5' gateway-probe-result.txt
          grep -q 'browser login transport active: KO socket -> WebSocket gateway' browser-network-status.txt
          grep -q 'login scene: CGameProcedure brought up' browser-network-status.txt
          if grep -Eq '\[pageerror\]|GL_INVALID_(ENUM|VALUE|OPERATION)|WebGL: INVALID_|WebGL: too many errors' browser-network.log; then
            echo 'Browser/WebGL error detected' >&2
            exit 1
          fi
          echo 'NETWORK_CHAIN_OK browser -> WebSocket -> gateway -> KO TCP, LS_SERVERLIST=0xF5'

      - name: Upload network proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openko-browser-network-proof
          path: |
            configure-network.log
            build-network.log
            browser-network.log
            browser-network-status.txt
            browser-network.png
            browser-http-network.log
            gateway-runtime.log
            gateway-probe.log
            gateway-probe-result.txt
          if-no-files-found: warn
