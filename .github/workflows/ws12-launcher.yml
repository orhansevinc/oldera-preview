name: WS12 Browser Launcher

on:
  push:
    branches: [ws12-browser-launcher]
    paths:
      - 'play-shell/**'
      - 'releases/preview/**'
      - 'tools/ws12_launcher/**'
      - 'tests/ws12-launcher/**'
      - 'workstreams/ws12/**'
      - '.github/workflows/ws12-launcher.yml'
  pull_request:
    paths:
      - 'play-shell/**'
      - 'releases/preview/**'
      - 'tools/ws12_launcher/**'
      - 'tests/ws12-launcher/**'
      - 'workstreams/ws12/**'
      - '.github/workflows/ws12-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WS12
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and contract validation
        run: |
          set -euo pipefail
          node --check play-shell/launcher-core.js
          node --check play-shell/release-channel.js
          node --check play-shell/app.js
          node --check tools/ws12_launcher/release-channel.cjs
          node tools/ws12_launcher/check-config.cjs
          node -e "JSON.parse(require('node:fs').readFileSync('workstreams/ws12/PLAY_OLDKOWEB_RELEASE_CONTRACT.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('releases/preview/release-pointer.schema.json','utf8'))"
          if grep -Rni --exclude='*.example.json' 'trycloudflare.com' play-shell tools/ws12_launcher releases/preview; then
            echo 'hardcoded trycloudflare URL/reference forbidden in runtime surfaces' >&2
            exit 1
          fi

      - name: Launcher and atomic release tests
        run: node --test tests/ws12-launcher/*.test.cjs

      - name: Checkout exact WS38 publication contract read-only
        uses: actions/checkout@v4
        with:
          ref: 683f6d55471d1b101371e5766ecf0ef21c8bf1e9
          path: .ws38

      - name: Verify WS38 manifest/cache compatibility on fixture package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1298-ws12-contract-${GITHUB_SHA:0:12}"
          BUILD_ID="ws12-contract-${GITHUB_RUN_ID}"
          OUT="$RUNNER_TEMP/ws12-publication"
          mkdir -p "$OUT/client-content/v1/$VERSION"
          PYTHONPATH=.ws38 python -m tools.ws38_content.generate_manifest \
            --root real1298 \
            --profile .ws38/content-pipeline/oldko1298.profile.json \
            --content-version "$VERSION" \
            --build-id "$BUILD_ID" \
            --source-commit "$GITHUB_SHA" \
            --source-ref ws12-browser-launcher \
            --output "$OUT/client-content/v1/$VERSION/manifest.json" \
            --publication-marker-output "$OUT/client-content/v1/$VERSION/_complete.json" \
            --cdn-publication-marker-path "client-content/v1/$VERSION/_complete.json" \
            --latest-output "$OUT/latest.json" \
            --cdn-manifest-path "client-content/v1/$VERSION/manifest.json"
          PYTHONPATH=.ws38 python -m tools.ws38_content.verify_manifest \
            --root real1298 \
            --manifest "$OUT/client-content/v1/$VERSION/manifest.json" \
            --expected-content-version "$VERSION" \
            --publication-marker "$OUT/client-content/v1/$VERSION/_complete.json" \
            --require-publication-marker \
            --latest-pointer "$OUT/latest.json"

      - name: Static shell HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8129 >/tmp/ws12-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent --show-error --head http://127.0.0.1:8129/play-shell/index.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8129/play-shell/config.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8129/play-shell/release-channel.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8129/releases/preview/release-pointer.schema.json >/dev/null
