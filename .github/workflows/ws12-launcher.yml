name: WS12 Browser Launcher

on:
  push:
    branches: [ws12-browser-launcher]
    paths:
      - 'play-shell/**'
      - 'tools/ws12_launcher/**'
      - 'tests/ws12-launcher/**'
      - 'workstreams/ws12/**'
      - '.github/workflows/ws12-launcher.yml'
  pull_request:
    paths:
      - 'play-shell/**'
      - 'tools/ws12_launcher/**'
      - 'tests/ws12-launcher/**'
      - 'workstreams/ws12/**'
      - '.github/workflows/ws12-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and config validation
        run: |
          node --check play-shell/launcher-core.js
          node --check play-shell/app.js
          node tools/ws12_launcher/check-config.cjs
      - name: Launcher tests
        run: node --test tests/ws12-launcher/*.test.cjs
      - name: Real 1298 package HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8129 >/tmp/ws12-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent --show-error --head http://127.0.0.1:8129/play-shell/index.html >/dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:8129/real1298/index.html >/dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:8129/real1298/KnightOnLine.js >/dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:8129/real1298/KnightOnLine.wasm >/dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:8129/real1298/KnightOnLine.data >/dev/null
