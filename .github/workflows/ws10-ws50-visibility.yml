name: WS10 WS50-C5 Real Browser Visibility Gate

on:
  workflow_dispatch:
  push:
    branches: [ws10-qa-integration]
    paths:
      - '.github/workflows/ws10-ws50-visibility.yml'
      - '.github/workflows/ws10-e2e.yml'
      - 'qa/moradon/**'
      - 'workstreams/ws10/**'

permissions:
  contents: read
  actions: read

env:
  PROVIDER_SET_KEY: WS50-C5@sha256:7ac3b8a4c06b67e52b8d18518ef8c82209a60c6101c33609a4c16e64d84f119e
  WS50_MANIFEST_COMMIT: 0d5001095fa3b43693b4fa0cda615f84e2cb7df5
  WS02_SHA: 1738f60945b24e00bdd2266e6600b5c0cf3c64cf
  WS03_SHA: 495de481726734d85cc28b3d432835799aff7e48
  WS05_SHA: 0537c481383a69c534799b43810f35e7279c5578
  WS11_SHA: 944b6ff9b6329af29f1048a74aa6e14fca141639
  WS14_SHA: ed5f806ce7505f4dfae406e4164735def63b6c86
  WS16_SHA: 5ed48ff32187000312652838674388df52fc3fb7
  WS25_SHA: 13c9bafe287b250d56b52f19e97a02e7ef18e6e5
  WS31_SHA: 546d2ab62cd46a97f3385ebcddbe0c775a02c2eb
  CANONICAL_RUN_ID: '38505039290'
  CANONICAL_EVIDENCE_ARTIFACT: ws10-moradon-e2e-26
  OPENKO_SHA: 97eb0ea20207afc0c360bfed6915113572711be3
  KO_ASSETS_SHA: 2055ee6ed77f1b5cfef23832dd5bc31909e14a66
  WS10_TEST_ID: ws10e2e
  WS10_TEST_PW: ws10pass
  WS10_CHAR_NAME: Ws10Hero
  WS10_RUNTIME_TIMEOUT_MS: '300000'
  WS10_WORLD_TIMEOUT_MS: '600000'
  WS10_WORLD_HEARTBEAT_MS: '15000'
  QA_ARTIFACT_DIR: artifacts/moradon

jobs:
  c5-real-browser-visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout WS10 harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind this run to exact immutable WS50-C5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/moradon .qa-providers
          git fetch --no-tags origin "$WS50_MANIFEST_COMMIT"
          git show "$WS50_MANIFEST_COMMIT:release/sets/ws50/C5.json" > artifacts/moradon/ws50-c5.json
          python3 - <<'PY'
          import hashlib, json
          p='artifacts/moradon/ws50-c5.json'
          d=json.load(open(p))
          expected='WS50-C5@sha256:7ac3b8a4c06b67e52b8d18518ef8c82209a60c6101c33609a4c16e64d84f119e'
          x=dict(d); x.pop('content_hash',None); x.pop('immutable_key',None)
          encoded=json.dumps(x,sort_keys=True,separators=(',',':'))
          h='sha256:'+hashlib.sha256(encoded.encode()).hexdigest()
          assert h==d['content_hash'], (h,d['content_hash'])
          assert d['immutable_key']==expected
          assert d['candidate_result']=='PASS'
          providers={p['ws']:p['exact_sha'] for p in d['providers']}
          required={
            'WS02':'1738f60945b24e00bdd2266e6600b5c0cf3c64cf',
            'WS03':'495de481726734d85cc28b3d432835799aff7e48',
            'WS05':'0537c481383a69c534799b43810f35e7279c5578',
            'WS11':'944b6ff9b6329af29f1048a74aa6e14fca141639',
            'WS14':'ed5f806ce7505f4dfae406e4164735def63b6c86',
            'WS16':'5ed48ff32187000312652838674388df52fc3fb7',
            'WS25':'13c9bafe287b250d56b52f19e97a02e7ef18e6e5',
            'WS31':'546d2ab62cd46a97f3385ebcddbe0c775a02c2eb',
          }
          for ws,sha in required.items(): assert providers[ws]==sha,(ws,providers.get(ws),sha)
          print('WS10_C5_MANIFEST_BINDING PASS',expected)
          PY

      - name: Prove canonical client lacks required visibility boundary observability
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANONICAL_EVIDENCE_ARTIFACT }}
          path: artifacts/canonical-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: orhansevinc/oldera-preview
          run-id: ${{ env.CANONICAL_RUN_ID }}

      - name: Record source-only observability rebuild necessity
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -q 'WS10_VISIBILITY' artifacts/canonical-evidence; then
            echo 'canonical evidence unexpectedly already has visibility boundary markers' >&2
            exit 1
          fi
          cat > artifacts/moradon/observability-rebuild.txt <<'EOF'
          Canonical run 38505039290 proves KO1298 browser/Moradon rendering and 0x1C->0x1D network flow,
          but exposes no client-internal parse/entity/model/render markers. Stage-4 requires those exact
          boundaries, so the client is rebuilt from the same pinned OpenKO source, KO assets, and WS04/WS05
          browser patches with logging-only markers. No packet, entity, model-selection, transform, or render
          behavior is substituted or changed by the WS10 observability patch.
          EOF

      - name: Stage exact C5 provider commits without branch resolution
        shell: bash
        run: |
          set -euo pipefail
          stage() {
            key="$1"; sha="$2"
            git fetch --no-tags origin "$sha"
            test "$(git rev-parse FETCH_HEAD)" = "$sha"
            git worktree add --detach ".qa-providers/$key" "$sha"
            printf '%s %s\n' "$key" "$sha" >> artifacts/moradon/provider-refs.txt
          }
          : > artifacts/moradon/provider-refs.txt
          stage ws02 "$WS02_SHA"
          stage ws03 "$WS03_SHA"
          stage ws05 "$WS05_SHA"
          stage ws11 "$WS11_SHA"
          stage ws14 "$WS14_SHA"
          stage ws16 "$WS16_SHA"
          stage ws25 "$WS25_SHA"
          stage ws31 "$WS31_SHA"

      - name: Fetch exact Moradon SMD height authority
        shell: bash
        run: |
          set -euo pipefail
          SMD="$RUNNER_TEMP/moradon_0826.smd"
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/Open-KO/KnightOnline/7d6cf81093e142c928c2ac9510512b2b182178b5/assets/Server/MAP/moradon_0826.smd' \
            --output "$SMD"
          python3 - "$SMD" <<'PY'
          import hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1]); data=p.read_bytes()
          assert len(data)==786000,len(data)
          actual=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          assert actual=='cf47772b8e42a8bad71032419f47978c8bbd6142',actual
          print('WS10_MORADON_SMD_IDENTITY PASS',actual,len(data))
          PY
          echo "WS14_MORADON_SMD=$SMD" >> "$GITHUB_ENV"

      - name: Re-prove exact C5 visibility composition before browser
        shell: bash
        env:
          WS14_WS11_VISIBILITY_FIXTURES: ${{ github.workspace }}/.qa-providers/ws11/protocol-lab/visibility-fixtures
          WS14_WS16_PROVIDER_ROOT: ${{ github.workspace }}/.qa-providers/ws16
          WS14_WS16_NPC_DATA: ${{ github.workspace }}/.qa-providers/ws16/world-data/npc/moradon.json
          WS14_WS25_PROVIDER_ROOT: ${{ github.workspace }}/.qa-providers/ws25
          WS14_WS25_MOB_DATA: ${{ github.workspace }}/.qa-providers/ws25/world-data/mobs/verified/moradon-zone21.verified.json
          WS14_WS11_PROVIDER_SHA: 944b6ff9b6329af29f1048a74aa6e14fca141639
          WS14_WS16_PROVIDER_SHA: 5ed48ff32187000312652838674388df52fc3fb7
          WS14_WS25_PROVIDER_SHA: 13c9bafe287b250d56b52f19e97a02e7ef18e6e5
          WS14_WS31_PROVIDER_SHA: 546d2ab62cd46a97f3385ebcddbe0c775a02c2eb
        run: node --test .qa-providers/ws14/tests/ko1298-world/visibility-provider-composition.test.js | tee artifacts/moradon/c5-composition.log

      - name: Checkout exact browser-capable OpenKO source
        uses: actions/checkout@v4
        with:
          repository: luisfelipe18/old-school-openko
          ref: 97eb0ea20207afc0c360bfed6915113572711be3
          path: openko
          submodules: false
          fetch-depth: 1

      - name: Checkout exact genuine KO1298 assets
        uses: actions/checkout@v4
        with:
          repository: ko4life-net/ko-assets
          ref: 2055ee6ed77f1b5cfef23832dd5bc31909e14a66
          path: ko-assets
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Data
            UI_US
            Snd/Intro_Sound.mp3
            Server.ini

      - name: Verify exact client source and asset identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C openko rev-parse HEAD)" = "$OPENKO_SHA"
          test "$(git -C ko-assets rev-parse HEAD)" = "$KO_ASSETS_SHA"
          test "$(git -C ko-assets rev-parse HEAD^{tree})" = '705874881c8308e0a45a0c849e4b3881088d8138'
          printf 'openko=%s\nko-assets=%s\nko-assets-tree=%s\n' \
            "$(git -C openko rev-parse HEAD)" "$(git -C ko-assets rev-parse HEAD)" "$(git -C ko-assets rev-parse HEAD^{tree})" \
            > artifacts/moradon/client-source-identity.txt

      - name: Apply canonical browser patches plus logging-only visibility observability
        shell: bash
        run: |
          set -euo pipefail
          python3 .qa-providers/ws05/tools/patch_openko_browser.py
          python3 .qa-providers/ws05/tools/patch_openko_browser_gateway.py
          python3 .qa-providers/ws05/tools/fix_browser_server_ini_case.py
          python3 .qa-providers/ws05/tools/patch_openko_browser_serverlist_probe.py
          python3 .qa-providers/ws05/tools/patch_openko_browser_auth_probe.py
          python3 .qa-providers/ws05/tools/ws04_character/patch_character_client.py
          python3 .qa-providers/ws05/tools/ws04_character/patch_frame_capture.py
          python3 .qa-providers/ws05/tools/ws05_moradon/patch_moradon_client.py
          python3 qa/moradon/patch_visibility_observability.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('openko/src/Client/WarFare/RHIDeviceGL.cpp'); s=p.read_text()
          if 'request >= 1000' not in s or 'WS04ServiceCaptureRequest("present", false)' not in s:
              raise SystemExit('WS04 Present-only capture contract changed')
          bad=r'#version 300 es\nprecision highp float;'; good='#version 300 es\nprecision highp float;'
          if s.count(bad)!=2: raise SystemExit('escaped GLSL anchors changed')
          p.write_text(s.replace(bad,good))
          PY
          grep -q 'WS05_GATE event=moradon-local-player-rendered zone=21' openko/src/Client/WarFare/GameProcMain.cpp
          grep -q 'WS10_VISIBILITY DETAIL_RECORD' openko/src/Client/WarFare/GameProcMain.cpp
          grep -q 'WS10_VISIBILITY RENDERED' openko/src/Client/WarFare/PlayerBase.cpp

      - name: Install build and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 git
          npm install --prefix qa --no-audit --no-fund
          npx --prefix qa playwright install --with-deps chromium

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build real KO1298 C++ Emscripten WebGL2 client
        shell: bash
        run: |
          set -o pipefail
          emcc --version | tee artifacts/moradon/emscripten-version.txt
          emcmake cmake -S openko -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-DBOOST_HAS_PTHREADS=1' \
            -DCMAKE_CXX_FLAGS='-DBOOST_HAS_PTHREADS=1 -DASIO_DISABLE_THREADS=1 -fexceptions' \
            -DCMAKE_EXE_LINKER_FLAGS='-fexceptions' \
            -DOPENKO_BUILD_CLIENT=ON \
            -DOPENKO_CLIENT_POSIX_EXPERIMENTAL=ON \
            -DOPENKO_BUILD_CLIENT_TOOLS=OFF \
            -DOPENKO_BUILD_TOOLS=OFF \
            -DOPENKO_BUILD_SERVERS=OFF \
            -DOPENKO_BUILD_TESTS=OFF \
            -DOPENKO_FETCH_CLIENT_ASSETS=OFF \
            -DOPENKO_COMPILE_WARNINGS_AS_ERROR=OFF \
            2>&1 | tee artifacts/moradon/configure.log
          cmake --build build-web --target WarFare -j2 2>&1 | tee artifacts/moradon/build.log
          OUT=build-web/bin/Release
          test -s "$OUT/KnightOnLine.js" && test -s "$OUT/KnightOnLine.wasm" && test -s "$OUT/KnightOnLine.data"
          stat -c '%n %s' "$OUT/KnightOnLine.js" "$OUT/KnightOnLine.wasm" "$OUT/KnightOnLine.data" | tee artifacts/moradon/client-build-sizes.txt

      - name: Run exact C5 real browser visibility E2E
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build-web/bin/Release"
          cat > "$OUT/ws10-moradon.html" <<'EOF'
          <!doctype html><html><body style="margin:0;background:#000;overflow:hidden">
          <canvas id="canvas" width="1024" height="768" tabindex="0"></canvas><pre id="status" style="display:none"></pre>
          <script>
          (()=>{const status=document.getElementById('status');const initial=1010;let armed=false;
          const arm=(line)=>{if(armed||!line.includes('WS05_GATE event=moradon-assets-loaded zone=21'))return;armed=true;globalThis.WS04_CAPTURE_READY=0;globalThis.WS04_CAPTURE_INFLIGHT=0;globalThis.WS04_CAPTURE_PRESENT_ONLY=1;globalThis.WS04_CAPTURE_REQUEST=initial;console.log(`WS10_CAPTURE_ARMED id=${initial} trigger=moradon-assets-loaded mode=present-only`);};
          const write=(kind,args)=>{const line='['+kind+'] '+args.join(' ');status.textContent+=line+'\n';console.log(line);arm(line);};
          window.Module={canvas:document.getElementById('canvas'),arguments:['--renderer','gl','--data','/data'],print:(...a)=>write('OUT',a),printErr:(...a)=>write('ERR',a),onRuntimeInitialized:()=>write('SMOKE',['WASM_RUNTIME_READY'])};})();
          </script><script src="KnightOnLine.js"></script></body></html>
          EOF

          WS50_PROVIDER_SET="$PROVIDER_SET_KEY" \
          WS03_ROOT="$GITHUB_WORKSPACE/.qa-providers/ws03" \
          WS14_ROOT="$GITHUB_WORKSPACE/.qa-providers/ws14" \
          WS16_ROOT="$GITHUB_WORKSPACE/.qa-providers/ws16" \
          WS25_ROOT="$GITHUB_WORKSPACE/.qa-providers/ws25" \
          WS14_MORADON_SMD="$WS14_MORADON_SMD" \
          WS16_NPC_DATA="$GITHUB_WORKSPACE/.qa-providers/ws16/world-data/npc/moradon.json" \
          WS25_MOB_DATA="$GITHUB_WORKSPACE/.qa-providers/ws25/world-data/mobs/verified/moradon-zone21.verified.json" \
          WS10_TEST_ID="$WS10_TEST_ID" WS10_TEST_PW="$WS10_TEST_PW" \
          AUTH_TCP_PORT=16100 GAME_TCP_PORT=16101 \
            node qa/moradon/integration-server.cjs >artifacts/moradon/composition-server.log 2>&1 &
          COMPOSE_PID=$!
          GATEWAY_MODE=auth AUTH_TCP_HOST=127.0.0.1 AUTH_TCP_PORT=16100 LISTEN_HOST=127.0.0.1 PORT=15100 WS_PATH=/ REQUIRE_ORIGIN=false \
            node .qa-providers/ws02/services/ko-gateway/src/server.js >artifacts/moradon/gateway-auth.log 2>&1 &
          AUTH_GW_PID=$!
          GATEWAY_MODE=game GAME_TCP_HOST=127.0.0.1 GAME_TCP_PORT=16101 LISTEN_HOST=127.0.0.1 PORT=15001 WS_PATH=/ REQUIRE_ORIGIN=false \
            node .qa-providers/ws02/services/ko-gateway/src/server.js >artifacts/moradon/gateway-game.log 2>&1 &
          GAME_GW_PID=$!
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$OUT" >artifacts/moradon/http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID $AUTH_GW_PID $GAME_GW_PID $COMPOSE_PID 2>/dev/null || true' EXIT
          sleep 3
          set +e
          node qa/moradon/browser-e2e.cjs 2>&1 | tee artifacts/moradon/driver.log
          DRIVER_RC=${PIPESTATUS[0]}
          set -e
          cat artifacts/moradon/composition-server.log
          test "$DRIVER_RC" -eq 0
          grep -q 'WS10_AUTH event=region-list' artifacts/moradon/composition-server.log
          grep -q 'WS10_AUTH event=client-detail-request' artifacts/moradon/composition-server.log
          grep -q 'WS10_COMPOSE event=game-tx opcode=0x1d' artifacts/moradon/composition-server.log
          grep -q 'WS10_VISIBILITY DETAIL_RECORD' artifacts/moradon/driver.log
          grep -q 'WS10_VISIBILITY ENTITY_CREATE' artifacts/moradon/driver.log
          grep -q 'WS10_VISIBILITY MODEL_READY' artifacts/moradon/driver.log
          grep -q 'WS10_VISIBILITY RENDERED' artifacts/moradon/driver.log
          grep -q 'WS10_VISIBILITY_CAPTURE_OK' artifacts/moradon/driver.log
          grep -q 'WS10_MORADON_E2E_PASS' artifacts/moradon/driver.log
          node qa/moradon/verify-visibility-evidence.cjs artifacts/moradon/composition-server.log artifacts/moradon/driver.log artifacts/moradon/visibility-proof.json | tee artifacts/moradon/visibility-gate.log
          python3 .qa-providers/ws05/tools/ws05_moradon/moradon_gate.py artifacts/moradon/driver.log | tee artifacts/moradon/ws05-gate.log

      - name: Stage exact passing visibility client
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build-web/bin/Release"
          PASS="$GITHUB_WORKSPACE/artifacts/passing-client"
          mkdir -p "$PASS/evidence"
          cp "$OUT/KnightOnLine.js" "$OUT/KnightOnLine.wasm" "$OUT/KnightOnLine.data" "$OUT/ws10-moradon.html" "$PASS/"
          cp artifacts/moradon/ws50-c5.json "$PASS/"
          cp artifacts/moradon/provider-refs.txt "$PASS/"
          cp artifacts/moradon/client-source-identity.txt "$PASS/"
          cp artifacts/moradon/emscripten-version.txt "$PASS/"
          cp artifacts/moradon/client-build-sizes.txt "$PASS/"
          cp artifacts/moradon/observability-rebuild.txt "$PASS/"
          cp artifacts/moradon/browser-result.json "$PASS/evidence/"
          cp artifacts/moradon/visibility-proof.json "$PASS/evidence/"
          cp artifacts/moradon/driver.log "$PASS/evidence/"
          cp artifacts/moradon/visibility-gate.log "$PASS/evidence/"
          cp artifacts/moradon/moradon-native.png "$PASS/evidence/"
          cp artifacts/moradon/moradon-visibility-native.png "$PASS/evidence/"
          (cd "$PASS" && sha256sum KnightOnLine.js KnightOnLine.wasm KnightOnLine.data ws10-moradon.html > SHA256SUMS.txt)
          {
            echo 'MORADON REAL NPC/MOB VISIBILITY E2E: PASS'
            echo "provider_set=$PROVIDER_SET_KEY"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_number=$GITHUB_RUN_NUMBER"
            echo "ws10_commit=$GITHUB_SHA"
            echo "canonical_baseline_run=$CANONICAL_RUN_ID"
            echo "openko_source=$OPENKO_SHA"
            echo "ko_assets=$KO_ASSETS_SHA"
            echo 'client_delta=logging-only visibility observability'
          } > "$PASS/PASS_METADATA.txt"

      - name: Upload WS10 C5 visibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws10-c5-visibility-e2e-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/moradon/**
            !artifacts/passing-client/**

      - name: Freeze WS10 C5 passing client
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ws10-c5-visibility-passing-client-${{ github.run_number }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: artifacts/passing-client/**
