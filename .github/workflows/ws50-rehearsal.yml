name: WS50 Integration Rehearsal

on:
  push:
    branches:
      - ws50-integration-rehearsal
    paths:
      - 'tools/ws50_integration/**'
      - 'integration-rehearsal/**'
      - 'workstreams/ws50/**'
      - '.github/workflows/ws50-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout WS50
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all workstream refs read-only
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git rev-parse HEAD
          git rev-parse origin/main

      - name: Rehearsal unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd tools/ws50_integration
          python3 -m unittest -v

      - name: Verify WS40 planned branch existence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/ws50_integration/planned_branch_check.py \
            --repo "$GITHUB_WORKSPACE" \
            --plan-ref refs/remotes/origin/ws40-release-readiness \
            | tee "$RUNNER_TEMP/ws50-branch-check.txt"

      - name: Assert checkout clean before rehearsal
        run: |
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/ws50-head-before"

      - name: Run disposable integration rehearsal
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          rm -rf "$RUNNER_TEMP/ws50-output"
          python3 tools/ws50_integration/rehearse.py \
            --repo "$GITHUB_WORKSPACE" \
            --output-root "$RUNNER_TEMP/ws50-output" \
            | tee "$RUNNER_TEMP/ws50-summary.txt"

      - name: Assert source checkout unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/ws50-head-before")"
          test -z "$(git status --porcelain)"

      - name: Publish rehearsal summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/ws50-output/integration-rehearsal/REHEARSAL_REPORT.md"; then
            cat "$RUNNER_TEMP/ws50-output/integration-rehearsal/REHEARSAL_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in "$RUNNER_TEMP/ws50-branch-check.txt" "$RUNNER_TEMP/ws50-summary.txt"; do
            if test -f "$f"; then
              echo '' >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload rehearsal outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws50-rehearsal-output
          path: |
            ${{ runner.temp }}/ws50-output/**
            ${{ runner.temp }}/ws50-summary.txt
            ${{ runner.temp }}/ws50-branch-check.txt
          if-no-files-found: error

  staging-candidate-rehearsal:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[staging-candidate]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout WS50
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch frozen provider refs read-only
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Run exact disposable staging candidate rehearsal
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/ws50-staging-output"
          python3 tools/ws50_integration/staging_candidate_current.py "$RUNNER_TEMP/ws50-staging-output" \
            | tee "$RUNNER_TEMP/ws50-staging.log"

      - name: Publish staging result
        if: always()
        run: |
          echo '## WS50 staging candidate rehearsal' >> "$GITHUB_STEP_SUMMARY"
          for f in frozen-refs.txt candidate-tree-sha.txt result.txt staging-contract.json session-world-container.log; do
            p="$RUNNER_TEMP/ws50-staging-output/$f"
            if test -f "$p"; then
              echo '' >> "$GITHUB_STEP_SUMMARY"
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat "$p" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload staging rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws50-staging-candidate
          path: |
            ${{ runner.temp }}/ws50-staging-output/**
            ${{ runner.temp }}/ws50-staging.log
          if-no-files-found: error
