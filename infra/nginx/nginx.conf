user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/oldkoweb-mime.types;
    default_type application/octet-stream;

    # WS38/WS12 strict publication contract requires JS responses to be
    # text/javascript; charset=utf-8. Keep binary WASM/DATA types untouched.
    charset utf-8;
    charset_types text/javascript application/json text/plain;

    log_format oldkoweb '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                       'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                       'ua="$http_user_agent" request_id=$request_id';
    access_log /var/log/nginx/access.log oldkoweb;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
