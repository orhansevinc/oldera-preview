<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>OldKOWeb — OldKO 1298</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #stage{position:fixed;inset:0;overflow:hidden;background:#000}
    #canvas{position:absolute;display:block;background:#000;outline:none;max-width:none;max-height:none;margin:0;transform:none}
    #status{position:fixed;left:10px;top:8px;z-index:10;margin:0;color:#b8ffb8;font:12px/1.35 Consolas,monospace;white-space:pre-wrap;pointer-events:none;text-shadow:0 1px 2px #000;max-width:min(900px,95vw)}
  </style>
</head>
<body>
  <div id="stage"><canvas id="canvas" width="1024" height="768" tabindex="0"></canvas></div>
  <pre id="status">OldKOWeb / gerçek OldKO 1298 client yükleniyor…</pre>
  <script>
  (() => {
    'use strict';
    const CLASSIC_W=1024,CLASSIC_H=768;
    const canvas=document.getElementById('canvas');
    const status=document.getElementById('status');
    const lines=[];
    const state=window.__OLDKO_BOOTSTRAP__={
      webgl2Available:false,
      runtimeReady:false,
      runDependencies:null,
      fatal:null,
      transportConfigSource:null,
      display:null
    };

    const log=(kind,text)=>{
      const line=(kind?'['+kind+'] ':'')+String(text);
      console[kind==='ERR'||kind==='FATAL'?'error':'log'](line);
      lines.push(line);
      while(lines.length>20)lines.shift();
      status.textContent=lines.join('\n');
    };
    const fail=(reason)=>{
      state.fatal=String(reason||'bilinmeyen runtime hatası');
      log('FATAL',state.fatal);
    };
    const viewport=()=>{
      const vv=window.visualViewport;
      if(vv&&vv.width>0&&vv.height>0){
        return {left:Number(vv.offsetLeft)||0,top:Number(vv.offsetTop)||0,width:vv.width,height:vv.height,source:'visualViewport'};
      }
      return {left:0,top:0,width:innerWidth,height:innerHeight,source:'window'};
    };
    const fitNativeCanvas=()=>{
      const backingW=Number(canvas.width)||CLASSIC_W;
      const backingH=Number(canvas.height)||CLASSIC_H;
      const vp=viewport();
      if(!(vp.width>0&&vp.height>0&&backingW>0&&backingH>0)) return;
      const scale=Math.min(vp.width/backingW,vp.height/backingH);
      const cssW=backingW*scale,cssH=backingH*scale;
      const left=vp.left+(vp.width-cssW)/2,top=vp.top+(vp.height-cssH)/2;
      canvas.style.left=left+'px';
      canvas.style.top=top+'px';
      canvas.style.width=cssW+'px';
      canvas.style.height=cssH+'px';
      state.display={
        backingWidth:backingW,backingHeight:backingH,
        cssWidth:cssW,cssHeight:cssH,left,top,
        viewportWidth:vp.width,viewportHeight:vp.height,
        viewportSource:vp.source,
        devicePixelRatio:Number(devicePixelRatio)||1
      };
    };
    const mapPointer=(clientX,clientY)=>{
      const rect=canvas.getBoundingClientRect();
      const u=(clientX-rect.left)/rect.width;
      const v=(clientY-rect.top)/rect.height;
      return {x:u*canvas.width,y:v*canvas.height,normalizedX:u,normalizedY:v,inside:u>=0&&u<=1&&v>=0&&v<=1};
    };
    window.__OLDKO_DISPLAY_DIAGNOSTICS__={
      snapshot:()=>({...(state.display||{}),fullscreen:!!document.fullscreenElement}),
      mapPointer
    };

    addEventListener('resize',fitNativeCanvas,{passive:true});
    addEventListener('orientationchange',fitNativeCanvas,{passive:true});
    document.addEventListener('fullscreenchange',fitNativeCanvas);
    if(window.visualViewport){
      visualViewport.addEventListener('resize',fitNativeCanvas,{passive:true});
      visualViewport.addEventListener('scroll',fitNativeCanvas,{passive:true});
    }
    if(typeof MutationObserver==='function'){
      new MutationObserver(fitNativeCanvas).observe(canvas,{attributes:true,attributeFilter:['width','height']});
    }
    addEventListener('error',event=>fail(event.message||event.error||'window error'));
    addEventListener('unhandledrejection',event=>fail(event.reason||'unhandled promise rejection'));
    fitNativeCanvas();

    const probe=document.createElement('canvas');
    const probeGL=probe.getContext('webgl2');
    state.webgl2Available=!!probeGL;
    if(probeGL){
      const lose=probeGL.getExtension('WEBGL_lose_context');
      if(lose)lose.loseContext();
    }
    if(!state.webgl2Available){
      fail('WebGL2 desteklenmiyor; gerçek OldKO renderer başlatılamaz.');
      return;
    }
    log('BOOT','WebGL2 hazır; gerçek C++/WASM client yükleniyor.');

    const resolveRuntimeFile=(path)=>{
      try{return new URL(path,document.baseURI).href;}
      catch(_){return path;}
    };

    if(location.protocol==='https:' && typeof window.WebSocket==='function'){
      const NativeWebSocket=window.WebSocket;
      const mapWebSocketUrl=(input)=>{
        try{
          const u=new URL(String(input),location.href);
          if(u.port==='15100') return `wss://${location.host}/auth`;
          if(u.port==='15001') return `wss://${location.host}/game`;
        }catch(_){ }
        return input;
      };
      function OldKOWebWebSocket(url,protocols){
        const mapped=mapWebSocketUrl(url);
        if(String(mapped)!==String(url)) log('NET',`WebSocket bridge ${url} -> ${mapped}`);
        return protocols===undefined ? new NativeWebSocket(mapped) : new NativeWebSocket(mapped,protocols);
      }
      OldKOWebWebSocket.prototype=NativeWebSocket.prototype;
      Object.setPrototypeOf(OldKOWebWebSocket,NativeWebSocket);
      for(const key of ['CONNECTING','OPEN','CLOSING','CLOSED']){
        Object.defineProperty(OldKOWebWebSocket,key,{value:NativeWebSocket[key],enumerable:true});
      }
      window.WebSocket=OldKOWebWebSocket;
      state.transportConfigSource='same-origin-wss-compat';
      log('NET','public staging WebSocket bridge active: 15100=/auth 15001=/game');
    }

    const externalTransport=window.__OLDKO_TRANSPORT_CONFIG__;
    const oldkoTransport=externalTransport||{
      routes:{
        auth:{serverPorts:[15100],endpoint:'/auth'},
        game:{serverPorts:[15001],endpoint:'/game'}
      }
    };
    if(!state.transportConfigSource) state.transportConfigSource=externalTransport?'external':'same-origin-default';
    log('NET',`transport config: ${state.transportConfigSource}; auth=/auth game=/game`);

    const oldkoDisplay=window.__OLDKO_DISPLAY_CONFIG__||{
      mode:'viewport',
      fallbackWidth:CLASSIC_W,
      fallbackHeight:CLASSIC_H
    };
    log('DISPLAY',`native display config: ${oldkoDisplay.mode||'viewport'}; classic fallback=${CLASSIC_W}x${CLASSIC_H}`);

    window.Module={
      canvas,
      arguments:['--renderer','gl','--data','/data'],
      locateFile:(path)=>resolveRuntimeFile(path),
      oldkoTransport,
      oldkoDisplay,
      print:(...args)=>log('OUT',args.join(' ')),
      printErr:(...args)=>log('ERR',args.join(' ')),
      monitorRunDependencies:(left)=>{
        state.runDependencies=left;
        if(left>0)log('LOAD',`1298 paket bağımlılıkları: ${left}`);
      },
      onRuntimeInitialized:()=>{
        state.runtimeReady=true;
        state.runDependencies=0;
        fitNativeCanvas();
        log('RUNTIME','WASM_RUNTIME_READY; KnightOnLine.data preload tamamlandı.');
        canvas.focus();
      },
      onAbort:(reason)=>fail(`WASM abort: ${reason}`)
    };

    const runtimeScript=document.createElement('script');
    runtimeScript.src='KnightOnLine.js';
    runtimeScript.async=false;
    runtimeScript.onerror=()=>fail('KnightOnLine.js yüklenemedi.');
    document.body.appendChild(runtimeScript);
  })();
  </script>
</body>
</html>
