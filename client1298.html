<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OldERA 1298</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Tahoma,Arial,sans-serif;color:#fff}button,input{font:inherit}
.screen{position:fixed;inset:0;display:none}.screen.on{display:flex}
#launcher{align-items:center;justify-content:center;background:radial-gradient(circle,#30201b,#080505 65%)}
.launch{position:relative;width:min(84vh,84vw,920px);aspect-ratio:1/1;background:url('https://www.resimci.org/images/2020/10/27/image9186911c717421bd.png') center/100% 100% no-repeat;filter:drop-shadow(0 24px 60px #000)}
.promoErase{position:absolute;left:4.6%;right:4.1%;top:12%;height:69.2%;z-index:20;background:linear-gradient(180deg,rgba(22,11,8,.96),rgba(17,8,6,.93) 55%,rgba(24,11,8,.96));border:1px solid rgba(191,154,98,.30);box-shadow:inset 0 0 42px rgba(0,0,0,.66),0 0 0 1px rgba(60,24,12,.32)}
.patchMask{position:absolute;left:4.6%;right:4.1%;top:68.2%;height:12.7%;z-index:21;background:linear-gradient(180deg,rgba(31,15,10,.10),rgba(13,6,5,.72) 20%,rgba(14,6,5,.95) 100%);border-top:1px solid rgba(191,154,98,.18)}.patchText{position:absolute;left:9%;right:9%;top:71.6%;height:4.2%;z-index:22;display:flex;align-items:center;justify-content:center;color:#efe6d2;font-weight:bold;font-size:12px;letter-spacing:.2px;text-shadow:0 1px 2px #000}.bar{position:absolute;left:8.2%;right:8.2%;top:76.8%;height:4.1%;z-index:22;border:2px inset #d5b788;background:#260b0c;overflow:hidden;box-shadow:inset 0 0 8px rgba(0,0,0,.45)}.bar i{display:block;height:100%;width:100%;background:linear-gradient(#efc9a4,#c8323f 48%,#8c121d 52%,#d03b42)}
.launchHit{position:absolute;top:85%;height:8.5%;border:0;background:rgba(255,255,255,.001);cursor:pointer;z-index:50;transition:background .08s,box-shadow .08s}.launchHit:hover{background:rgba(255,245,210,.08);box-shadow:inset 0 0 10px rgba(255,220,150,.35)}.launchHit:active{background:rgba(255,245,210,.14);box-shadow:inset 0 0 14px rgba(255,220,150,.55)}.startHit{left:40%;width:18.5%}.homeHit{left:59%;width:19.5%}.optionHit{left:79%;width:18%}
#game{background:#000;align-items:center;justify-content:center}
#stage{position:absolute;width:1024px;height:768px;left:50%;top:50%;transform-origin:center center;overflow:hidden;background:#000}
#sceneBg,#scene3d,#uiHost{position:absolute;inset:0}#sceneBg{z-index:1;pointer-events:none}#scene3d{z-index:2;pointer-events:auto}#uiHost{z-index:3;pointer-events:none}#uiHost>*{pointer-events:none}
#loading{position:absolute;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;background:#000;color:#d8d1c0;font:14px Tahoma;text-align:center;padding:40px}#loading.on{display:flex}
#world{position:fixed;inset:0;display:none;background:#000}#world.on{display:block}#canvasWrap{position:absolute;inset:0}#worldStage{position:absolute;width:1024px;height:768px;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;pointer-events:none}.worldStageInner{position:absolute;inset:0;pointer-events:auto}.worldLoader{position:absolute;inset:0;background:#060403f3;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}.worldLoader h2{font:normal 34px Georgia;color:#e2ca93;letter-spacing:4px}.worldLoader .wbar{width:500px;max-width:75vw;height:14px;border:2px ridge #896f48;background:#080706}.worldLoader i{display:block;height:100%;width:0;background:#b78a43}.worldLoader p{font-size:12px;color:#cdb987}
</style>
</head>
<body>
<section id="launcher" class="screen on"><div class="launch"><div class="promoErase"></div><div class="patchMask"></div><div class="patchText">Update Completed</div><div class="bar"><i></i></div><button id="launchStart" class="launchHit startHit" aria-label="Start" title="Start"></button><button id="launchHome" class="launchHit homeHit" aria-label="HomePage" title="HomePage"></button><button id="launchOption" class="launchHit optionHit" aria-label="Option" title="Option"></button></div></section>
<section id="game" class="screen"><div id="stage"><div id="sceneBg"></div><div id="scene3d"></div><div id="uiHost"></div><div id="loading">1298 client verisi yükleniyor…</div></div></section>
<section id="world"><div id="canvasWrap"></div><div id="worldStage"><div id="worldStageInner" class="worldStageInner"></div></div><div id="worldLoader" class="worldLoader"><h2>MORADON</h2><div class="wbar"><i id="worldFill"></i></div><p id="worldText">Loading USKO 1298 zone...</p></div></section>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="ui1298.js?v=14"></script>
<script src="ui1298_patch.js?v=14"></script>
<script src="pathfix1298.js?v=14"></script>
<script src="exactui1298.js?v=16"></script>
<script src="worlddata1298.js?v=14"></script>
<script src="charscene1298.js?v=17"></script>
<script src="world1298.js?v=14"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),launcher=$('launcher'),game=$('game'),stage=$('stage'),bg=$('sceneBg'),scene3d=$('scene3d'),host=$('uiHost'),loading=$('loading');
const charactersByNation={2:[{name:'Osevinc',race:'btn_race_el_rm',job:'btn_class_warrior',face:0,hair:0,stats:[60,60,70,50,50]},null,null],1:[null,null,null]};
let nation=2,characters=charactersByNation[2],selectedCharIndex=0,character=characters[0],charScene=null,selectedServer=false,createState={race:null,job:null,face:0,hair:0,stats:null,baseStats:null,bonus:0},sceneToken=0;
const cache=new Map();
function fit(){let s=Math.min(innerWidth/1024,innerHeight/768);stage.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
function showGame(){launcher.classList.remove('on');game.classList.add('on')}
function wait(v=true,msg='1298 client verisi yükleniyor…'){loading.textContent=msg;loading.classList.toggle('on',v)}
async function ui(path){if(!cache.has(path))cache.set(path,N3UI.loadUI(path));return cache.get(path)}
function clearScene(){sceneToken++;try{OldERACharScene.stop()}catch{}bg.innerHTML='';scene3d.innerHTML='';scene3d.style.zIndex='2';scene3d.style.pointerEvents='auto';host.innerHTML='';host.style.pointerEvents='none';document.onkeydown=null}
function actionName(id){return String(id||'').toLowerCase()}
function ctl(id){return N3ExactUI.get(id)}
function setInput(id,value){ctl(id)?.setValue?.(value)}
function originalBackdrop(root){
  const hidden=new Set(['group_login','group_serverlist_01','group_notice_1','group_notice_2','group_notice_3','premium']);
  const clone=n=>{let id=String(n.id||'').toLowerCase(),tex=String(n.tex||'').replace(/\\/g,'/').toLowerCase();if(id&&hidden.has(id))return null;if(n.type===4&&tex.endsWith('ui_login_02_us.dxt'))return null;let x={...n,children:[]};for(let c of n.children||[]){let cc=clone(c);if(cc)x.children.push(cc)}return x};
  return clone(root);
}
async function renderLoginBackdrop(root){bg.innerHTML='';let r=originalBackdrop(root),layer=document.createElement('div');layer.style.cssText='position:absolute;inset:0;pointer-events:none';bg.appendChild(layer);await N3ExactUI.render(r,layer,{native:true})}
async function renderUI(root,opts){host.style.pointerEvents='none';return N3ExactUI.render(root,host,opts)}
function fail(e){console.error(e);wait(true,'1298 asset yükleme hatası:\n'+(e?.message||e))}
async function login(){try{showGame();wait();clearScene();let root=await ui('UI_US/el_login_intro_us.uif');await renderLoginBackdrop(root);await renderUI(root,{subtree:'Group_LogIn',native:false,onAction:id=>{let k=actionName(id);if(k==='btn_ok'){let a=ctl('Edit_ID')?.getValue?.().trim(),p=ctl('Edit_PW')?.getValue?.();if(a==='osevinc'&&p==='osevinc')server()}else if(k==='btn_cancel'){location.reload()}}});setInput('Edit_ID','osevinc');setInput('Edit_PW','osevinc');let pw=ctl('Edit_PW')?.el;if(pw)pw.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ctl('btn_ok')?.el?.click()}};wait(false)}catch(e){fail(e)}}
function serverRow(groupId){let g=ctl(groupId)?.el;if(!g)return null;return g.querySelector('[data-uiid="List_Server"], [data-uiid="list_server"]')}
function selectServerRow(index,rows){selectedServer=index;rows.forEach((el,i)=>{if(el)el.style.color=i===index?'rgb(0,255,0)':'rgb(255,255,255)'})}
async function server(){try{wait();clearScene();selectedServer=0;let root=await ui('UI_US/el_login_intro_us.uif');await renderLoginBackdrop(root);await renderUI(root,{subtree:'Group_ServerList_01',native:false,onAction:id=>{let k=actionName(id);if(k==='btn_connect')nationSelect()}});let rows=[];for(let i=1;i<=20;i++){let show=i===1;N3ExactUI.setVisible('server_'+i,show);N3ExactUI.setVisible('img_arrow'+i,show);let row=serverRow('server_'+i);if(!row)continue;if(show){row.textContent='OldERA';row.style.pointerEvents='auto';row.style.cursor='pointer';row.style.whiteSpace='nowrap';row.style.color='rgb(0,255,0)';row.onclick=()=>selectServerRow(0,rows);row.ondblclick=()=>nationSelect();rows.push(row)}else row.textContent=''}selectServerRow(0,rows);document.onkeydown=e=>{if(e.key==='Enter')nationSelect()};wait(false)}catch(e){fail(e)}}
async function nationSelect(){try{wait();clearScene();bg.style.background='#000';let root=await ui('UI_US/co_nation_Select_us.uif');await renderUI(root,{native:true,onAction:id=>{let k=actionName(id);if(k==='btn_elmo_selection'){nation=2;characters=charactersByNation[2];selectedCharIndex=0;character=characters[0]||null;characterSelect()}else if(k==='btn_karus_selection'){nation=1;characters=charactersByNation[1];selectedCharIndex=0;character=characters[0]||null;characterSelect()}else if(k==='btn_back')server()}});wait(false)}catch(e){fail(e)}}
function prettyJob(j){j=String(j||'').replace('btn_class_','');return j?j[0].toUpperCase()+j.slice(1):''}
function moveOriginalButton(id,x,y,label){let c=ctl(id);if(!c?.node)return;let dx=x-c.node.region.l,dy=y-c.node.region.t,t=`translate(${dx}px,${dy}px)`;c.el.style.transform=t;c.layers?.forEach?.(l=>l.style.transform=t);if(label){for(let el of host.querySelectorAll('div')){if(el.children.length===0&&el.textContent.trim().toLowerCase()===label.toLowerCase())el.style.transform=t}}}
function positionCharacterSelect(root){let rw=Math.max(1,root.region.r-root.region.l),ratio=1024/rw,exitY=0;for(let id of ['bt_left','bt_right','bt_exit']){let c=ctl(id);if(!c?.node)continue;let h=c.node.region.b-c.node.region.t,x=Math.floor(c.node.region.l*ratio),y=768-10-h;moveOriginalButton(id,x,y,id==='bt_exit'?'Exit':null);if(id==='bt_exit')exitY=y}let b=ctl('bt_back');if(b?.node){let h=b.node.region.b-b.node.region.t;moveOriginalButton('bt_back',Math.floor(b.node.region.l*ratio),exitY-15-h,'Back')}let d=ctl('bt_delete');if(d?.node)moveOriginalButton('bt_delete',Math.floor(d.node.region.l*ratio),20,'Delete')}
async function characterSelect(){let my=++sceneToken;try{wait();clearScene();my=sceneToken;bg.style.background='radial-gradient(circle at 50% 35%, #20130f 0%, #090403 68%)';let path=nation===1?'UI_US/ka_characterselect_us.uif':'UI_US/el_characterselect_us.uif',root=await ui(path);let updateInfo=(idx,ch)=>{selectedCharIndex=idx;character=ch||null;let info=ctl('text00');if(info?.setText)info.setText(character?`Level: 1\nSpecialty: ${prettyJob(character.job)}\nID: ${character.name}`:'Create Character')};let p3d=OldERACharScene.select(scene3d,{nation,characters,selectedIndex:selectedCharIndex,onChange:updateInfo,onDblClick:(idx,ch)=>{selectedCharIndex=idx;character=ch||null;character?enterWorld():characterCreate()}}).then(s=>{charScene=s;return s});await renderUI(root,{native:true,onAction:id=>{let k=actionName(id);if(k==='bt_left')charScene?.rotate(-1);else if(k==='bt_right')charScene?.rotate(1);else if(k==='bt_back')login();else if(k==='bt_exit')location.reload();else if(k==='bt_delete'&&character){characters[selectedCharIndex]=null;character=null;characterSelect()}}});positionCharacterSelect(root);updateInfo(selectedCharIndex,characters[selectedCharIndex]);document.onkeydown=e=>{if(e.key==='ArrowLeft'){e.preventDefault();charScene?.rotate(-1)}else if(e.key==='ArrowRight'){e.preventDefault();charScene?.rotate(1)}else if(e.key==='Enter'){e.preventDefault();character?enterWorld():characterCreate()}else if(e.key==='Escape')login()};await p3d;if(my===sceneToken)wait(false)}catch(e){fail(e)}}
const raceIdsEl=['btn_race_el_ba','btn_race_el_rm','btn_race_el_rf'],raceIdsKa=['btn_race_ka_at','btn_race_ka_tu','btn_race_ka_wt','btn_race_ka_pt'],classIds=['btn_class_warrior','btn_class_rogue','btn_class_mage','btn_class_priest'],classImgs=['img_warrior','img_rogue','img_mage','img_priest'];
function allowedClasses(race){let r=String(race||'').toLowerCase();if(r.includes('el_ba')||r.includes('ka_at'))return['btn_class_warrior'];if(r.includes('ka_tu'))return['btn_class_rogue','btn_class_priest'];if(r.includes('ka_wt'))return['btn_class_mage'];if(r.includes('ka_pt'))return['btn_class_priest'];return classIds.slice()}
const statKeys=['str','sta','dex','int','map'];
function initStats(){let r=String(createState.race||'').toLowerCase(),vals;if(r.includes('el_ba')||r.includes('ka_at'))vals=[65,65,60,50,50];else if(r.includes('el_rf')||r.includes('ka_wt'))vals=[50,50,70,70,50];else if(r.includes('ka_pt'))vals=[50,60,60,70,50];else vals=[60,60,70,50,50];createState.baseStats=vals.slice();createState.stats=vals.slice();createState.bonus=10;updateStatTexts()}
function updateStatTexts(){if(!createState.stats)return;statKeys.forEach((k,i)=>N3ExactUI.setText('text_'+k,String(createState.stats[i])));N3ExactUI.setText('text_bonus',String(createState.bonus))}
function statButton(k){let m=/^btn_(str|sta|dex|int|map)_(left|right)$/.exec(k);if(!m||!createState.stats)return false;let i=statKeys.indexOf(m[1]);if(m[2]==='right'&&createState.bonus>0){createState.stats[i]++;createState.bonus--}else if(m[2]==='left'&&createState.stats[i]>createState.baseStats[i]){createState.stats[i]--;createState.bonus++}updateStatTexts();return true}
function resetCreateUI(){for(let id of [...raceIdsEl,...raceIdsKa])N3ExactUI.setSelected(id,false);for(let i=0;i<4;i++){N3ExactUI.setSelected(classIds[i],false);N3ExactUI.setVisible(classIds[i],false);N3ExactUI.setVisible(classImgs[i],true)}for(let id of ['img_str','img_sta','img_dex','img_int','img_map'])N3ExactUI.setVisible(id,false);createState.stats=null;createState.baseStats=null;createState.bonus=0;N3ExactUI.setText('text_bonus','0')}
function refreshRaceClass(){let races=nation===1?raceIdsKa:raceIdsEl;for(let id of races)N3ExactUI.setSelected(id,id===createState.race);let allowed=allowedClasses(createState.race);for(let i=0;i<4;i++){let ok=allowed.includes(classIds[i]);N3ExactUI.setVisible(classIds[i],ok);N3ExactUI.setVisible(classImgs[i],!ok);N3ExactUI.setSelected(classIds[i],classIds[i]===createState.job)}let vis=[];if(createState.job==='btn_class_warrior')vis=['img_str','img_sta'];else if(createState.job==='btn_class_rogue')vis=['img_sta','img_dex'];else if(createState.job==='btn_class_mage')vis=['img_int','img_map'];else if(createState.job==='btn_class_priest')vis=['img_str','img_int'];for(let id of ['img_str','img_sta','img_dex','img_int','img_map'])N3ExactUI.setVisible(id,vis.includes(id))}
function previewCreate(root,renderInfo){if(!createState.race)return Promise.resolve();let a=N3UI.find(root,'area_character');if(!a)return Promise.resolve();let rect={l:a.region.l+renderInfo.ox,t:a.region.t+renderInfo.oy,r:a.region.r+renderInfo.ox,b:a.region.b+renderInfo.oy};return OldERACharScene.preview(scene3d,{nation,race:createState.race,job:createState.job,face:createState.face,hair:createState.hair,rect})}
async function characterCreate(){try{wait();clearScene();bg.style.background='radial-gradient(circle at 50% 35%, #18100c 0%, #090403 72%)';scene3d.style.zIndex='4';scene3d.style.pointerEvents='auto';createState={race:null,job:null,face:0,hair:0,stats:null,baseStats:null,bonus:0};let path=nation===1?'UI_US/Ka_CharacterCreate_us.uif':'UI_US/El_CharacterCreate_us.uif',root=await ui(path),ri;ri=await renderUI(root,{native:false,onAction:async id=>{let k=actionName(id);if(/^btn_race_/.test(k)){createState.race=k;createState.job=null;refreshRaceClass();await previewCreate(root,ri)}else if(/^btn_class_/.test(k)){if(allowedClasses(createState.race).includes(k)){createState.job=k;initStats();refreshRaceClass();await previewCreate(root,ri)}}else if(statButton(k)){}else if(k==='btn_face_left'){createState.face=Math.max(0,createState.face-1);await previewCreate(root,ri)}else if(k==='btn_face_right'){createState.face=Math.min(3,createState.face+1);await previewCreate(root,ri)}else if(k==='btn_hair_left'){createState.hair=Math.max(0,createState.hair-1);await previewCreate(root,ri)}else if(k==='btn_hair_right'){createState.hair=Math.min(2,createState.hair+1);await previewCreate(root,ri)}else if(k==='btn_cancel')characterSelect();else if(k==='btn_create'){let name=ctl('edit_name')?.getValue?.().trim();if(name&&createState.race&&createState.job&&createState.bonus===0){characters[selectedCharIndex]={name,race:createState.race,job:createState.job,face:createState.face,hair:createState.hair,stats:createState.stats?.slice()};character=characters[selectedCharIndex];characterSelect()}}}});setInput('edit_name','Osevinc');resetCreateUI();wait(false)}catch(e){fail(e)}}
function enterWorld(){clearScene();game.classList.remove('on');$('world').classList.add('on');try{OldERAWorld.start({name:character?.name||'Osevinc'})}catch(e){$('worldText').textContent='World error: '+e.message}}
$('launchStart').onclick=login;$('launchHome').onclick=()=>{};$('launchOption').onclick=()=>{};
})();
</script>
</body>
</html>
