<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OldERA 1298</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Tahoma,Arial,sans-serif;color:#fff}button,input{font:inherit}
.screen{position:fixed;inset:0;display:none}.screen.on{display:flex}
#launcher{align-items:center;justify-content:center;background:radial-gradient(circle,#30201b,#080505 65%)}
.launch{position:relative;width:min(512px,96vw);aspect-ratio:1/1;background:url('https://www.resimci.org/images/2020/10/27/image9186911c717421bd.png') center/100% 100% no-repeat;filter:drop-shadow(0 20px 40px #000)}
.patchMask{position:absolute;left:4.5%;right:5.5%;top:77%;height:7.6%;background:#110a08cc}.patchText{position:absolute;left:5%;right:5%;top:75.8%;height:4%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:12px;text-shadow:1px 1px 2px #000}.bar{position:absolute;left:5.1%;right:5.7%;top:79.5%;height:3.5%;border:2px inset #d5b788;background:#260b0c;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(#efc9a4,#c8323f 48%,#8c121d 52%,#d03b42)}
.launchHit{position:absolute;top:85%;height:8.5%;border:0;background:rgba(255,255,255,.001);cursor:pointer;z-index:50}.startHit{left:40%;width:18.5%}.homeHit{left:59%;width:19.5%}.optionHit{left:79%;width:18%}
#game{background:#000;align-items:center;justify-content:center}
#stage{position:absolute;width:1024px;height:768px;left:50%;top:50%;transform-origin:center center;overflow:hidden;background:#000}
#sceneBg,#scene3d,#uiHost{position:absolute;inset:0}#sceneBg{z-index:1;pointer-events:none}#scene3d{z-index:2;pointer-events:auto}#uiHost{z-index:3;pointer-events:none}#uiHost>*{pointer-events:auto}
#loading{position:absolute;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;background:#000;color:#ddd;font:14px Tahoma;text-align:center}
#loading.on{display:flex}
#world{position:fixed;inset:0;display:none;background:#000}#world.on{display:block}#canvasWrap{position:absolute;inset:0}#worldStage{position:absolute;width:1024px;height:768px;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;pointer-events:none}.worldStageInner{position:absolute;inset:0;pointer-events:auto}.worldLoader{position:absolute;inset:0;background:#060403f3;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}.worldLoader h2{font:normal 34px Georgia;color:#e2ca93;letter-spacing:4px}.worldLoader .wbar{width:500px;max-width:75vw;height:14px;border:2px ridge #896f48;background:#080706}.worldLoader i{display:block;height:100%;width:0;background:#b78a43}.worldLoader p{font-size:12px;color:#cdb987}
</style>
</head>
<body>
<section id="launcher" class="screen on"><div class="launch"><div class="patchMask"></div><div class="patchText">Update Completed</div><div class="bar"><i></i></div><button id="launchStart" class="launchHit startHit" aria-label="Start"></button><button id="launchHome" class="launchHit homeHit" aria-label="HomePage"></button><button id="launchOption" class="launchHit optionHit" aria-label="Option"></button></div></section>
<section id="game" class="screen"><div id="stage"><div id="sceneBg"></div><div id="scene3d"></div><div id="uiHost"></div><div id="loading">1298 arayüzü yükleniyor…</div></div></section>
<section id="world"><div id="canvasWrap"></div><div id="worldStage"><div id="worldStageInner" class="worldStageInner"></div></div><div id="worldLoader" class="worldLoader"><h2>MORADON</h2><div class="wbar"><i id="worldFill"></i></div><p id="worldText">Loading USKO 1298 zone...</p></div></section>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="ui1298.js?v=10"></script>
<script src="ui1298_patch.js?v=10"></script>
<script src="exactui1298.js?v=10"></script>
<script src="worlddata1298.js?v=10"></script>
<script src="world1298.js?v=10"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),game=$('game'),launcher=$('launcher'),stage=$('stage'),bg=$('sceneBg'),scene3d=$('scene3d'),host=$('uiHost'),loading=$('loading');
let nation=2,character=null,selectedServer=true,createState={race:null,job:null,face:0,hair:0};
const cache=new Map();
function fit(){let s=Math.min(innerWidth/1024,innerHeight/768);stage.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
function showGame(){launcher.classList.remove('on');game.classList.add('on')}
function wait(v=true){loading.classList.toggle('on',v)}
async function ui(path){if(!cache.has(path))cache.set(path,N3UI.loadUI(path));return cache.get(path)}
function clearScene(){bg.innerHTML='';scene3d.innerHTML='';host.innerHTML='';host.style.pointerEvents='none'}
async function loginBackground(which='el'){bg.innerHTML='';let names=which==='ka'?['ka_login01_img_us.DXT','ka_login02_img_us.DXT','ka_login03_img_us.DXT']:['el_login01_img_us.DXT','el_login02_img_us.DXT','el_login03_img_us.DXT'];try{let a=await Promise.all(names.map(x=>N3UI.texCanvas('UI_US/'+x))),cv=document.createElement('canvas');cv.width=1024;cv.height=768;let c=cv.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,1024,768);c.drawImage(a[0],0,0,512,512);c.drawImage(a[1],512,0,512,512);c.drawImage(a[2],0,512,1024,256);bg.appendChild(cv)}catch(e){console.warn('login bg',e)}}
function actionName(id){return String(id||'').toLowerCase()}
function ctl(...ids){for(let id of ids){let c=N3ExactUI.get(id);if(c)return c}return null}
function setInput(ids,value){let c=ctl(...ids);if(c?.setValue)c.setValue(value)}
function textClick(ids,fn){let c=ctl(...ids);if(!c)return;let r=c.node.region,h=document.createElement('div');h.style.cssText=`position:absolute;left:${r.l}px;top:${r.t}px;width:${r.r-r.l}px;height:${r.b-r.t}px;z-index:3000;cursor:pointer;background:transparent;pointer-events:auto`;h.onclick=fn;host.appendChild(h)}
async function login(){showGame();wait();clearScene();await loginBackground('el');let root=await ui('UI_US/co_login_us.uif');let group=N3UI.find(root,'Group_LogIn')?'Group_LogIn':null;await N3ExactUI.render(root,host,{subtree:group,native:false,onAction:(id)=>{let k=actionName(id);if(k==='btn_login'||k==='btn_ok'){let a=ctl('Edit_ID')?.getValue?.().trim(),p=ctl('Edit_PW')?.getValue?.();if(a==='osevinc'&&p==='osevinc')server();}else if(k==='btn_cancel'){location.reload()}else if(k==='btn_homepage'||k==='btn_join'){window.open('https://github.com/orhansevinc/oldera-preview','_blank')}}});setInput(['Edit_ID'],'osevinc');setInput(['Edit_PW'],'osevinc');wait(false)}
async function server(){wait();clearScene();await loginBackground('el');let root=await ui('UI_US/co_login_us.uif'),sub=N3UI.find(root,'Group_ServerList_01')?'Group_ServerList_01':(N3UI.find(root,'Group_ServerList')?'Group_ServerList':null);await N3ExactUI.render(root,host,{subtree:sub,native:false,onAction:id=>{let k=actionName(id);if(k==='btn_connect')nationSelect();else if(k==='btn_cancel')login()}});let s=ctl('List_Server');if(s?.setText)s.setText('OldERA I');textClick(['List_Server'],()=>{selectedServer=true});wait(false)}
async function nationSelect(){wait();clearScene();bg.style.background='#000';let root=await ui('UI_US/co_nation_Select_us.uif');await N3ExactUI.render(root,host,{native:true,onAction:id=>{let k=actionName(id);if(k==='btn_elmo_selection'){nation=2;characterSelect()}else if(k==='btn_karus_selection'){nation=1;characterSelect()}else if(k==='btn_back')server()}});wait(false)}
async function characterSelect(){wait();clearScene();bg.style.background='#000';let path=nation===1?'UI_US/ka_characterselect_us.uif':'UI_US/el_characterselect_us.uif',root=await ui(path);await N3ExactUI.render(root,host,{native:true,onAction:id=>{let k=actionName(id);if(k==='bt_back')login();else if(k==='bt_exit')location.reload();else if(k==='bt_left'||k==='bt_right'){/* slot rotation is handled by original 3D scene module */}});let info=ctl('text00');if(info?.setText)info.setText(character?`Level: 1\nID: ${character.name}`:'');document.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();character?enterWorld():characterCreate()}};let center=document.createElement('div');center.style.cssText='position:absolute;left:350px;top:120px;width:324px;height:540px;z-index:2500;cursor:pointer;background:transparent;pointer-events:auto';center.ondblclick=()=>character?enterWorld():characterCreate();host.appendChild(center);wait(false)}
function refreshCreate(){let ids=['btn_race_el_ba','btn_race_el_rm','btn_race_el_rf','btn_race_ka_at','btn_race_ka_tu','btn_race_ka_wt','btn_race_ka_pt'];ids.forEach(x=>N3ExactUI.setSelected(x,x===createState.race));['btn_class_warrior','btn_class_rogue','btn_class_mage','btn_class_priest'].forEach(x=>N3ExactUI.setSelected(x,x===createState.job))}
async function characterCreate(){wait();document.onkeydown=null;clearScene();bg.style.background='#000';createState={race:null,job:null,face:0,hair:0};let path=nation===1?'UI_US/Ka_CharacterCreate_us.uif':'UI_US/El_CharacterCreate_us.uif',root=await ui(path);await N3ExactUI.render(root,host,{native:true,onAction:id=>{let k=actionName(id);if(/^btn_race_/.test(k)){createState.race=k;refreshCreate()}else if(/^btn_class_/.test(k)){createState.job=k;refreshCreate()}else if(k==='btn_face_left')createState.face=Math.max(0,createState.face-1);else if(k==='btn_face_right')createState.face=Math.min(3,createState.face+1);else if(k==='btn_hair_left')createState.hair=Math.max(0,createState.hair-1);else if(k==='btn_hair_right')createState.hair=Math.min(2,createState.hair+1);else if(k==='btn_cancel')characterSelect();else if(k==='btn_create'){let name=ctl('edit_name')?.getValue?.().trim();if(name&&createState.race&&createState.job){character={name,race:createState.race,job:createState.job,face:createState.face,hair:createState.hair};characterSelect()}}}});setInput(['edit_name'],'Osevinc');refreshCreate();wait(false)}
function enterWorld(){document.onkeydown=null;game.classList.remove('on');$('world').classList.add('on');try{OldERAWorld.start({name:character?.name||'Osevinc'})}catch(e){$('worldText').textContent='World error: '+e.message}}
$('launchStart').onclick=login;$('launchHome').onclick=()=>window.open('https://github.com/orhansevinc/oldera-preview','_blank');$('launchOption').onclick=()=>{};
})();
</script>
</body>
</html>
