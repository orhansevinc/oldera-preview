<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OldERA 1298</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Tahoma,Arial,sans-serif;color:#eee}button,input{font:inherit}.screen{position:fixed;inset:0;display:none}.screen.on{display:flex}.center{align-items:center;justify-content:center}.hide{display:none!important}
#launcher{background:radial-gradient(circle,#30201b,#080505 65%);align-items:center;justify-content:center}.launch{position:relative;width:min(512px,96vw);aspect-ratio:1/1;background:url('https://www.resimci.org/images/2020/10/27/image9186911c717421bd.png') center/100% 100% no-repeat;filter:drop-shadow(0 20px 40px #000)}.patchMask{position:absolute;left:4.5%;right:5.5%;top:77.0%;height:7.6%;background:#110a08cc}.patchText{position:absolute;left:5%;right:5%;top:75.8%;height:4%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:12px;text-shadow:1px 1px 2px #000}.bar{position:absolute;left:5.1%;right:5.7%;top:79.5%;height:3.5%;border:2px inset #d5b788;background:#260b0c;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(#efc9a4,#c8323f 48%,#8c121d 52%,#d03b42)}.launchHit{position:absolute;top:85.3%;height:8%;border:0;background:transparent;cursor:pointer}.startHit{left:4.1%;width:29%}.homeHit{left:35%;width:30%}.optionHit{left:66%;width:29%}.startHit:hover{outline:2px solid rgba(255,230,170,.45);outline-offset:-2px}
#game{background:#000;align-items:center;justify-content:center}.gameBg{position:absolute;inset:0;background:#000 center/cover no-repeat}.gameBg canvas{width:100%;height:100%;object-fit:cover}.panel{position:relative;z-index:5;background:rgba(5,4,3,.86);border:5px ridge #a6814e;box-shadow:0 0 0 2px #4c0f17,0 14px 45px #000;padding:18px;color:#ead9ab;text-shadow:1px 1px #000}.panel:before{content:"";position:absolute;inset:6px;border:1px solid #6c1c22;pointer-events:none}.loginPanel{width:305px;min-height:520px}.serverPanel{width:340px;min-height:570px}.panel h2{margin:0 0 20px;text-align:center;font-family:Georgia,serif;font-weight:normal;letter-spacing:2px;color:#e9d7a2}.fieldLabel{text-align:center;font:28px Georgia,serif;color:#e5d3a3;margin:4px 0}.koInput{width:100%;height:38px;background:#050505;border:2px solid #c8b879;color:#fff;padding:5px 9px;font-size:17px;outline:none}.goldBtn{width:100%;height:45px;margin-top:10px;border:3px ridge #d0bd8b;background:linear-gradient(#efe5c1,#c7ae70 47%,#8c7345 53%,#e4d5a4);color:#24180d;font-weight:bold;font-size:16px;cursor:pointer;text-shadow:none}.goldBtn:hover{filter:brightness(1.08)}.serverList{border:2px solid #c8b879;background:#050505;height:390px;padding:6px}.serverRow{height:35px;border-bottom:1px solid #8f8258;padding:8px;color:#fff;cursor:pointer}.serverRow.sel{background:#384425;color:#a7ff63}.smallNote{margin-top:8px;text-align:center;color:#c9b88e;font-size:11px}.charPanel{width:min(780px,92vw);min-height:560px}.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choiceBox{border:2px solid #887347;background:#080706;padding:12px}.choiceBox h3{margin:0 0 10px;text-align:center;color:#e6d39b}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{border:2px ridge #b49a66;background:#2b2115;color:#eee;padding:10px;cursor:pointer}.choice.on{background:#65512f;color:#fff4b8}.createBottom{display:grid;grid-template-columns:1fr 180px;gap:12px;margin-top:18px}.selectPanel{width:460px;text-align:center}.bigName{font:32px Georgia,serif;color:#f0d99e;margin:20px 0}.charSummary{font-size:17px;line-height:1.8}
#world{position:fixed;inset:0;display:none;background:#000}#world.on{display:block}#canvasWrap{position:absolute;inset:0}.worldUI{position:absolute;inset:0;pointer-events:none}#worldStage{position:absolute;width:1024px;height:768px;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center center;pointer-events:none}.worldStageInner{position:absolute;inset:0;pointer-events:auto}.worldLoader{position:absolute;inset:0;background:#060403f3;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}.worldLoader h2{font:normal 34px Georgia;color:#e2ca93;letter-spacing:4px}.worldLoader .wbar{width:500px;max-width:75vw;height:14px;border:2px ridge #896f48;background:#080706}.worldLoader i{display:block;height:100%;width:0;background:#b78a43}.worldLoader p{font-size:12px;color:#cdb987}
</style></head><body>
<section id="launcher" class="screen on"><div class="launch"><div class="patchMask"></div><div id="patchText" class="patchText">Update Completed</div><div class="bar"><i id="patchFill"></i></div><button id="launchStart" class="launchHit startHit" aria-label="Start"></button><button id="launchHome" class="launchHit homeHit" aria-label="HomePage"></button><button id="launchOption" class="launchHit optionHit" aria-label="Option"></button></div></section>
<section id="game" class="screen"><div id="gameBg" class="gameBg"></div><div id="gameHost"></div></section>
<section id="world"><div id="canvasWrap"></div><div id="worldStage"><div id="worldStageInner" class="worldStageInner"></div></div><div id="worldLoader" class="worldLoader"><h2>MORADON</h2><div class="wbar"><i id="worldFill"></i></div><p id="worldText">Loading USKO 1298 zone...</p></div></section>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script><script src="ui1298.js?v=7"></script><script src="ui1298_patch.js?v=7"></script><script src="worlddata1298.js?v=7"></script><script src="world1298.js?v=7"></script><script>
(()=>{const $=id=>document.getElementById(id),host=$('gameHost');let selectedServer=false;let char={race:'El Morad Male',job:'Warrior',name:'Osevinc'};
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}
async function makeBg(){try{let [a,b,c]=await Promise.all(['UI_US/el_login01_img_us.DXT','UI_US/el_login02_img_us.DXT','UI_US/el_login03_img_us.DXT'].map(N3UI.texCanvas));let cv=document.createElement('canvas');cv.width=1024;cv.height=768;let x=cv.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,1024,768);x.drawImage(a,0,0,512,512);x.drawImage(b,512,0,512,512);x.drawImage(c,0,512,1024,256);$('gameBg').innerHTML='';$('gameBg').appendChild(cv)}catch(e){$('gameBg').style.background='radial-gradient(circle at 50% 35%,#b48d62,#38241b 60%,#090605)'}}
function login(){show('game');host.innerHTML=`<div class="panel loginPanel"><h2>KNIGHT ONLINE</h2><div class="fieldLabel">ID</div><input id="idbox" class="koInput" value="osevinc" autocomplete="username"><div class="fieldLabel">Password</div><input id="pwbox" class="koInput" value="osevinc" type="password" autocomplete="current-password"><button id="loginBtn" class="goldBtn">Login</button><button class="goldBtn" onclick="location.reload()">Cancel</button><button class="goldBtn" id="optBtn">Option</button><button class="goldBtn" id="joinBtn">Join</button><div class="smallNote">OldERA · USKO 1298</div></div>`;$('#loginBtn').onclick=()=>{let a=$('idbox').value.trim(),b=$('pwbox').value;if(a==='osevinc'&&b==='osevinc')server();else alert('Test hesabı: osevinc / osevinc')};$('#optBtn').onclick=()=>alert('OldERA 1298 Options\nResolution: Browser\nVersion: 1298');$('#joinBtn').onclick=()=>alert('Registration will be added later.');$('#pwbox').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()}}
function server(){selectedServer=false;host.innerHTML=`<div class="panel serverPanel"><h2>Server</h2><div class="serverList"><div id="srv1" class="serverRow">OldERA I</div><div class="serverRow" style="opacity:.35">OldERA II</div></div><button id="connectBtn" class="goldBtn">Connect</button><button id="backBtn" class="goldBtn">Cancel</button></div>`;$('#srv1').onclick=()=>{selectedServer=true;$('#srv1').classList.add('sel')};$('#srv1').ondblclick=()=>{selectedServer=true;createChar()};$('#connectBtn').onclick=()=>{if(!selectedServer){$('#srv1').click();return}createChar()};$('#backBtn').onclick=login}
function createChar(){host.innerHTML=`<div class="panel charPanel"><h2>Character Creation</h2><div class="choiceGrid"><div class="choiceBox"><h3>Race</h3><div id="races" class="choices"><button class="choice on" data-v="El Morad Male">El Morad Male</button><button class="choice" data-v="El Morad Female">El Morad Female</button><button class="choice" data-v="Barbarian">Barbarian</button><button class="choice" data-v="Karus">Karus</button></div></div><div class="choiceBox"><h3>Class</h3><div id="jobs" class="choices"><button class="choice on" data-v="Warrior">Warrior</button><button class="choice" data-v="Rogue">Rogue</button><button class="choice" data-v="Mage">Mage</button><button class="choice" data-v="Priest">Priest</button></div></div></div><div class="createBottom"><input id="charName" class="koInput" value="${char.name}" maxlength="20"><button id="createBtn" class="goldBtn" style="margin:0">Create</button></div><button id="charBack" class="goldBtn">Cancel</button></div>`;document.querySelectorAll('#races .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#races .choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');char.race=b.dataset.v});document.querySelectorAll('#jobs .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#jobs .choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');char.job=b.dataset.v});$('#createBtn').onclick=()=>{char.name=$('charName').value.trim()||'Osevinc';selectChar()};$('#charBack').onclick=server}
function selectChar(){host.innerHTML=`<div class="panel selectPanel"><h2>Character Select</h2><div class="bigName">${char.name}</div><div class="charSummary">${char.race}<br>${char.job}<br>Level 1</div><button id="worldBtn" class="goldBtn">Start</button><button id="selBack" class="goldBtn">Back</button></div>`;$('#worldBtn').onclick=enterWorld;$('#selBack').onclick=createChar}
function enterWorld(){show('world');$('world').classList.add('on');try{OldERAWorld.start({name:char.name})}catch(e){$('worldText').textContent='World error: '+e.message}}
$('#launchHome').onclick=()=>window.open('https://github.com/orhansevinc/oldera-preview','_blank');$('#launchOption').onclick=()=>alert('OldERA 1298\nGame Version: 1298\nResolution: Browser');$('#launchStart').onclick=login;
$('patchText').textContent='Update Completed';$('patchFill').style.width='100%';$('launchStart').disabled=false;makeBg();
})();
</script></body></html>
