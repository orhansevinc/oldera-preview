#error{display:none;position:fixed;inset:auto 20px 20px 20px;z-index:10;background:#160909;color:#ffd4d4;border:1px solid #8a3b3b;padding:12px;font:12px/1.45 Consolas,monospace;white-space:pre-wrap;max-height:45vh;overflow:auto}
</style>
</head>
<body>
<div id="frame"><canvas id="game" width="1024" height="768" tabindex="0"></canvas></div>
<div id="status">OldERA v2 başlatılıyor…</div>
