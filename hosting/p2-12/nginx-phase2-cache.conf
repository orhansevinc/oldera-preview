# P2-12 integration proposal for P2-00, reconciled with P2-02 @ 729f9029d563f72728a7251869d2633fb1bdd5e3.
# Do not include blindly beside duplicate locations; P2-00 owns the final nginx composition.

# http {} scope
map $http_upgrade $oldko_connection_upgrade {
    default upgrade;
    ''      close;
}

# P2-02 runtime URLs include ?sha256=...&bytes=...&cv=.... Only those exact
# versioned requests may become long-lived immutable. Unversioned runtime files
# stay revalidated so a bad/stale package cannot become sticky for a year.
map $arg_sha256 $oldko_runtime_cache_control {
    ""      "public, max-age=3600, must-revalidate";
    default "public, max-age=31536000, immutable";
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
# Deliberately omit application/octet-stream so KnightOnLine.data is not blindly recompressed.
gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

types {
    application/wasm wasm;
    application/javascript js;
    application/octet-stream data;
    application/json json;
}

# P2-02 manifest is the identity authority for exact runtime bytes.
location = /real1298/runtime-manifest.json {
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

# Loading shell/service-worker fixes must revalidate instead of becoming immutable.
location = /play-cache-worker.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
location = /play-loading-v2.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# In play.oldkoweb.com server {}. P2-00 should keep the play HTML/root non-immutable.
location /real1298/ {
    try_files $uri =404;
    add_header Cache-Control $oldko_runtime_cache_control always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Accept-Ranges "bytes" always;
}

# WebSocket routes. HTTP 101 only proves transport, not authenticated game login.
location /auth {
    proxy_pass http://auth_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $oldko_connection_upgrade;
    proxy_set_header Origin $http_origin;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

location /game {
    proxy_pass http://game_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $oldko_connection_upgrade;
    proxy_set_header Origin $http_origin;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# API/auth/admin responses must never inherit static-asset cache policy.
location /api/account/ {
    proxy_pass http://account_api;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
}

location /api/admin/ {
    proxy_pass http://admin_api;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
}
