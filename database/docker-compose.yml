services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oldko
      POSTGRES_USER: oldko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oldko_dev_only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oldko -d oldko"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - oldko_pgdata:/var/lib/postgresql/data
volumes:
  oldko_pgdata:
