server {
    listen 8080;
    server_name _;
    default_type application/json;
    location = /api/admin/health { return 200 '{"ok":true,"mode":"LOCAL_TEST_FIXTURE","productionAdmin":false}\n'; }
    location /api/admin/ { return 503 '{"ok":false,"code":"NOT_CONFIGURED","message":"Real WS08 production admin image/adapters are not part of this fixture bundle."}\n'; }
}
