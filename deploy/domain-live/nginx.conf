worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream account_api { server account-api:8081; }
  upstream admin_api { server runtime:8088; }
  upstream auth_gateway { server gateway-auth:8080; }
  upstream game_gateway { server gateway-game:8080; }

  server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1 _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/account/ { proxy_pass http://account_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/admin/ { proxy_pass http://admin_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /auth { proxy_pass http://auth_gateway; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Origin $http_origin; proxy_set_header Host $host; }
    location /game { proxy_pass http://game_gateway; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Origin $http_origin; proxy_set_header Host $host; }
    location /admin/ { alias /usr/share/nginx/html/admin/; try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }
  }

  server {
    listen 8080;
    server_name oldkoweb.com www.oldkoweb.com;
    root /usr/share/nginx/html;
    index index.html;
    location /api/account/ { proxy_pass http://account_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { try_files $uri $uri/ /index.html; }
  }

  server {
    listen 8080;
    server_name admin.oldkoweb.com;
    root /usr/share/nginx/html/admin;
    index index.html;
    location /api/admin/ { proxy_pass http://admin_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { try_files $uri $uri/ /index.html; }
  }

  server {
    listen 8080;
    server_name play.oldkoweb.com;
    root /usr/share/nginx/html;

    location /auth {
      proxy_pass http://auth_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Origin $http_origin;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location /game {
      proxy_pass http://game_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Origin $http_origin;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # The public play root serves only the genuine OpenKO C++/WASM client.
    # COOP+COEP are required by the P2-00 pthread build and must be present on
    # the top-level document, not only on child runtime files.
    location = / {
      try_files /real1298/index.html =404;
      add_header Cache-Control "no-store" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location = /real1298/runtime-manifest.json {
      try_files $uri =404;
      add_header Cache-Control "no-store" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~ ^/(play-loading-v2|play-cache-recovery|play-cache-worker|phase2-runtime-bridge)\.js$ {
      try_files $uri =404;
      add_header Cache-Control "no-cache, must-revalidate" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location /real1298/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Accept-Ranges "bytes" always;
    }
  }
}
