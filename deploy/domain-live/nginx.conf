worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream account_api { server account-api:8081; }
  upstream admin_api { server runtime:8088; }
  upstream auth_gateway { server gateway-auth:8080; }
  upstream game_gateway { server gateway-game:8080; }

  server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1 _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/account/ { proxy_pass http://account_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/admin/ { proxy_pass http://admin_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /auth { proxy_pass http://auth_gateway; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Origin $http_origin; proxy_set_header Host $host; }
    location /game { proxy_pass http://game_gateway; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Origin $http_origin; proxy_set_header Host $host; }
    location /admin/ { alias /usr/share/nginx/html/admin/; try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }
  }

  server {
    listen 8080;
    server_name oldkoweb.com www.oldkoweb.com;
    root /usr/share/nginx/html;
    index index.html;
    location /api/account/ { proxy_pass http://account_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { try_files $uri $uri/ /index.html; }
  }

  server {
    listen 8080;
    server_name admin.oldkoweb.com;
    root /usr/share/nginx/html/admin;
    index index.html;
    location /api/admin/ { proxy_pass http://admin_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { try_files $uri $uri/ /index.html; }
  }

  server {
    listen 8080;
    server_name play.oldkoweb.com;
    root /usr/share/nginx/html;
    index real1298.html play.html;
    location /auth { proxy_pass http://auth_gateway; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Origin $http_origin; proxy_set_header Host $host; }
    location /game { proxy_pass http://game_gateway; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Origin $http_origin; proxy_set_header Host $host; }
    location = / { try_files /real1298.html /play.html =404; }
    location / { try_files $uri $uri/ =404; }
  }
}
