<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>OldKOWeb — 1298 Browser Client</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#e8dcc0;font-family:Arial,sans-serif}
#canvas{display:block;width:100vw;height:100vh;background:#000;outline:none}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#050505;z-index:3;pointer-events:none;transition:opacity .2s}
#boot.done{opacity:0}
#bootbox{text-align:center;max-width:520px;padding:24px}
#bootbox b{display:block;font-size:22px;letter-spacing:.08em;color:#e4a83d;margin-bottom:8px}
#bootbox span{font-size:13px;color:#aaa}
</style>
</head>
<body>
<canvas id="canvas" width="1280" height="720" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="boot"><div id="bootbox"><b>OLDKOWEB 1298</b><span>Gerçek oyun istemcisi yükleniyor…</span></div></div>
<script>
(()=>{
  'use strict';
  const NativeWebSocket=window.WebSocket;
  const rewrite=(value)=>{
    const raw=String(value||'');
    try{
      const u=new URL(raw,location.href);
      const port=u.port;
      if(port==='15100'||port==='15001'){
        const scheme=location.protocol==='https:'?'wss:':'ws:';
        const path=port==='15100'?'/auth':'/game';
        return `${scheme}//${location.host}${path}`;
      }
    }catch(_){}
    return raw;
  };
  window.WebSocket=new Proxy(NativeWebSocket,{
    construct(Target,args){
      const next=[...args];
      next[0]=rewrite(next[0]);
      return Reflect.construct(Target,next,Target);
    }
  });

  const canvas=document.getElementById('canvas');
  const boot=document.getElementById('boot');
  const statusText=document.querySelector('#bootbox span');
  const showStatus=(text)=>{ if(text) statusText.textContent=String(text); };
  const focus=()=>canvas.focus({preventScroll:true});
  window.addEventListener('load',focus,{once:true});
  window.addEventListener('pointerdown',focus);

  window.Module={
    canvas,
    arguments:['--renderer','gl','--data','/data'],
    locateFile:(path)=>`/real1298/${path}`,
    setStatus:(text)=>{
      const s=String(text||'');
      const m=s.match(/^Downloading data\.\.\. \((\d+)\/(\d+)\)$/);
      if(m){
        const loaded=Number(m[1]),total=Number(m[2]);
        const pct=total>0?Math.floor((loaded/total)*100):0;
        showStatus(`Oyun verileri indiriliyor… %${pct}`);
      }else if(s){
        showStatus(s.replace('Downloading data...','Oyun verileri indiriliyor…'));
      }
    },
    monitorRunDependencies:(left)=>{
      if(left>0) showStatus(`Oyun dosyaları hazırlanıyor… (${left})`);
    },
    print:(...a)=>console.log('[OldKOWeb]',...a),
    printErr:(...a)=>console.error('[OldKOWeb]',...a),
    onRuntimeInitialized:()=>{boot.classList.add('done');setTimeout(()=>boot.remove(),250);focus();},
    onAbort:(reason)=>showStatus(`İstemci başlatılamadı: ${reason}`)
  };
  window.addEventListener('error',(event)=>showStatus(`Oyun yüklenemedi: ${(event&&event.message)||'JavaScript hatası'}`));
  window.addEventListener('unhandledrejection',(event)=>showStatus(`Oyun yüklenemedi: ${event&&event.reason?String(event.reason):'bilinmeyen hata'}`));
})();
</script>
<script async src="/real1298/KnightOnLine.js"></script>
</body>
</html>
