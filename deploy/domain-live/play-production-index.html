<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>OldKOWeb — 1298 Browser Client</title>
<style>
:root{color-scheme:dark;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#f4ead3}#canvas{display:block;width:100vw;height:100vh;background:#000;outline:none}.loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#08090b url('/assets/moradon-1299.jpg') center/cover no-repeat;transition:opacity .25s}.loader:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,4,6,.58),rgba(3,4,6,.93))}.loader[hidden]{display:none}.panel{position:relative;width:min(680px,calc(100vw - 34px));padding:28px;border:1px solid rgba(224,184,104,.42);border-radius:18px;background:rgba(7,8,10,.86);box-shadow:0 28px 80px #000;backdrop-filter:blur(8px)}.eyebrow{margin:0 0 7px;color:#d8ad5d;font-size:12px;font-weight:900;letter-spacing:.18em}.title{margin:0;font-size:clamp(28px,5vw,48px);line-height:1}.stage{margin:15px 0 12px;color:#d6d2ca;font-size:14px}.bar{height:12px;overflow:hidden;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:#17191d}.fill{width:0;height:100%;background:linear-gradient(90deg,#9f732e,#e0b868);transition:width .1s linear}.meta{display:flex;justify-content:space-between;gap:16px;margin-top:9px;color:#989da6;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.detail{margin:16px 0 0;color:#8e939b;font-size:12px;line-height:1.5}.error{margin-top:14px;padding:11px 12px;border:1px solid rgba(255,104,104,.4);border-radius:10px;background:rgba(120,20,20,.22);color:#ffc8c8;font-size:13px}.retry{margin-top:12px;padding:10px 15px;border:1px solid #d8ad5d;border-radius:9px;background:#a47630;color:#100d08;font-weight:850;cursor:pointer}.retry[hidden],.error[hidden]{display:none}.dev{position:fixed;right:10px;bottom:9px;z-index:5;color:#777;font:10px ui-monospace,monospace;pointer-events:none}@media(max-width:560px){.panel{padding:21px}.meta{display:grid;gap:5px}}
</style>
</head>
<body>
<canvas id="canvas" width="1280" height="720" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="loader" class="loader" role="status" aria-live="polite">
  <section class="panel">
    <p class="eyebrow">OLDKOWEB · KNIGHT ONLINE 1298</p>
    <h1 class="title">Moradon'a hazırlanıyor</h1>
    <p id="loadStage" class="stage">Sürüm doğrulanıyor…</p>
    <div class="bar" aria-hidden="true"><div id="loadFill" class="fill"></div></div>
    <div class="meta"><span id="loadPercent">0%</span><span id="loadBytes">0 B / —</span></div>
    <p id="loadDetail" class="detail">İlerleme gerçek indirilen/verilen byte ve runtime aşamalarından hesaplanır; zamanlayıcı kullanılmaz.</p>
    <div id="loadError" class="error" hidden></div>
    <button id="loadRetry" class="retry" type="button" hidden>Yeniden dene</button>
  </section>
</div>
<div id="buildStamp" class="dev"></div>
<script src="/real1298/play-loading.js"></script>
</body>
</html>
